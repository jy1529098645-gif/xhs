d2bd645cb4fe/1040g00831vte7fh5iq6g5pdspkkjkhb8ipqtb6o!nd_dft_wlteh_webp_3", "width": 1920, "height": 2560}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121340/f4f432cd8e4b67ed9260f00ca086f838/1040g00831vte7fh5iq4g5pdspkkjkhb83pvlb4g!nd_dft_wlteh_webp_3", "width": 1920, "height": 2560}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121340/db7f818324b0cf55747736fe658f425c/notes_pre_post/1040g3k031vlpruujjqe05pdspkkjkhb8v3ml6pg!nd_dft_wlteh_webp_3", "width": 1920, "height": 2560}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121340/0ba32426b85b09b98796ce6108cae9d0/notes_pre_post/1040g3k031vlprunbjq005pdspkkjkhb8rou9pl8!nd_dft_wlteh_webp_3", "width": 1920, "height": 2560}], "comments": []}, {"note_id": "686bb37d0000000012014b94", "xsec_token": "AByMW4dCnxTeALpvYWSOwaq_3Kk7GHtUvLkGzHdsrRf-4=", "url": "https://www.xiaohongshu.com/explore/686bb37d0000000012014b94?xsec_token=AByMW4dCnxTeALpvYWSOwaq_3Kk7GHtUvLkGzHdsrRf-4=&xsec_source=pc_search", "type": "normal", "title": "3天极限写完开题报告，没想到被导师夸写得好", "body": "导师放养式指导，实习忙得脚不沾地，选题方法到ddl前三天才确定，我是如何做到上交后导师竟然夸我思路清晰写得好！今天小挞就把俺的开题保命经验分享出来：\n\t\n1️⃣制作研究思路框架图，让人一眼懂研究什么\n开题报告蕞关键的，就是用清晰的逻辑框架告诉导师「你要研究什么、怎么研究、能产出什么」基本要包括：\n[一R]研究背景与意义\n• 现实背景：用数据/案例说明研究对象的现状\n• 理论缺口：梳理文献后提出「现有研究忽略了XX因素」或「缺乏XX视角的分析」\n• 研究价值：分学术价值（填补理论空白）和实践价值（帮助XX群体解决XX问题）\n[二R]核心研究问题\n把大选题拆解成3-5个具体问题，建议用「递进式提问」：\n① 当前XX模式存在哪些不足？\n② 导致这些问题的关键因素是什么？\n③ 如何通过XX方法优化该模式？\n[三R]研究方法\n• 定量方法：问卷调查、内容分析等\n• 定性方法：深度访谈、扎根理论等\n[四R]预期成果与创新点\n• 成果：预计得出XX模型/策略/结论，形成XX字论文\n• 创新：从研究视角（新理论结合）、方法（多学科交叉）、数据（独家调研）找差异化\n\t\n✅操作Tips：\n用XMind或wps把上述内容做成思维导图，每写一部分就对照框架检查，确保全文逻辑环环相扣。这个框架既是开题报告的骨架，也是未来论文写作的导航图！\n\t\n3️⃣AI工具高效辅助，时间管理大师\n时间紧迫时，善用AI能让效率翻倍，分享一套亲测高效的「秘塔+Kimi」组合拳：\n[一R]文献初筛：打开秘塔AI，输入 “请帮我梳理关于[XX领域]的论文，按照理论发展脉络整理”，它会自动生成文献概要，重点是附带PDF原文件。一定要对照原文件核实，避免编造！\n[二R]观点精细化提取：把下载好的文献投喂给Kimi，发送指令 “我正在撰写[XX主题]论文，请将这些文献中，不同学者的核心观点、研究结论逐条列出” ，Kimi能快速拆解文献，整理成清晰的观点清单。\n[三R]综述框架搭建：再给Kimi下达指令 “请根据上述观点，按照文献综述的逻辑进行分类整合，并总结研究空白” ，它会输出结构化的综述框架，自己进行修改和补充，一篇文献综述就高效成型了。\n\t\n3️⃣稳住心态，拒绝代写\n三天写完确实要熬夜，但能成！千万不要找代写🙅‍♀️大部分都是骗子，靠天靠地不如靠自己！我能写完你也能，祝大家开题顺利[派对R]\n\t\n#开题报告[话题]# #开题报告技巧[话题]# #开题报告写作[话题]#", "author_id": "63b1cc3200000000260076c0", "author_nickname": "小挞要上岸（接咨询版）", "publish_time_ms": 1751888765000, "ip_location": null, "liked_count": 35, "collected_count": 36, "comment_count": 9, "share_count": 5, "image_count": 3, "video_url": null, "video_duration_ms": null, "crawled_at": 1778564458061, "tags": ["开题报告", "开题报告技巧", "开题报告写作"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121340/fb53f97e515ac3659d26e4faef0cb74a/1040g2sg31jkp6vvqj6f05othpgp9gtm0onr6grg!nd_dft_wlteh_webp_3", "width": 3024, "height": 4032}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121340/d02316fbc59f1290f4d2b3cb3eb57c34/1040g2sg31jkp6vvqj6e05othpgp9gtm0udccgd0!nd_dft_wlteh_webp_3", "width": 848, "height": 1482}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121340/c10b5fa3c5c6cd3e7eb0a78679886042/1040g2sg31jkp6vvqj6eg5othpgp9gtm0ad5elno!nd_dft_wlteh_webp_3", "width": 860, "height": 1689}], "comments": []}, {"note_id": "692b053a000000001e03aca6", "xsec_token": "AB4Em04iuEi0DEwOSIoTns9Hp0KsadiOdVPNx9a0wWGBg=", "url": "https://www.xiaohongshu.com/explore/692b053a000000001e03aca6?xsec_token=AB4Em04iuEi0DEwOSIoTns9Hp0KsadiOdVPNx9a0wWGBg=&xsec_source=pc_search", "type": "normal", "title": "", "body": "毕业论文到底怎么写啊😭开题报告已经交了，但是正式论文的初稿不知道从何下手😭😭#毕业[话题]# #论文[话题]# #大学生[话题]# #写毕业论文时的精神状态[话题]#", "author_id": "60e915b1000000002002a697", "author_nickname": "吃不吃麻薯", "publish_time_ms": 1764427066000, "ip_location": null, "liked_count": 2059, "collected_count": 1643, "comment_count": 107, "share_count": 112, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778564483073, "tags": ["毕业", "论文", "大学生", "写毕业论文时的精神状态"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121341/0f528af8ba715b64dac0c419bd5ff5e1/1040g2sg31pfmin0q2ge05o792moo59kn08gpj1g!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": []}, {"note_id": "675013f9000000000202ece7", "xsec_token": "AByqaVmrIL-lueCkHVQgxiRtu_PAR9s7Sbm3VJMTxy1sA=", "url": "https://www.xiaohongshu.com/explore/675013f9000000000202ece7?xsec_token=AByqaVmrIL-lueCkHVQgxiRtu_PAR9s7Sbm3VJMTxy1sA=&xsec_source=pc_search", "type": "normal", "title": "30天完成6.6w硕士论文，谈谈我的进度安排：", "body": "我是从八月中旬开始写初稿，建好框架后，又开始跑校招，论文就暂时搁置。到11月底完成，期间断断续续差不多花了30天。个人感觉写论文时间线不能拖太长，不然很容易崩溃疲惫，20-30天是比较理想的。在正式动笔前，我的实验已经全部完成(这是前提)，进度安排分享给uu们👇👇：\n\t\n1⃣ 框架先行（1-2day）\n我花了1天时间用Word建立了论文框架，从一级标题开始，逐级细化到二级、三级标题 (利用Word的“样式”功能，后续可以节省制作目录的时间)。在搭建框架的过程中，参考同领域内好学校的硕士论文，并结合自己师门内的要求，明确所有需要撰写的内容\n\t\n2⃣ 文献综述与研究内容交叉推进（10-15day）\n写文献综述时，更多时间花在了查找相关研究上。找到相关研究后，直接放入对应框架中，后续再来降重润色。因此，这部分对我来说不需要太多脑力和精力。相比之下，撰写研究设计和结果，需要花更多精力去梳理报告的思路和逻辑。\n\t\n我一般在上午精力充沛时写研究内容，学不进去的话，就去搜文献，再把相关研究裁缝到文献综述中。如果实在感到疲惫，就完成图表绘制等相对轻松的任务。\n\t\n3⃣ 借助工具完成讨论部分（5-8day）\n写完研究内容后，我列出了所有支持和不支持假设的结果，然后投喂给ai，让它帮我查找与研究结果相关的文献和理论支持，在此基础上构建讨论框架，并结合自己的理解进行深入分析和完善。\n\t\n研究局限性和未来进展部分，像心理学领域，常见的局限就是问卷主观报告、样本代表性不足等问题，可直接借鉴。\n\t\n4⃣ 最后完成引言与摘要（3-5day）\n一般引言包括四个部分：研究背景与现状、以往研究不足、本研究内容与创新、研究意义，篇幅大概在800-1200字左右。将引言放在最后写，其实是从整体上概括整篇论文的核心内容。完成后，可借助gpt提炼和浓缩，即摘要。\n/\n更重要的是：克服畏难情绪和完美主义\n\t\n做好计划后，每天推进一点点，哪怕写得很烂，也要坚持写下去。对我而言，写大论文是庞大的工程，这过程中会无数次陷入焦虑、痛苦和迷茫，觉得自己的研究毫无意义。然后又安慰自己，再坚持一下就好，我只需要完成初稿，哪怕是给导师拉了一坨大的。\n\t\n所以，先完成，再完美。\n·\n#很担心论文人的精神状态[话题]# #硕士论文选题[话题]# #研究生日常[话题]# #硕士毕业论文[话题]# #硕士开题报告[话题]# #论文[话题]# #study[话题]# #study_account[话题]# #研三论文初稿狗[话题]#", "author_id": "5b6fcd8f4c078b0001cf875e", "author_nickname": "芝士的夏天", "publish_time_ms": 1733301241000, "ip_location": null, "liked_count": 4957, "collected_count": 5436, "comment_count": 135, "share_count": 498, "image_count": 2, "video_url": null, "video_duration_ms": null, "crawled_at": 1778564507366, "tags": ["很担心论文人的精神状态", "硕士论文选题", "研究生日常", "硕士毕业论文", "硕士开题报告", "论文", "study", "study_account", "研三论文初稿狗"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121341/9d4649b125b4939dbd7f224ebfb6f1ad/1040g00831av 64542001, "tags": ["生化环材", "实验", "开题", "论文写作", "硕士开题报告", "开题报告模板", "被导师支配的恐惧", "论文开题攻略", "精神状态"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121342/6304406c863eba7fc54850037ccf2178/1040g2sg31lbnead8lie05nrteeog8e2mt4tvmog!nd_dft_wlteh_webp_3", "width": 995, "height": 1258}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121342/e95619457b6da69f172e93b4354ea86a/1040g2sg31lbnead8lieg5nrteeog8e2mvvh6sko!nd_dft_wgth_webp_3", "width": 3049, "height": 2929}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121342/bcc074b58ab830dc13c77939d5c9537d/1040g2sg31lbnead8lif05nrteeog8e2mv7n6v28!nd_dft_wlteh_webp_3", "width": 3024, "height": 4032}], "comments": []}, {"note_id": "68c6e6f9000000001b033d4f", "xsec_token": "AB0-7f9-F5ZITdeWQQaDbdiM7zsRTP_CWYA5eN4NK5w7k=", "url": "https://www.xiaohongshu.com/explore/68c6e6f9000000001b033d4f?xsec_token=AB0-7f9-F5ZITdeWQQaDbdiM7zsRTP_CWYA5eN4NK5w7k=&xsec_source=pc_search", "type": "normal", "title": "", "body": "开题报告怎么这么难写啊，崩溃的哭了[哭惹R][哭惹R]#开题报告[话题]#", "author_id": "5d590a7a0000000001007a39", "author_nickname": "不能再吃了", "publish_time_ms": 1757865721000, "ip_location": null, "liked_count": 529, "collected_count": 312, "comment_count": 79, "share_count": 60, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778564655216, "tags": ["开题报告"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121344/d99349a2ecb9ed9faee36a0764b3716f/1040g2sg31mdtthklmg705nap19t08uhp73h9m50!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": []}, {"note_id": "69e29ca4000000001b003158", "xsec_token": "AB8QJH23i7FLmBJMZn_oHRPXX8O4zfKQqFD6X3W_mBF3k=", "url": "https://www.xiaohongshu.com/explore/69e29ca4000000001b003158?xsec_token=AB8QJH23i7FLmBJMZn_oHRPXX8O4zfKQqFD6X3W_mBF3k=&xsec_source=pc_search", "type": "normal", "title": "2026.4.18", "body": "4.43 我妈呀我爸呀我服了。毕业论文除了当初ai出来的开题报告基本一字没写。好消息和学年论文方向差不多，坏消息学年论文也像屎。4.23号就要答辩了我仍在初始状态，老派导师全放养用邮箱交流。现在仍在小红书找一天赶完论文的攻略，我将叩拜朋友寻找秘方，必须七点半就起来写论文！\n\t\n8.00 起来赶论文。\n\t\n10.47 真不能玩了。。。\n\t\n23.30 谢谢善良的朋友们，哭了，我一定写到致谢里。一下午磨磨蹭蹭搞了个五千字的框架，仍然是屎。好消息同组成员前几天交的初稿老师还没回复，坏消息老师批阅慢而且我还要赶明天中午的车去湖南。小睡一会儿早点儿起来继续捋。\n\t\n4/19 7.41 实则大睡，但是因为感冒了断断续续的，所以也不能算睡得很好。继续写了。\n\t\n9.22 一头扎进了硕士学位论文里，他们写得真好。没有方向和结构想法可以先找学位论文看看，心里有点儿底会好很多。\n\t\n21.21 河南郑州，中转两小时郑州情，一生河南人！郑州今晚下雨，蛮冷的。今晚在郑州的人出门要多穿衣服戴好伞，别感冒了。\n\t\n4/20 23.16 返校休整+重写第三章，字数七千，但格式还没着落，今晚决意和论文一战。\n\t\n4/21 1.47 偷玩惊醒。\n\t\n20.17 喜报！昨晚奋战一夜到中午一点内容全部写完。然后找人改了格式就一觉睡到下午五点，现在基本搞定初稿，今晚发给导师。虽然没有全部搞定，但是总算拿出东西能松一口气。由于只剩两次修改次数所以之后只会在有阶段性成果的时候编辑[赞R]\n\t\n4/27 14.12 后来初稿被导师喷得狗血淋头又怒改一晚改出还算不错的三号稿，答辩也顺利通过，至此已经全部搞定。在这个过程中有自己的努力，有朋友的帮助，有网友的支招，谢谢大家。短暂的网络相遇足以互相温暖，后来的朋友有烦恼也可以评论，我都会回。遇到难以解决的问题和情绪，要及时寻找帮助，主动总会有一些回应，当然更多要相信自己，自己也要努力解决，必要时刻使用金钱也是需要及时取舍的。我的大学生涯即将结束，祝愿自己和在座以及后来的诸位平安顺遂。期待会有下一次相遇。#毕业[话题]# #毕业论文[话题]#", "author_id": "6616434e0000000003033d27", "author_nickname": "装A不成遭雷劈", "publish_time_ms": 1776458916000, "ip_location": "湖南", "liked_count": 4660, "collected_count": 3530, "comment_count": 504, "share_count": 300, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778564687098, "tags": ["毕业", "毕业论文"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121344/1fdb5114b4996c73ee7480d3b25ef03c/1040g00831v2vmnpt3m6g5pgm8d70uf97q3f8nt8!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": []}, {"note_id": "69d240f50000000020039af2", "xsec_token": "ABvxvNjbnzI2KNXd--KYob8AzGs7yTQ5s982XJsijRl9Y=", "url": "https://www.xiaohongshu.com/explore/69d240f50000000020039af2?xsec_token=ABvxvNjbnzI2KNXd--KYob8AzGs7yTQ5s982XJsijRl9Y=&xsec_source=pc_search", "type": "normal", "title": "从摘要到讨论，一篇不合格论文的典型问题", "body": "论文题目：XX市某院病区库房差错分析及预防#论文写作[话题]# #毕业论文[话题]#", "author_id": "60399cc7000000000100a500", "author_nickname": "黑板之外", "publish_time_ms": 1775390538000, "ip_location": null, "liked_count": 2562, "collected_count": 2490, "comment_count": 1628, "share_count": 273, "image_count": 11, "video_u const fmt = (n) => {
  if (n === null || n === undefined) return '-';
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return String(n);
};
const escapeHtml = (s) => {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
};
const tsFmt = (ms) => {
  if (!ms) return '';
  const d = new Date(ms);
  return d.toLocaleString('zh-CN', {hour12: false});
};

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const sortSel = document.getElementById('sort');
const countChip = document.getElementById('count-chip');

document.getElementById('stats').textContent =
  `共 ${DATA.stats.notes} 篇笔记 · ${DATA.stats.comments} 条评论 · ${DATA.stats.images} 张图片 · `
  + `生成于 ${new Date(DATA.generated_at).toLocaleString('zh-CN', {hour12:false})}`;

function rank(n, key) {
  if (key === 'engagement') {
    return (n.liked_count||0) + (n.collected_count||0) + (n.comment_count||0)*2 + (n.share_count||0)*3;
  }
  return n[key] || 0;
}

function matches(n, q) {
  if (!q) return true;
  q = q.toLowerCase();
  const hay = [n.title, n.body, n.author_nickname, ...(n.tags||[]),
               ...(n.comments||[]).map(c => c.content + ' ' + (c.nickname||''))]
              .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

function thumbStyle(n) {
  if (n.images && n.images.length && n.images[0].url) {
    return `background-image: url("${n.images[0].url}")`;
  }
  return '';
}

function render() {
  const q = search.value.trim();
  const sortKey = sortSel.value;
  const list = DATA.notes
    .filter(n => matches(n, q))
    .sort((a,b) => rank(b, sortKey) - rank(a, sortKey));
  countChip.textContent = `显示 ${list.length} 篇`;
  grid.innerHTML = list.map((n, i) => `
    <div class="card" data-idx="${i}" onclick="openModal('${n.note_id}')">
      <div class="thumb-wrap">
        <div class="thumb" style="${thumbStyle(n)}">
          ${(!n.images || !n.images.length || !n.images[0].url) ? '无图' : ''}
        </div>
        ${n.type === 'video' ? '<span class="video-badge">视频</span>' : ''}
      </div>
      <div class="body-wrap">
        ${n.title ? `<div class="title">${escapeHtml(n.title)}</div>` : ''}
        <div class="body">${escapeHtml(n.body || '')}</div>
        <div class="meta">
          <span class="metric">❤ <b>${fmt(n.liked_count)}</b></span>
          <span class="metric">⭐ <b>${fmt(n.collected_count)}</b></span>
          <span class="metric">💬 <b>${fmt(n.comment_count)}</b></span>
          <span class="metric">📤 <b>${fmt(n.share_count)}</b></span>
        </div>
        <div class="author-row">
          <span>@${escapeHtml(n.author_nickname || '?')}</span>
          ${n.ip_location ? `<span>📍${escapeHtml(n.ip_location)}</span>` : ''}
        </div>
        ${n.tags && n.tags.length ? `<div class="tags">${
          n.tags.slice(0,5).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
        }</div>` : ''}
      </div>
    </div>
  `).join('');
}

function openModal(noteId) {
  const n = DATA.notes.find(x => x.note_id === noteId);
  if (!n) return;
  const xhsUrl = n.url || `https://www.xiaohongshu.com/explore/${n.note_id}`;
  document.getElementById('modal-body').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${escapeHtml(n.title || '(无标题)')}</h2>
    <div class="meta-row">
      <span>@${escapeHtml(n.author_nickname || '?')}</span>
      ${n.ip_location ? `<span>📍${escapeHtml(n.ip_location)}</span>` : ''}
      ${n.publish_time_ms ? `<span>发布于 ${tsFmt(n.publish_time_ms)}</span>` : ''}
      <a class="original" href="${xhsUrl}" target="_blank">↗ 原帖</a>
    </div>
    <div class="metric-row">
      <span>❤ 点赞 <b>${fmt(n.liked_count)}</b></span>
      <span>⭐ 收藏 <b>${fmt(n.collected_count)}</b></span>
      <span>💬 评论 <b>${fmt(n.comment_count)}</b></span>
      <span>📤 分享 <b>${fmt(n.share_count)}</b></span>
    </div>
    ${n.tags && n.tags.length ? `<div class="tags">${
      n.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
    }</div>` : ''}
    <div class="full-body">${escapeHtml(n.body || '')}</div>
    ${n.images && n.images.length ? `<div class="img-grid">${
      n.images.map(img =>
        `<img src="${img.url}" loading="lazy" referrerpolicy="no-referrer" onclick="showLightbox('${img.url}')">`
      ).join('')
    }</div>` : ''}
    <div class="comments-section">
      <h3>评论 ${n.comments.length} 条（已抓取）</h3>
      ${n.comments.map(renderComment).join('') || '<div style="color:var(--muted)">无评论</div>'}
    </div>
  `;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderComment(c) {
  return `
    <div class="comment ${c.parent_id ? 'reply' : ''}">
      <div class="c-head">
        <span class="nick">@${escapeHtml(c.nickname || '?')}</span>
        ${c.ip_location ? `<span>📍${escapeHtml(c.ip_location)}</span>` : ''}
        ${c.publish_time_ms ? `<span>${tsFmt(c.publish_time_ms)}</span>` : ''}
        <span class="c-likes">❤${fmt(c.like_count)}</span>
      </div>
      <div class="c-body">${escapeHtml(c.content || '')}</div>
    </div>
  `;
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function showLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    document.getElementById('lightbox').classList.remove('open');
  }
});

search.addEventListener('input', render);
sortSel.addEventListener('change', render);
render();
</script>
