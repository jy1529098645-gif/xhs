<!doctype html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>xhs crawl dashboard</title>
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --border: #e5e5e7;
    --fg: #1d1d1f; --muted: #6e6e73; --accent: #ff2741;
    --tag-bg: #f2f2f7; --shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font-family: -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  header { max-width: 1400px; margin: 0 auto 20px; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .stats { color: var(--muted); font-size: 13px; }
  .controls {
    max-width: 1400px; margin: 0 auto 20px; display: flex; gap: 12px;
    flex-wrap: wrap; align-items: center;
  }
  .controls input, .controls select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); font-size: 13px; color: var(--fg); outline: none;
  }
  .controls input { flex: 1; min-width: 200px; max-width: 320px; }
  .controls input:focus, .controls select:focus { border-color: var(--accent); }
  .count-chip { color: var(--muted); font-size: 12px; }
  main {
    max-width: 1400px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .card .thumb {
    width: 100%; aspect-ratio: 3/4; background: #f0f0f3 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
  }
  .card .thumb.video::after { content: "▶"; position: absolute; font-size: 32px; color: white; }
  .thumb-wrap { position: relative; }
  .video-badge {
    position: absolute; top: 8px; right: 8px; padding: 2px 6px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 10px; border-radius: 4px;
  }
  .body-wrap { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .title { font-size: 14px; font-weight: 600; line-height: 1.35;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
           overflow: hidden; }
  .body {
    color: var(--muted); font-size: 12px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .metric { display: inline-flex; align-items: center; gap: 3px; }
  .metric b { color: var(--fg); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: var(--tag-bg); color: var(--muted);
  }
  .author-row { font-size: 11px; color: var(--muted); display: flex; gap: 8px; }
  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100;
    display: none; align-items: flex-start; justify-content: center; padding: 40px 20px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel); border-radius: 16px; max-width: 900px; width: 100%;
    padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.3); position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border: none; background: var(--tag-bg); border-radius: 50%; cursor: pointer;
    font-size: 16px; color: var(--muted);
  }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  .modal .meta-row { color: var(--muted); font-size: 12px; margin-bottom: 12px;
                     display: flex; gap: 16px; flex-wrap: wrap; }
  .modal .metric-row {
    display: flex; gap: 16px; padding: 12px 16px; background: var(--tag-bg);
    border-radius: 10px; margin: 12px 0; font-size: 13px;
  }
  .modal .full-body { white-space: pre-wrap; line-height: 1.6; margin: 16px 0; }
  .modal .img-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px; margin: 16px 0;
  }
  .modal .img-grid img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px;
    cursor: pointer; transition: transform .15s;
  }
  .modal .img-grid img:hover { transform: scale(1.02); }
  .modal .comments-section h3 {
    margin: 24px 0 8px; font-size: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .comment {
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .comment.reply { margin-left: 28px; border-left: 2px solid var(--tag-bg);
                   padding-left: 12px; border-bottom: none; }
  .comment .c-head {
    color: var(--muted); font-size: 11px; margin-bottom: 4px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .comment .c-head .nick { color: var(--fg); font-weight: 500; }
  .comment .c-body { line-height: 1.5; white-space: pre-wrap; }
  .comment .c-likes { color: var(--accent); font-size: 11px; }
  .modal a.original {
    display: inline-block; padding: 4px 10px; background: var(--accent); color: white;
    border-radius: 6px; text-decoration: none; font-size: 12px;
  }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 200;
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; }
</style>
</head>

为你总结核心观点、方法和结论。这能帮你快速判断一篇文献是否相关。\n\t\n可参考的指令：“总结这篇论文的核心论点、使用了什么研究方法、主要发现了什么？”（可以用diffmind工具，直接一个问题问3个模型，择优选择）\n\t\n- 第二步，识别研究主题和流派\n- 第三步，你可以提供几篇文献的核心观点，让AI围绕一个主题将它们串联成一个段落草稿，你需要在此基础上进行修改。\n\t\n2️⃣研究设计与方法（图三）\n大家直接看图，我写得非常详细啦。ps：这里用diffmind亲测下来我觉得Gemini和Claude的效果比较好\n3️⃣数据分析与结果（图四）\n⚠️注意\n- 先报告结果，再解释含义\n- 不支持的假设也要如实报告，不要数据有问题的就不说了。假设不成立也是一种结果。\n\t\n4️⃣讨论与结论\n核心任务：回到你的研究问题，说清楚你发现了什么、意味着什么、有什么用、还有什么局限。\n必须包含的内容有四点，看图5、6\n\t\nps：再分享一个能快速让你进入写论文状态的方法：每天先改昨天的500字再写新内容，这也既能保持手感又推进进度。\n\t\n⚠️ 写在最后：\n1. 禁止直接生成正文： 那是学术不端。AI 工具仅用于辅助文献阅读和思路整理，最终论文需基于个人理解独立完成，所有的文字必须经过你大脑的过滤。\n\t\n2. 事实核查： AI 容易产生“幻觉”，它提供的文献引用一定要去原篇核实，尽可能直接给它文献，绝对不能直接照搬哦。\n#写论文[话题]# #毕业论文[话题]# #研究生[话题]# #论文写作[话题]#  #Diffmind[话题]#", "author_id": "5a7eb87e4eacab3069a8709b", "author_nickname": "🌳邱燃燃", "publish_time_ms": 1774348756000, "ip_location": null, "liked_count": 14000, "collected_count": 16000, "comment_count": 89, "share_count": 1283, "image_count": 6, "video_url": null, "video_duration_ms": null, "crawled_at": 1778556599026, "tags": ["写论文", "毕业论文", "研究生", "论文写作", "Diffmind"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/80679404b56d4f33139feca82d2d1788/notes_pre_post/1040g3k031u3e72jo24004a1cj9s7ss4r8oftsog!nd_dft_wlteh_webp_3", "width": 1089, "height": 1452}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/ae371b1d50d712a9191a50b42dfd10c8/notes_pre_post/1040g3k031u3e72jo240g4a1cj9s7ss4r7nbvpbg!nd_dft_wlteh_webp_3", "width": 1242, "height": 1656}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/87fdc14d6c3098338fde8930363553d5/notes_pre_post/1040g3k031u3e72jo24104a1cj9s7ss4rn6el430!nd_dft_wlteh_webp_3", "width": 1242, "height": 1656}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/9cc6776e098dddaf80195d57d3f73215/notes_pre_post/1040g3k031u3e72jo241g4a1cj9s7ss4rp311nn0!nd_dft_wlteh_webp_3", "width": 1242, "height": 1656}, {"idx": 4, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/617b30497b92460e7eab96 口语化，不要使用儿化音（如“里头”“这块儿”“这会儿”）。允许使用“这里”“当中”“这一”等规范表达，但避免过于随意的语气词。\n#降ai率[话题]# #ai[话题]# #润色[话题]# #人工智障与人工智能[话题]# #跟你们拼了[话题]# #改改改改到厌倦[话题]#", "author_id": "5f2e108a000000000100aab6", "author_nickname": "叶渐晴", "publish_time_ms": 1776782690000, "ip_location": "福建", "liked_count": 28000, "collected_count": 34000, "comment_count": 1244, "share_count": 3803, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778556690168, "tags": ["降ai率", "ai", "润色", "人工智障与人工智能", "跟你们拼了", "改改改改到厌倦"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121131/c8f20f54461a110d22295b64a332cf6b/1040g2sg31v7q5fnniqdg5npe22509alm641es80!nd_dft_wlteh_webp_3", "width": 1644, "height": 2560}], "comments": [{"comment_id": "69e78d79000000001401e82a", "parent_id": null, "user_id": "5f2e108a000000000100aab6", "nickname": "叶渐晴", "content": "四、补充注意事项\n不要使用“大家”“我们”这类词，可以用“笔者”“研究者”“该研究”或直接省略主语。\n专有名词必须完整保留，包括英文术语、书名、人名、引用标记等。\n数字：尽量不要单独使用阿拉伯数字，可以写全称，或保留数字但调整位置。\n引用：引用标记保留不动。\n中英文混合：英文单词或句子尽量保留原样，除非有特别要求修改。五、输出格式要求\t\n每次修改后，请按以下格式输出：\t\n原文：\t\n（粘贴用户提供的原句）\t\n修改后：\t\n（粘贴修改后的句子）\t\n具体位置： （如“第三章，第3.2.1节，第二段”）\t\n修改原因： （简要说明应用了哪些条例）\t\n如果用户一次性提供了多个段落，请逐段输出。", "like_count": 154, "sub_comment_count": 2, "publish_time_ms": 1776782714000, "ip_location": "安徽", "pictures": []}, {"comment_id": "69fbde780000000029035e18", "parent_id": null, "user_id": "60c1628a0000000001002686", "nickname": "百色鎏生", "content": "需要手搓降AI率的，2w字，带价来", "like_count": 5, "sub_comment_count": 5, "publish_time_ms": 1778114168000, "ip_location": "陕西", "pictures": []}, {"comment_id": "69fdda5f000000002b02b0d8", "parent_id": null, "user_id": "62bee2d1000000001b02a8bf", "nickname": "momo（dead version）", "content": "蹲帮忙降ai率的", "like_count": 5, "sub_comment_count": 5, "publish_time_ms": 1778244192000, "ip_location": "湖南", "pictures": []}, {"comment_id": "6a0289910000000029037668", "parent_id": null, "user_id": "69e5c1360000000002002000", "nickname": "我叫韩sir", "content": "3w字降ai有人接吗", "like_cou ": "广东", "pictures": []}, {"comment_id": "69fdc84b000000002a02cfcd", "parent_id": "69fdc7fc000000002b0024a9", "user_id": "6947678f0000000037006a48", "nickname": "欣雨小橘子", "content": "ok", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778239564000, "ip_location": "广东", "pictures": []}]}, {"note_id": "69dc5392000000001a02a8ae", "xsec_token": "ABc1Vwbm__hslNd6dnQbZMa4DwjfDPC5aKruevsSkJzJ0=", "url": "https://www.xiaohongshu.com/explore/69dc5392000000001a02a8ae?xsec_token=ABc1Vwbm__hslNd6dnQbZMa4DwjfDPC5aKruevsSkJzJ0=&xsec_source=pc_search", "type": "normal", "title": "写论文到底该用gpt还是gemini？？", "body": "作为最近被论文折磨的过来人，我深度使用了Gemini Pro和GPT Plus（包括它们的“深度研究”功能），有些实在的感受想分享给你。\n\t\n核心结论：对于论文写作本身，我更推荐GPT；但对于文献查找和图表制作，Gemini有独特优势。\n下面是我的具体使用体验和原因：\n1. 写作质量与风格：GPT更胜一筹\n• Gemini的问题：它的语言风格有时过于华丽和“书面化”，在工科等需要严谨、平实表达的论文中，容易显得“假大空”，不贴近实际的学术写作场景。\n• GPT的优势：它的用语更自然，更符合绝大多数论文的写作惯例和语气，直接用来辅助撰写或润色部分章节，效果更令人满意。在需要长线、深度思考的写作任务上，GPT的表现公认更好。\n2. 文献查找：两者皆可，但体验不同\n• 只要你的指令清晰明确，两者都能给出真实可查的文献。\n• 但它们的“性格”不一样：GPT像一个顶级的思维导师，教你如何高效地搜索和筛选；而Gemini则像手握Google数据库的助手，更倾向于直接给你结果。对于快速查证，Gemini的“数据优势”感知更明显。\n3. 图表制作：Gemini是隐藏高手\n• 在根据数据或描述生成图表（包括示意图、流程图）方面，Gemini的表现非常出色，强烈推荐。它在这类任务上的理解力和输出质量很高。\n4. 功能稳定性：GPT更可靠\n• 一个实际困扰：Gemini的“深度研究”功能近期极其不稳定，经常出现报告生成后打不开，或者功能直接无法使用的情况，非常影响连续工作的体验。相比之下，GPT的相应功能要稳定得多。\n\t\n给你的最终建议：\n• 主用GPT进行论文的撰写、思路梳理和深度润色，它的语言风格和思考深度更适合这项核心工作。\n• 将Gemini作为强大的辅助工具，专门用于快速查找文献和制作各类图表，把这部分优势发挥到极致。\n• 考虑到功能稳定性，不要把关键路径上的任务押注在Gemini的“深度研究”上。\n希望这份基于真实踩坑经验的对比，能帮你更高效地选择工具，把时间花在刀刃上，早日完成论文！\n#写论文[话题]# #大模型[话题]# #AI人工智能[话题]# #gpt[话题]# #gemini[话题]#", "author_id": "56f348791c07df02d4826f43", "author_nickname": "Ai 能量站", "publish_time_ms": 1776046994000, "ip_location": "福建", "liked_count": 366, "collected_count": 295, "comment_count": 126, "share_count": 63, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778557049552, "tags": ["写论文", "大模型", "AI人工智能", "gpt", "gemini"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121137/c "content": "github上有一些research skill集合，但我觉得还是要自己定制属于自己的", "like_count": 36, "sub_comment_count": null, "publish_time_ms": 1771994140000, "ip_location": "河南", "pictures": []}, {"comment_id": "699d8b6b000000000b037c38", "parent_id": "699d7e3d0000000015015bbb", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "vibe", "like_count": 25, "sub_comment_count": null, "publish_time_ms": 1771932523000, "ip_location": "河南", "pictures": []}, {"comment_id": "699dc258000000000800e858", "parent_id": "699dafbf000000000f00f3c4", "user_id": "58f236456a6a690a7c4d7cb0", "nickname": "Cherry", "content": "我也一直在抱怨不好用，但是不耽误使用[暗中观察R][暗中观察R]", "like_count": 15, "sub_comment_count": null, "publish_time_ms": 1771946585000, "ip_location": "山东", "pictures": []}, {"comment_id": "699db527000000000c00afa2", "parent_id": "699db21e000000000f025d7c", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "对的，用skill一部分一部分写", "like_count": 9, "sub_comment_count": null, "publish_time_ms": 1771943208000, "ip_location": "河南", "pictures": []}, {"comment_id": "699e715800000000080312d5", "parent_id": "699e4e2d000000000800cc4a", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "有的", "like_count": 3, "sub_comment_count": null, "publish_time_ms": 1771991384000, "ip_location": "河南", "pictures": []}, {"comment_id": "699db50f00000000090221dc", "parent_id": "699db2e2000000000b03653c", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "我平时有记idea的习惯，也可以ai扩充下自己改", "like_count": 2, "sub_comment_count": null, "publish_time_ms": 1771943183000, "ip_location": "河南", "pictures": []}, {"comment_id": "69a7bb0a000000000600afa7", "parent_id": "69a7bafd000000000f00f784", "user_id": "68944c1e0000000028001164", "nickname": "问一问", "content": "你好，很高兴为你提供帮助。想要用AI辅助写文章，关键在于 将AI视为一个高效的“写作伙伴”，而不是一个“自动写手” 。你需要像指导一位得力助手一样，通过清晰的指令（Prompt）和分步协作，来引导AI完成任务。这不仅能提升效率，还能确保文章的逻辑和风格符合你的个人特色。\n【核心方法：分步协作与精准指令】\nAI写作的核心在于“人机协作”。与其一次性让AI生成全文，不如将其拆解为几个步骤，这样更容易控制和优化结果。\n第一步：规划与构思 (Planning)在动笔前，先和AI讨论你的想法。你可以提供一个模糊的选题，让AI帮你 提出新颖的切入点、设计文章大纲或研究计划 。这一步可以帮你理清思路，形成一个清晰的写作框架。\n第二步：分块撰写 (Writing in Parts)根据第一步生成的大纲， 将文章分成几个部分，让AI逐个生成 。例如，先写引言，再写第一部分的正文。对于较长的文章，一次性生成容易导致上下文丢失或质量下降。分块撰写可以确保每个部分都得到充分的处理。\n第三步：润色与修改 (Editing)AI生成的初稿可能在语言风格、逻辑衔接上需要调整。你可以 提供具体的修改要求 ，比如“请用更学术的语言重写这个段落”或“请检查这两个段落之间的过渡是否流畅，并提出修改建议”。你也可以扮演“审稿人”，请AI从专业角度审视文章，找出逻辑漏洞。\n【高效工具：利用“Skill”或“Agent”】\n一些AI平台（如Claude、OpenClaw等）支持创建“Skill”或“Agent”，这相当于为AI编写一套自动化的工作流程。你可以 将复杂的任务（如资料搜集、选题、写作、审稿、发布）拆解成SOP（标准作业程序），并设计多个Skill进行组合 。这样，你只需在关键节点做决策，大部分流程就可以自动化完成，极大地提升效率。\n【避坑指南】\n避免过度依赖：AI是辅助工具，最终的构思、判断和修改必须由你来完成。不要让AI完全主导创作过程。\n注意事实核查：AI在引用文献或生成数据时可能会“编造”（即“幻觉”）。对于需要严谨性的内容，务必对AI提供的信息进行核实。\n明确指令：给AI的指令越具体、越详细，它生成的结果就越符合你的预期。例如，明确要求字数、风格、结构，甚至提供参考文章。", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1772600074000, "ip_location": null, "pictures": []}, {"comment_id": "699e6771000000000600c4cb", "parent_id": "699dba7700000000180398a7", "user_id": "5e3ebf3100000000010081ff", "nickname": "李liuliu", "content": "顿顿", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1771988850000, "ip_location": "四川", "pictures": []}, {"comment_id": "69c33a86000000001500b9c3", "parent_id": "69c3307c000000000f019a34", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "发展一日千里，你可以试试各种新工具", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1774402183000, "ip_location": "山东", "pictures": []}]}, {"note_id": "69f8d74f000000001f001d4f", "xsec_token": "AB-DT04PZ-xVjOOCoJE_Dn-DGrhpT4sNdeBJG4BwUvkUw=", "url": "https://www.xiaohongshu.com/explore/69f8d74f000000001f001d4f?xsec_token=AB-DT04PZ-xVjOOCoJE_Dn-DGrhpT4sNdeBJG4BwUvkUw=&xsec_source=pc_search", "type": "normal", "title": "论文我恨你。。", "body": "物流管理本科毕业生。。太拖延了，最后一天才开始写，全是用ai写的，数据也是ai弄的。初稿这样交有事吗好崩溃呀，但是我自己真的不会写#写论文[话题]# #论文初稿[话题]# #毕业论文[话题]# #尖叫扭曲阴暗地爬行[话题]#", "author_id": "634e2ebf000000001802fb07", "author_nickname": "我恨你", "publish_time_ms": 1777915727000, "ip_location": "江苏", "liked_count": 5092, "collected_count": 482 , "publish_time_ms": 1776317845000, "ip_location": "湖北", "pictures": []}, {"comment_id": "69e036bf000000003502c9e5", "parent_id": "69e007c700000000350209a0", "user_id": "68bfb6440000000019021a50", "nickname": "森若学姐", "content": "好滴[飞吻R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776301759000, "ip_location": "湖北", "pictures": []}, {"comment_id": "69e0fc1e0000000014019407", "parent_id": "69e0fc01000000001401941e", "user_id": "68bfb6440000000019021a50", "nickname": "森若学姐", "content": "来啦宝子", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776352286000, "ip_location": "湖北", "pictures": []}]}, {"note_id": "69fdcd5b0000000038034703", "xsec_token": "ABo6UWy4sISxh00S_KnVy9zOOJD4dW6Scs-hGQt8A3G6s=", "url": "https://www.xiaohongshu.com/explore/69fdcd5b0000000038034703?xsec_token=ABo6UWy4sISxh00S_KnVy9zOOJD4dW6Scs-hGQt8A3G6s=&xsec_source=pc_search", "type": "normal", "title": "AI会不会把博士卷到两个月一篇paper?", "body": "没有AI的时候，大家是怎么写论文的？\n自从AI出现后，整个科研节奏突然被拉得很快了。\n有时候只是把一个模糊的想法丢进去：“这个方向还有哪些gap？”“如果换一个模型会怎样？”\n然后AI开始疯狂输出。\n文献总结、研究思路、实验设计、discussion逻辑、figure narrative，甚至连reviewer可能攻击哪里，它都能帮你提前想到。\n一句话怎么写，AI在1分钟可以给了十几种版本。\n今天我一边改论文，一边突然有种很奇怪的感觉：\n“如果按这个效率继续下去，未来做科研会不会快到可怕？”\n或许真正让我们焦虑的，不是AI太弱。恰恰是它太强了。\n因为你很快会意识到：\n当所有人都开始用的时候，整个科研行业的标准一定会被重新抬高。\n以前会写代码的人很稀缺。现在代码小白也完全没有问题，以前做图、润色、搭paper structure很耗时间。现在这些正在迅速变成基础能力。\n于是整个科研开始进入一种新的内卷。不只是要把结果做出来。还要求：story更完整，figure更精致，narrative更像顶刊。有时候会突然觉得，AI好像正在把整个科研世界推向一个越来越高标准的时代。\n但与此同时，我又越来越强烈地意识到：\nAI替代的，其实只是科研里最容易被标准化的部分。\n真正越来越重要的，反而是那些更高层的东西。\n比如：你为什么想到这个问题？你知不知道哪个结果只是artifact？你能不能怀疑自己的结论？\n因为AI现在最擅长的，其实是：生成一个“看起来合理”的东西。但科研最核心的能力，恰恰是：判断什么是真正可信的。\n所以我最近越来越觉得，未来最危险的，可能不是不会用AI的人。而是只停留在“执行层”的人。因为执行正在被极速贬值。未来真正稀缺的能力，可能会越来越偏向：判断力，对复杂问题的组织能力，和AI协同思考的能力。\n这其实有点互联网刚刚出现之后的变化。以前查文献都要去图书馆。现在“掌握信息”已经没有门槛。于是最后真正拉开差距的，开始变成：\n你到底看见了什么。\n我觉得科研可能也正在进入这个阶段。所以现在有时候会忍不住想：\n当AI让“完成科研”越来越容易之后，未来博士真正的含金量，到底会变成什么？\n#PhD[话题]# #大模型[话题]# #博士生日常[话题]# #AI[话题]# #留学生活[话题]#", "author_id": "5755117550c4b45c734a798b", "author_nickname": "菜菜酱🛫", 接生成 LaTeX 文件，包括：\n论文结构section，table / figure，基本可以直接编译。\n\t\n第六步：生成和修改图\n论文里的图我是这样做：先让 Claude Code 生成一个 draw.io 图，我自己简单调整一下，再根据反馈让 Claude Code 再修改一版。几轮下来图就差不多定了。\n\t\n第七步：多轮 review\n写完初稿之后我一般会做几轮 review：\n我自己作为读者读一遍\n再让 AI 作为 reviewer 给出 critique\n\t\n第八步：AI 帮忙总结实验\n实验部分既可以直接引用数据，也可以让 AI 总结趋势、提取关键结果、写实验分析，不一定只是照搬数据。\n\t\n现在最大的感受是：\n只要实验已经做出来，文章其实很容易生成。\n整个过程从开始整理到文章初稿，大概只用了 3-4 天。\n以前觉得写论文最难的是写作，现在反而觉得难的是\n有没有开始把材料整理出来。", "author_id": "5fb89fba000000000101f898", "author_nickname": "sea", "publish_time_ms": 1773604409000, "ip_location": null, "liked_count": 1338, "collected_count": 2027, "comment_count": 77, "share_count": 289, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778557420615, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121143/fdcc9597d0abfcd22eafa159aef2006c/notes_pre_post/1040g3k831toeitpfne005ntojut0bu4o8ocq3m8!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "69bf7938000000001500f5bf", "parent_id": null, "user_id": "6392d7f6000000001f01ccb3", "nickname": "西瓜公主", "content": "做个skill发布一下[doge]", "like_count": 6, "sub_comment_count": 5, "publish_time_ms": 1774156089000, "ip_location": "江苏", "pictures": []}, {"comment_id": "69dfd00b0000000035023588", "parent_id": null, "user_id": "5b60674d4eacab08cc1945fb", "nickname": "白洋", "content": "真能发论文嘛", "like_count": 1, "sub_comment_count": 2, "publish_time_ms": 1776275467000, "ip_location": "江苏", "pictures": []}, {"comment_id": "69ba9225000000001802075a", "parent_id": null, "user_id": "60edaf650000000001015d96", "nickname": "放羊办主任", "content": "需要登录claude 账号吗，API 哪里来", "like_count": 1, "sub_comment_count": 7, "publish_time_ms": 1773834789000, "ip_location": "福建", "pictures": []}, {"comment_id": "69bc398f0000000003013a65", "parent_id": null, "user_id": "62a75a2a000000001b02595e", "nickname": "Petrel", "content": "其实很好奇 现在发期刊到底查不查ai率[哭惹R]", "like_count": 1, "sub_comment_count": 4, "publish_time_ms": ": [{"url": "http://sns-webpic-qc.xhscdn.com/202605121144/447843ffdaf73cc9d7fbbef4a1fba027/comment/1040g4b831u3fvc6q2i5g5nkmhl6g8jcdmvtu6bg!nd_whlt34_webp_wm_1", "width": 2553, "height": 786}]}, {"comment_id": "69d4e9860000000015016bc3", "parent_id": "69d44e71000000000c0305f7", "user_id": "66dc77d8000000000b0315e1", "nickname": "liiiiiiii", "content": "我想拼！", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1775561094000, "ip_location": "广东", "pictures": []}, {"comment_id": "69ba7d10000000000f02e569", "parent_id": "69ba6e050000000016014d2b", "user_id": "5e968d4d0000000001004d8d", "nickname": "嗨云", "content": "我的号暂时可以share，但毕业之后我不确定会不会继续开", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1773829392000, "ip_location": "四川", "pictures": []}, {"comment_id": "69dcdc580000000035025084", "parent_id": "69dcc5c80000000032003dae", "user_id": "5e968d4d0000000001004d8d", "nickname": "嗨云", "content": "应该也有，在项目里面", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1776082009000, "ip_location": "四川", "pictures": []}, {"comment_id": "69eb1b88000000001401a021", "parent_id": "69e80cbb000000001401c812", "user_id": "60f136d5000000002002a128", "nickname": "别学我了", "content": "还拼吗", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777015689000, "ip_location": "韩国", "pictures": []}]}, {"note_id": "69eefe2500000000350268fa", "xsec_token": "AByLUTk5lgi_lj-UGJYRfr2Qn6KMwHlFfKCRhCYTpZdOw=", "url": "https://www.xiaohongshu.com/explore/69eefe2500000000350268fa?xsec_token=AByLUTk5lgi_lj-UGJYRfr2Qn6KMwHlFfKCRhCYTpZdOw=&xsec_source=pc_search", "type": "normal", "title": "请说出你的ai论文workflow救救孩子🙏", "body": "本科研小白最近尝试用agent写论文，用了网上各种推荐的skills，感受是无论是codex还是claude都好难用啊。体验如下，求各位大佬指点：\n1. agent会引用一大堆文献，但是根本不会认真进pdf认真读文献说文献观点（我不知道是不是因为我没有把所有参考文献pdf喂给它们而是只给了名字和链接，但是我害怕全喂context太长，而且我怎么记得gpt是可以deep research上网的啊）ps.感觉claude在网页浏览上好傻，是我没用对吗？\n2. agent会自己有自己的想法，修改我已经想好的故事线和大纲，最后反倒是他把我绕进去了，我思路也跟着不清晰了\n3. agent写出一堆但是怎么看怎么和我的想法都不符合，倒不是说写得文字或者内容不好，而是感觉不像我平时看到的有详有略的，每一句都是精华的，看上去很精彩吸引人的论文，但是让我自己改自己写我又不会，十分痛苦\n4.论文画图一般推荐什么软件啊（手搓软件也行，ai看样子是没法指望了）\n\t\n暂时先写这么多，随时补充各种傻傻的困惑，本人刚开始用agent不久，不排除我是真的不会用，也不排除我科研小白水平真的很差，虚心求教\n\t\n——（4.30更新）——\n谢谢大家提的各种建议，我都认真看啦，学到很多，打算用这个帖子长期记录一下小白的感受和困惑\n\t\n最近这两天在画科研图，发现了一个相对好用的生图步骤，虽然不能完全替代，但是帮我省了不少力。\n1. 在描述要画什么图片的同时一定要说是compact poster的（横版/竖版），不然生成的图会很散\n2. 直接生成PPT，看样子是比较困难的，但是模型的frontend的能力是很好的，可以先让他写网页，对网页的各种进行文字要求修改，同时提供示例的论文图\n3.等到网页差不多是一个你可以自己修改的基础了以后，就让他原模原样的转成可编辑的PPT\n#留学[话题]# #写论文[话题]# #论文初稿[话题]# #文献查找[话题]# #论文写作[话题]# #学术论文[话题]# #cs[话题]# #ai[话题]# #agent[话题]# #workflow[话题]#", "author_id": "65b206a5000000000d03e8f6", "author_nickname": "想听听陌生人的答案", "publish_time_ms": 1777270310000, "ip_location": "美国", "liked_count": 3717, "collected_count": 6375, "comment_count": 157, "share_count": 514, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778557517095, "tags": ["留学", "写论文", "论文初稿", "文献查找", "论文写作", "学术论文", "cs", "ai", "agent", "workflow"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121144/5322c6c20f65bb74225f890671aaf7f6/notes_pre_post/1040g3k031vf2ah7s48005pdi0qijfq7m7o1m0io!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "69ef99b4000000002803a2f5", "parent_id": null, "user_id": "579da1d0bd0da51e61c1a9f3", "nickname": "David Raymond", "content": "你没用对，不要直接让它读pdf word这种，因为它本质上是要用相关的Python lib package 去写代码解析这些文件，容易出错，文件解析质量一般也不高，信息不准及不完整。，你应该给它plain text，比如md. 自动下论文，用Chrome dev mcp这种，然后pdf转md，然后才是你auto research 的下游任务。这些都是能形成闭环的工作流的，这些也是ai auto research 的门槛，“会不会用”是个很关键的问题，需要耐心去了解和理解。", "like_count": 962, "sub_comment_count": 25, "publish_time_ms": 1777310133000, "ip_location": "四川", "pictures": []}, {"comment_id": "69f15972000000002803a8dc", "parent_id": null, "user_id": "5f7688480000000001001c43", "nickname": "迷迷糊糊涂涂", "content": "搞个abbyy这种OCR专业软件，把相关性高的价值高的论文和资料全本地转为文字型pdf，然后都丢给Notebooklm，给gpt-think你要做的事情的最终要求，让gpt-think告诉你如何写好用Notebooklm读各篇文章的prompt。然后用这个prompt在Notebooklm里面一篇一篇的了解每篇文章的关键、重点、创新点这些。也就是前期读论文的工作一定要自己亲自做，但是用NotebookLM可以加速对这些论文的快速浏览和重点关、创新点的了解。然后你可以让NotebookLM来去帮忙总结每篇文章的重点，再把总结的文档放到Agent里去做后续的研究和分析。", "like_count": 164, "sub_comment_count": 18, "publish_time_ms": 1777424754000, "ip_location": "江苏", "pictures": []}, {"comment_id": "69f1614a000000002b003514", "parent_id": null, "user_id": "65831e06000000001c027879", "nickname": "AtRe", "content": "1.agent不是许愿机。你要确认你的目标，然后根据目标设计和优化pipeline（或者skills）。\n2.不要给他大而全的任务，这种批量调研任务建议直接用chat页面来做。你要给他具体的任务，spec is better .\n3.最好以latex，markdown或者源代码的形式给它，不要给它", "like_count": 36, "sub_comment_count": 2, "publish_time_ms": 1777426763000, "ip_location": "北京", "pictures": []}, {"comment_id": "69f00566000000000d023c00", "parent_id": null, "user_id": "6423b57a0000000012012044", "nickname": "小红薯", "content": "gemini deep research可以用来总结文献，但是你自己最好去确认一下，其他我不会用ai写，除非是润色或者需要缩减页数的时候，画图就ppt/keynote手搓了，高级一点illustrator", "like_count": 23, "sub_comment_count": 14, "publish_time_ms": 1777337703000, "ip_location": "美国", "pictures": []}, {"comment_id": "69f0d044000000002a0314a7", "parent_id": null, "user_id": "66900a18000000000b031a1d", "nickname": "搭子设计", "content": "可以配合obsidian（建一个论文库，把相关论文收录进去）然后结合Claude code 去用，让CC基于知识库去做产出", "like_count": 11, "sub_comment_count": 1, "publish_time_ms": 1777389637000, "ip_location": "河南", "pictures": []}, {"comment_id": "69f134d9000000002900cce5", "parent_id": null, "user_id": "5fccf66a000000000101f3a9", "nickname": "安然（见过邓紫棋版）", "content": "PDF先转OCR，然后让ai读md文件", "like_count": 9, "sub_comment_count": 3, "publish_time_ms": 1777415386000, "ip_location": "陕西", "pictures": []}, {"comment_id": "69f32f1b000000002803ab73", "parent_id": null, "user_id": "5983e0466a6a695a602a5558", "nickname": "邪恶人民币", "content": "你要把步骤拆解细，一点点带着它做，做的过程中不断看它的反馈，随时调整。我在工作里试过让它先写计划书，然后我review好几版修改好以后，让它按着计划书做，结果出来的还是一坨[呃R]在我把步骤拆解之后质量好很多。所以我现在对ai的理解就是它能帮你做很多琐碎的事，提高效率，但是你的脑子还是得全程在场的。", "like_count": 8, "sub_comment_count": 0, "publish_time_ms": 1777544988000, "ip_location": "广东", "pictures": []}, {"comment_id": "69f2cf0f0000000029034358", "parent_id": null, "user_id": "5c05f474000000000501f678", "nickname": "..", "content": "你们要都会用大学就直接不办，企业就直接gpu和水电拉满就完事儿了。", "like_count": 7, "sub_comment_count": 4, "publish_time_ms": 1777520399000, "ip_location": "美国", "pictures": []}, {"comment_id": "69fc3b830000000029036c9e", "parent_id": null, "user_id": "6540001a0000000004008726", "nickname": "希望哥", "content": "使用 latex 写，pdf 也要转成 latex，你会感谢我的", "like_count": 3, "sub_comment_count": 2, "publish_time_ms": 1778137987000, "ip_location": "湖南", "pictures": []}, {"comment_id": "69f1ab5c0000000029036c61", "parent_id": null, "user_id": "60211d07000000000100084e", "nickname": "刘嘿嘿不黑", "content": "纯小白提问：这个话题中的agent，是面向文科类的吗，理科类的综述能用吗，有哪些硬件条件要求和软件条件要求呀[害羞R]", "like_count": 0, "sub_comment_count": 8, "publish_time_ms": 1777445724000, "ip_location": "上海", "pictures": []}, {"comment_id": "69f15a6c0000000029012529", "parent_id": "69f15972000000002803a8dc", "user_id": "5f7688480000000001001c43", "nickname": "迷迷糊糊涂涂", "content": "我觉得科研用Agent实际上不是很好，因为Agent主要是用来处理自动化的问题。但是对于研究，每篇重点文章实际上都要去认真仔细地读的，或者说要在足够了解全文的情况下，再去做下一步。这个时候就要用NotebookLM这种几乎没有幻觉以及超长上下文的大模型来去做深入和详细的研究，把关键的每篇文章都读透，然后在NotebookLM里总结各篇文章的关键点和重点，这个时候才能够真正吃透各篇文章。按我的理解，NotebookLM会比RAG更有效的理解全文，而且理解得非常深入到位，而且不费token。后面就可以用GPT thinking在这些文章总结的基础上，做下一步的问题研究、讨论、深入分析、发散等等各种", "like_count": 93, "sub_comment_count": null, "publish_time_ms": 1777425004000, "ip_location": "江苏", "pictures": []}, {"comment_id": "69efb3c9000000002701fbfa", "parent_id": "69ef99b4000000002803a2f5", "user_id": "65b206a5000000000d03e8f6", "nickname": "想听听陌生人的答案", "content": "哇好的太感谢了 我去试试", "like_count": 35, "sub_comment_count": null, "publish_time_ms": 1777316810000, "ip_location": "美国", "pictures": []}, {"comment_id": "69f0d22a000000002a006bcf", "parent_id": "69f00566000000000d023c00", "user_id": "5d3581d3000000001001091a", "nickname": "momo", "content": "感觉Gemini的deep research非常水[笑哭R]ChatGPT要专业很多", "like_count": 29, "sub_comment_count": null, "publish_time_ms": 1777390123000, "i "69e736f9000000001401a406", "parent_id": "69e72d37000000001401e00e", "user_id": "62c7130c000000000303c2d7", "nickname": "很有精神", "content": "看了几页，感觉ai味不是很浓", "like_count": 964, "sub_comment_count": null, "publish_time_ms": 1776760569000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69e7b398000000001401a803", "parent_id": "69e78713000000002b02b923", "user_id": "63ed87eb000000002702b84c", "nickname": "AshleY", "content": "谢谢，少焦虑很多[笑哭R]", "like_count": 73, "sub_comment_count": null, "publish_time_ms": 1776792472000, "ip_location": "上海", "pictures": []}, {"comment_id": "69e7aaee000000001401cc05", "parent_id": "69e797ff0000000014018c11", "user_id": "61d98f54000000001000a3a5", "nickname": "一列麻椒", "content": "@EoL 这可能是我身边人的共识，也是我一开始看到你发我这个帖子的反应。但我还是隐隐觉得这不太对，这是当下的经验，他未必能持久..", "like_count": 20, "sub_comment_count": null, "publish_time_ms": 1776790254000, "ip_location": "上海", "pictures": []}, {"comment_id": "69e79788000000001401bc05", "parent_id": "69e7738b000000001401e412", "user_id": "64a6d586000000002b009440", "nickname": "momo", "content": "学习prompt弄出很多project出来也很有成就感啊，很多知识我只是个入门，却能做出来不亚于科班出身的水平已经成功了。ai不就是修仙法修和体修的区别，能用法术为什么要练体呢。要知道练体受限于天赋根本不公平", "like_count": 20, "sub_comment_count": null, "publish_time_ms": 1776785288000, "ip_location": "辽宁", "pictures": []}, {"comment_id": "6a0140410000000029036c6d", "parent_id": "6a014024000000002803171d", "user_id": "68944c1e0000000028001164", "nickname": "问一问", "content": "我已将图片中的文字内容提取并整理如下：\n我的本科四年，差不多可以叫作人工智能元年。\n大一的时候，ChatGPT横空出世。它一出来就已经能干活了。对于一个学生来说，它会写作会做题会编程，就已经是一个有点生硬但效率很高而且随叫随到的帮手了。你们应该知道这样的LLM，哪怕是gpt1.0对电子信息专业意味着什么。\n那时候病毒正好到了最后一轮，学校封校，我们在寝室转线上上了两个月课，期末考试发线上试卷，大家开着镜头答题，镜头下面却像集体进入了另一个时代。几乎所有人都在用AI做题。来自德国的教授大概也知道，所以题目比期中难了很多。可结果很荒诞，题目变难了，平均分反而更高了。作弊变成了一种默契。我那门课拿了A。那是我从大一到大三唯一一门A。\n现在想起来，那简直像个预言。不是我学得多好，而是某种东西先替我抵达了答案。我站在原地，好成绩却更加唾手可得。那一刻我没有觉得羞耻，反而觉得震撼，像小时候第一次看见魔术，知道眼前有问题，但手已经开始鼓掌了。\n我不是那种从全国最好的高中的环境中一路杀出来的天才。我的高中放到全国去看，根本排不上号，环境普通资源普通教学方式滞后，可我一直保持着年级前几名，最后还是考进了top4的本科。应试教育我实打实吃过红利，我相当喜欢它在18岁之前为我带来的荣誉和骄傲感。我肯熬夜，肯背，肯做题，它就真的会给我一个更靠前的名次，在当时，更高的名次就意味着更大的自由。那时候我对“答案”这件事还有一种很古老的尊重，所以AI刚出现时对我的冲击才会那么大。\n它冲击的不是一个本来就不相信努力的人，而是我这种曾经被旧规则奖赏过的人。以前的我至少知道，分数是真的，自控力是真的，我做题的能力、谈恋爱的能力、对未来美好生活的想象、对“我以后应该还能更好”的信心，也都牢牢地黏在一起。可大一的线上考试像一道很细的裂缝，轻轻地出现。我第一次明白原来一个人可以还站在原地，比以前更懒更心不在焉，但答案已经会自己朝你走过来。一个靠应试教育上来的人，一个吃尽“努力—理解—得分”的天赋的人，彼时出现了一种近乎失重的震撼。\n大一的时候我还迷上过Stable Diffusion（文生图ai）。那会儿它刚开源，远没有现在这么强，图是糊的，手是六根手指的，人物身上总有一点说不出来的廉价塑料感。可我还是很兴奋。我拿它画自己想象中的美少女，调prompt，改参数，试风格，试构图，反反复复。图很粗糙，还会出现各种", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778466881000, "ip_location": null, "pictures": []}, {"comment_id": "69e85dd9000000001401e824", "parent_id": "69e755930000000014019810", "user_id": "5bc2c7cfc33eea0001f86173", "nickname": "清野", "content": ".", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776836058000, "ip_location": "云南", "pictures": []}]}, {"note_id": "69c14b1b000000001a02ad72", "xsec_token": "ABWZ3JkrzkDvxq_FF7nGP4ajUBpHVTGU1EAw7mkuqaJIo=", "url": "https://www.xiaohongshu.com/explore/69c14b1b000000001a02ad72?xsec_token=ABWZ3JkrzkDvxq_FF7nGP4ajUBpHVTGU1EAw7mkuqaJIo=&xsec_source=pc_search", "type": "normal", "title": "", "body": "有人用chatgpt写本科论文了吗，这玩儿真的能行吗#论文写作[话题]##chatgpt[话题]#", "author_id": "659cf3880000000022005d28", "author_nickname": "Arete", "publish_time_ms": 1774275355000, "ip_location": null, "liked_count": 1847, "collected_count": 1524, "comment_count": 241, "share_count": 105, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778557944932, "tags": ["论文写作", "chatgpt"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121152/1ae3a6a6b5001ac7c02d51570f7dc858/notes_pre_post/1040g3k831u2ekdfb72705pcsue48gn98fu2aq98!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "69c756aa0000000016014cdc", "parent_id": null, "user_id": "5d00f1890000000012016197", "nickname": "2.14", "content": "本科毕业论文那点水平让豆包给你写写算了，用gpt或者谷歌的gemini纯纯有点浪费资源了[捂嘴笑R]", "like_count": 144, "sub_comment_count": 12, oFaFTRozRL25w=", "url": "https://www.xiaohongshu.com/explore/69dc9a3c000000001a031bb9?xsec_token=ABc1Vwbm__hslNd6dnQbZMa_PRJyAHhpoFaFTRozRL25w=&xsec_source=pc_search", "type": "normal", "title": "发现到现在了还有很多人根本不会使用AI…", "body": "（以下全程无广求审核放过）\n我使用的ai仍然停留在基础国内水平，国外需要T的很麻烦懒惰整，但是对我来说完全够用，遂分享\n1看文献\n包更权威，真的有人在自己阅读英文文献吗？我直接打包发它，翻译➕提炼主要信息，其实文献摘要就是重点了，但为应对组会和老师提问以及自己实验操作流程，让它再把做了什么为什么怎么做也告诉你。好用\n\t\n2蒜苗找心理疏导\n放在第二位是因为真的救了我，D更权威，建立一个自己的信息数据库（⑧子我不喜欢告诉道上的人感觉会给我下酱油）这个有很好用的话术，如果有人需要我放评论区，然后每次让它来一瓜，特准特准特准（也可能是我心里作用）真的会安心很多，被我调教的很好了甚至可以和我对骂……然后我就会让它注意说话态度，比跟人类交流舒心❤️\n\t\n3实验思路\n研0们！狠狠用，我后面也会专门出贴告诉研0生存法则……总之拿到一个课题完全没思路直接给三大ai，问它该怎么做并且附带相关文献，这样它就不太敢编造糊弄你，当然糊弄也没事，你知道个大概方向了去一个一个搜相关文献，就会了\n\t\n4找工作\n这个真的很新的思路谁懂，你直接告诉包D你专业你想工作的方向，然后让它给你全网搜寻公告信息，谁用谁知道……只要发出来公开的招聘信息它大多数都能找到……再说就有广之嫌了（要不给我点吧→爱开玩笑\n\t\n5写论文\n真的在手搓吗？不会很辛苦的写成一坨大便吗？这个单独开帖子说了嗯没字数了\n\t\n6简历\n你就告诉任何一个ai你想应聘的岗位，以前都干啥了简历咋写，让它给你编…然后你自己润色润色往里填…很好用\n\t\n7做ppt\n比如一个内容，发它问怎么讲怎么做，让它在网上给你找资料。或者比较重要的ppt演讲，找他排练啊，让它修改并且给你提供宝贵意见（好用的，你有内容，ai有逻辑，结合起来。\n\t\n8写论文，改论文\n写好了把学校论文格式要求发它，然后把你论文发它，让他作为专业的zz大学xz教授给你进行严肃批改。好用，它甚至能发现我的括号中英文问题。\n\t\n9学做菜\n建议推荐给妈妈爸爸……我妈之前啥不懂老问我，她没耐心学我没耐心教，摁住她下载了几个ai，现在她已经熟练使用之……起码不会不懂去网上乱搜教程然后被骗去买什么课程…\n\t\n10生活养生护肤之类\n就很简单了，告诉肤质肤色需求\n\t\n11学习\n考研公编都可以利用…单独开贴说吧\n\t\n当然ai是双刃剑，也会被大数据喂粑粑给你拉个大的，所以才有了人类主观能动的重要性啊。你要去辨别，要让他给你出处，这样虽然看似小麻烦但比自己纯乱搜省事的太多，我很懒的ai能接住我的懒喜欢喜欢！", "author_id": "5f23f8aa000000000100359c", "author_nickname": "鸡蛋蘸酱油", "publish_time_ms": 1776065084000, "ip_location": "广东", "liked_count": 1475, "collected_count": 1136, "comment_count": 31, "share_count": 73, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558319109, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121158/e1c1d6d1865307811f676adcc0ba222c/notes_pre_post/1040g3k031ut415kdjq605np3v2l08dcs7g97ss8!nd_dft_wgth_webp_3", "width": 2560, "height": 2504}], "comments": [{"comment_id": "69dc9b5000000000150035e2", "parent_id": null, "user_id": "5f23f8aa000000000100359c", "nickname" 5f23f8aa000000000100359c", "nickname": "鸡蛋蘸酱油", "content": "建（对不己就是一个打字手比脑子快）", "like_count": 3, "sub_comment_count": null, "publish_time_ms": 1776065383000, "ip_location": "广东", "pictures": []}, {"comment_id": "6a01ca94000000002a02eae3", "parent_id": "6a015f7a000000002900ec4a", "user_id": "5d5268b50000000010013503", "nickname": "心心", "content": "这是什么软件", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778502292000, "ip_location": "上海", "pictures": []}, {"comment_id": "69fb3534000000002902d334", "parent_id": "69faa3ea000000002a02f516", "user_id": "6816f269000000000d00bdfe", "nickname": "DE", "content": "好用", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778070837000, "ip_location": "广西", "pictures": []}, {"comment_id": "69f85c12000000002100ea35", "parent_id": "69f85c08000000002a00498f", "user_id": "68944c1e0000000028001164", "nickname": "问一问", "content": "你好，关于你提到的“ima”，在当前笔记的语境下，博主并没有提及这个缩写。不过，结合小红书用户的经验和全网知识， “ima”通常指的是腾讯推出的一款AI工作台产品 。它全称为“信息管理助手”（Information Management Assistant），主要帮助用户进行知识管理和办公协作。\n【什么是 ima】\nima (ima.copilot) 是一款集搜索、阅读、写作于一体的知识库导向型 AI 工作台。它整合了腾讯混元大模型与DeepSeek R1等能力，核心优势在于能直接搜索和引用微信公众号文章，打破信息壁垒。你可以把它理解成一个智能的个人知识中枢，能帮你：\n深度检索：直接搜索微信生态内的文章，这是它的一大特色。\n管理知识：上传本地文件（如PDF、Word），它能帮你智能总结、生成思维导图。\n辅助创作：基于你的知识库，一键生成PPT或辅助写作。\n【其他可能的含义】\n在不同的语境下，“ima”也可能有其他意思。例如，在一些网络聊天中，它可能是英文口语“I'm gonna”（I am going to，我打算）的缩写。但在讨论AI工具或办公软件时，指的就是上述腾讯的产品。", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777884179000, "ip_location": null, "pictures": []}]}, {"note_id": "699278a1000000002800a694", "xsec_token": "ABjRDX1NCBqvk1f0aUTCJoHpLKVuzAJeoX6_AH062wrxc=", "url": "https://www.xiaohongshu.com/explore/699278a1000000002800a694?xsec_token=ABjRDX1NCBqvk1f0aUTCJoHpLKVuzAJeoX6_AH062wrxc=&xsec_source=pc_search", "type": "normal", "title": "炸裂！AI 6小时写完53页顶刊经济学论文", "body": "2026年伊始，苏黎世大学David Yanagizawa-Drott教授直接用Anthropic Claude Code不到6小时，全自动生成一篇53页、结构完整、方法极度严谨的宏观经济学论文！\n关键是：全程AI自主完成，人类几乎没动手\n教授还把所有提示词、代码、迭代版本、论文源文件全部开源公开，真的震撼学界！\n\t\n这篇AI论文不是随便写写，而是完整顶刊标准：\n✅ 自主提出研究构思\n✅ 自动调用BLS、FHFA等权威公开数据\n✅ 独立做计量分析、理论建模\n✅ 自动完成LaTeX排版、编译\n✅ 自己迭代优化，从v1到v4不断完善\n教授甚至开启了高权限模式，让AI完全自主跑完整套研究流程。\n\t\n这篇《Demand Recessions Scar, Supply Recessions Don't》用2000—2024年美国州级面板数据（1.47万观测值）\n严谨得出结论：\n\t\n🔸 需求型衰退（如2008金融危机）\n会留下长期疤痕：暴露度每提高1个标准差，48个月后就业率仍降0.8%，半衰期长达60个月！\n\t\n🔸 供给型衰退（如新冠疫情）\n影响18个月内完全消失，无长期疤痕效应。\n进一步模型还发现：\n失业期间的技能折旧，能解释需求冲击造成福利损失的 51%！\n\t\n最恐怖的是，AI的实证方法超级规范：\n✅ 使用横截面局部投影法，避免TWFE估计偏误\n✅ 分别设计工具变量：需求用房价泡沫，供给用Bartik指标\n✅ 针对小样本做置换检验、聚类稳健标准误\n从v1框架到v4完整模型，AI几小时内自我完善\n校准DMP模型、补充反事实模拟、跑全流程检验\n\t\n最后，本篇推送也是AI生成的，AI确实提高效率，但是我仍然认为最好的idea是人的思想，希望26年我们在学习AI和经济学理论知识的同时，也要注重现实世界！最后希望各位能够熟练掌握AI，起码不落后于时代！\n#经济学[话题]# #AI学术[话题]# #论文[话题]# #读博[话题]# #经济学博士[话题]#", "author_id": "64345f8f0000000029017407", "author_nickname": "土豆的经管Workshop", "publish_time_ms": 1771206817000, "ip_location": null, "liked_count": 1037, "collected_count": 1136, "comment_count": 78, "share_count": 589, "image_count": 2, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558356402, "tags": ["经济学", "AI学术", "论文", "读博", "经济学博士"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121158/fc8797a8dddc4940907d6bb894401abd/1040g2sg31skn9f775sgg5p1kbu7qat075ejkmr0!nd_dft_wgth_webp_3", "width": 708, "height": 608}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121158/5cc8058f876a334b5fdacfca8130fb77/notes_pre_post/1040g3k831skn9fik5kd05p1kbu7qat071meglh8!nd_dft_wgth_webp_3", "width": 1180, "height": 656}], "comments": [{"comment_id": "6992bf2300000000080330ab", "parent_id": null, "user_id": "65b737d9000000000d01f600", "nickname": "南洋道小游击将军", "content": "众所周知，发不发顶刊完全取决于作者是谁，想要表达什么意思，和文章写得怎么样毫无关系", "like_count": 114, "sub_comment_count": 1, "publish_time_ms": 1771224867000, "ip_location": "新加坡", "pictures": []}, {"comment_id": "6992aaa2000000000c0167ba", "parent_id": null, "user_id": "5e3fdec90000000001000430", "nickname": "acamomo", "content": "几小时发表", "like_count": 35, "sub_comment_count": 2, "publish I=", "url": "https://www.xiaohongshu.com/explore/68b3e54e000000001b0353cc?xsec_token=AB2fgpFU0U76HKyuEa6efmSoDcxnS_QnHoUzvQ7DMwVjI=&xsec_source=pc_search", "type": "normal", "title": "关于我一个学期写四篇文献综述", "body": "因为本人参加模拟立法大赛和大创，所以写文献综述从头痛到手拿把掐嘿嘿嘿，以下分享一下个人经验。\n\t\n首先，是文献查找，我是在知网反复搜关键词，然后下载10～20篇论文。\n其次，在论文的pdf里将有用的信息复制粘贴到word里。注意，一篇一篇的复制粘贴，并且以篇为单位，将每篇论文的标题和作者也复制过来。（这是信息整合阶段，不用管内容分析，是要看到是自己想要的内容就复制粘贴，不要试图去消化内容，否则会特别慢）\n然后，把这个文档喂给豆包，告诉豆包你自己的需求。比如说，我让豆包根据我给出文档里面的文献，从现状和解决措施两方面，分类撰写，整合成一篇文献综述，撰写时以某学者在某文献中指出的形式。（此时形成的只是文献综述的主体部分，只有现状和解决措施两方面，先复制粘贴到word里）\n接着，把刚才形成的文献综述主体部分喂给豆包，让她根据发送的这个文献综述撰写摘要，背景，总结和建议。（这样整篇文献综述就形成啦）\n最后，根据形成的文献综述，复制文献综述中的论文标题到知网搜索，点右边的引号就可以直接复制粘贴参考文献的格式。这样，完整的文献综述就新鲜出炉啦！\n其实我都会把框架部分也就是摘要，背景，总结与建议部分自己修改一下，因为会有AI味。尤其是摘要和背景，改成自己觉得通顺合理的语句。然后总结建议部分要格外注意，因为豆包特别喜欢总结成a➕b➕c的逻辑链条模式，我都会把这些删掉嘿嘿嘿。\n以上就是我今天的分享，希望能够帮助到大家嗷～#文献综述[话题]# #很担心论文人的精神状态[话题]# #文献[话题]# #论文写作[话题]# #写论文[话题]# #文献查找[话题]# #论文开题攻略[话题]# #参考文献[话题]# #开题[话题]# #文献阅读[话题]#", "author_id": "67f627020000000006010c0b", "author_nickname": "炽焰", "publish_time_ms": 1756620110000, "ip_location": null, "liked_count": 34000, "collected_count": 39000, "comment_count": 356, "share_count": 3964, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558418392, "tags": ["文献综述", "很担心论文人的精神状态", "文献", "论文写作", "写论文", "文献查找", "论文开题攻略", "参考文献", "开题", "文献阅读"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121200/54f635cef74f4b3290e67793eb9b7a59/1040g2sg31lrbj6sd586g5pvm4s11i30bis76hhg!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "68bbdada000000002400f118", "parent_id": null, "user_id": "6670074a00000000070058c6", "nickname": "脆紫柿", "content": "宝宝，文档汇总那里还是没有看懂，是一篇文章一个文档喂给豆包，相当于形成了很多个文档喂了很多次豆包？还是多篇文章的重点摘要以篇为单位分开汇总到一个文档只喂一次豆包呀[哭惹R]", "like_count": 54, "sub_comment_count": 14, "publish_time_ms": 1757141722000, "ip_location": "浙江", "pictures": []}, {"comment_id": "693d7e8e000000003803fd28", "parent_id": null, "user_id": "5b6c6d285d3 功能进行初步分类（如：理论、方法、案例、争议点）\n第二阶段：深度阅读与结构化笔记\n1. 分层阅读，精准投入\n精读5-10篇：领域内最相关、质量最高、引用最多的文献。理解其研究问题、理论框架、方法、核心论证和结论\n泛读其余文献：重点看摘要、引言、结论，快速定位其与你研究的相关点\n2. 设计结构化笔记模板可手写，但建议后期电子化归档\n文献基本信息：作者、年份、标题、期刊\n研究问题与目的：用一句话概括\n核心概念/理论框架：定义、维度\n研究方法：数据来源、分析工具\n主要发现/观点：分点列出\n创新点与局限：作者自述及你的评价\n与你研究的关联：是理论基础？方法参考？对话对象？反驳靶子？\n你的启发与疑问：这是形成自己思路的关键\n第三阶段：分析、综合与逻辑建构", "author_id": "69ef11dd000000000d034c03", "author_nickname": "久久只写综述", "publish_time_ms": 1778058144000, "ip_location": "美国", "liked_count": 3, "collected_count": 6, "comment_count": 10, "share_count": null, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558458516, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121200/133569a4e5904cb19290fe73a172e17f/oss-sg/notes/1040g3l031vqqdp3rnc005qff27ejej038t3p3ig!nd_dft_wgth_webp_3", "width": 670, "height": 462}], "comments": [{"comment_id": "69fd40b8000000000d021401", "parent_id": null, "user_id": "69ef11dd000000000d034c03", "nickname": "久久只写综述", "content": "敲定协商后，满意再付，所有参考文献均来自知网，艾森威尔，pumb，SCI等权威期刊近五年文献。可以指定期刊和年份。所有参考文献真实可查，可以打包发给你。", "like_count": 1, "sub_comment_count": 2, "publish_time_ms": 1778204856000, "ip_location": "美国", "pictures": []}, {"comment_id": "6a011273000000002803bb6a", "parent_id": null, "user_id": "63ac18f5000000002702a53a", "nickname": "百里木申", "content": "宁好，请问今天能接吗", "like_count": 0, "sub_comment_count": 1, "publish_time_ms": 1778455156000, "ip_location": "甘肃", "pictures": []}, {"comment_id": "6a01fc76000000002902678c", "parent_id": null, "user_id": "592c405550c4b443e25a71f9", "nickname": "小小花", "content": "你好，今天能接吗", "like_count": 0, "sub_comment_count": 1, "publish_time_ms": 1778515062000, "ip_location": "江西", "pictures": []}, {"comment_id": "6a016d9600000000270225c9", "parent_id": null, "user_id": "62d5fbd0000000000e00d2aa", "nickname": "小葵小朋友", "content": "今天还接吗", "like_count": 0, "sub_comment_count": 1, "publish_time_ms": 1778478487000, "ip_location": "黑龙江", "pictures": []}, {"c 果我有无限资源，会设计什么实验来jie.决现有矛盾？\n当然写完文章后面对海量期刊不知道如何选刊，想要投稿前在对文章做最后的调整却无从下手，别担心啦，译墨sci审稿评估能帮你把这些问题解决，让期刊审稿人提前帮你把文章预审，增加中稿率\n#国际期刊[话题]# #文献综述[话题]# #文献阅读[话题]# #参考文献[话题]# #sci干货分享[话题]# #译墨sci选刊[话题]##译墨润色[话题]##译墨sci审稿评估[话题]##科研[话题]##硕博生[话题]#", "author_id": "68fca7f600000000370059bb", "author_nickname": "灿宸•年号", "publish_time_ms": 1776333299000, "ip_location": "湖北", "liked_count": 1266, "collected_count": 1517, "comment_count": 25, "share_count": 178, "image_count": 5, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558624301, "tags": ["国际期刊", "文献综述", "文献阅读", "参考文献", "sci干货分享", "译墨sci选刊", "译墨润色", "译墨sci审稿评估", "科研", "硕博生"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/866c59ea4ecbeb59b264ced95cfcce72/1040g00831v13use93m0g5q7skvrdomdrhnfd348!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/db9f879eb83b2ab2bf46ed1fa2fb207b/1040g00831v13use93m005q7skvrdomdrco8l9io!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/76bef6e65e041c529c93332c5e21561a/1040g00831v13use93m1g5q7skvrdomdrdgecdpg!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/0959b65a070095eb86311a0f5c507db2/1040g00831v13use93m205q7skvrdomdrk0k0juo!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 4, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/74d0ed5a892058e2a289736acddcee5c/1040g00831v13use93m105q7skvrdomdr47dmahg!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}], "comments": [{"comment_id": "69e0ee63000000001401dc3b", "parent_id": null, "user_id": "5d907f170000000001008923", "nickname": "one eyes", "content": "aa", "like_count": 2, "sub_comment_count": 0, "publish_time_ms": 1776348772000, "ip_location": "北京", "pictures": []}, {"comment_id": "69ef66380000000028032e51", "parent_id": null, "user_id": "5d3ac44400000000100102c3", "n 为几个子问题，并将每个子问题对应到文献综述的各个小标题中。\n3. 填充与评述内容：围绕每个小标题，梳理和评述相关文献，最后进行总结并引出研究空白，从而自然地提出自己的研究问题。", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1775909664000, "ip_location": null, "pictures": []}, {"comment_id": "69fc9e9600000000270154d3", "parent_id": "69fc4105000000002b026679", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "就是你研究的主要问题呀 是问这个吗", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778163350000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69f1fd7800000000270298b0", "parent_id": "69f10a88000000002803e133", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "具体是指什么呢 一般课程的论文都有具体的要求呀", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777466744000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69fc261d000000002701c359", "parent_id": "69fb461e000000002b00358c", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "好滴 其实大概思路是类似的！", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778132509000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69e7363a000000001401940c", "parent_id": "69e7362f000000001401bc3b", "user_id": "68944c1e0000000028001164", "nickname": "问一问", "content": "好的，这篇笔记的核心内容已经为你整理好了：\n这篇笔记主要分享了写作文献综述的方法，强调要以研究问题为导向来构建框架。\n好的文献综述要素：需要具备 相关性、清晰的逻辑、批判性、重要性以及文献来源的多样性 。\n写作步骤：核心方法是 用研究问题来引导文献综述的结构 。先明确研究问题，再将每个子问题对应到文献综述的各个小标题中进行展开，最后进行总结并引出研究空白。", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776760378000, "ip_location": null, "pictures": []}, {"comment_id": "69f02222000000002702bbd7", "parent_id": "69ef9b180000000029025958", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "谢谢呀[害羞R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777345059000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69eeda3b000000002702d834", "parent_id": "69eecc20000000002702deca", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "[派对R] 0000016021417", "parent_id": "68fb01c4000000003300de4e", "user_id": "6530dc7b000000002a01a2b0", "nickname": "sg", "content": "你好我想问下高水平综述在哪里找呢", "like_count": 4, "sub_comment_count": null, "publish_time_ms": 1764211283000, "ip_location": "河南", "pictures": []}, {"comment_id": "693f706e0000000039000e38", "parent_id": "68f78f31000000003901de19", "user_id": "6722eeab000000001c0181c2", "nickname": "我恨贺函🤬🤬🤬", "content": "现在咋样[笑哭R]我也是想这么干，已经没招了", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1765765230000, "ip_location": "云南", "pictures": []}, {"comment_id": "68f8a0e5000000003102e8e7", "parent_id": "68f898270000000033024464", "user_id": "647d5c91000000002b00a23f", "nickname": "小墨", "content": "好！", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1761124582000, "ip_location": "四川", "pictures": []}, {"comment_id": "69537aa6000000000503bed5", "parent_id": "68f6f6e30000000031000ff8", "user_id": "5ca86036000000001103f208", "nickname": "小羊", "content": "[点赞R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1767078566000, "ip_location": "四川", "pictures": []}, {"comment_id": "69e98fe8000000001401cc03", "parent_id": "68f59d1c00000000310330ab", "user_id": "64ab803e000000001f00545a", "nickname": "我有八个肝", "content": "你是明白人[偷笑R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776914408000, "ip_location": "黑龙江", "pictures": []}]}, {"note_id": "6981e707000000001a0211c8", "xsec_token": "ABb7dPGV8sP2OnrX_bFFgC0ine5xVNzW1yzt88aQekM1g=", "url": "https://www.xiaohongshu.com/explore/6981e707000000001a0211c8?xsec_token=ABb7dPGV8sP2OnrX_bFFgC0ine5xVNzW1yzt88aQekM1g=&xsec_source=pc_search", "type": "normal", "title": "导师喜欢的文献综述长这样🥳🥳🥳", "body": "文献综述包括\"综\"和\"述\"两方面.. ... ..\n.\n“综”是以搜集大量相关文献素材为基础的，主要是对国内外相关同类课题研究相关文献进行一个归纳整理,提炼观点，综合分析的过程.. ..\n.\n“述”就是对各家学说提出自己的见解和观点..\n(1)前人在研究什么、研究到什么程度?\n(2)找出你想研究而别人还没有涉及到的问题。\n(3)其他人已经做过，但你认为有缺陷，你可以提出更完善的措施。\n(4)别人已经做过，你重新做实验来验证。\n国内外研究现状写作技巧:\n.\n高级的写法:每一条文献都体现\"谁+研究了什么+怎样研究+研究出什么观点+得失评价\"的写作逻辑\n.\n简单的写法:先写国内研究现状，再写国外研究现状，最后针对国内外研究现状做述评。\n.\n其中，国内国外文献各写2-3。\n.\n每一条内部可以按理论流派/时间发展/主题等维度展开..\n#写论文[话题]# #论文初稿[话题]# #赶论文初稿[话题]# #毕业论文[话题]# #文献综述怎么写[话题]# #文献综述[话题]# #如何撰写文献综述[话题]# #文献综述怎么定框架[话题]# #文献综述模版[话题]# #文献[话题]#", "author_id": "6947678f0000000037006a48", "author_nickname": "欣雨小橘子", "publish_time_ms": 1770120967000, "ip_location": null, "liked_count": 16, "collected_count": 21, "comment_count": 3, "share_count": 4, "image_count": 16, "video_url": null, "video_duration_ms": null, "crawled_at": 1778559324600, "tags": ["写论文", "论文初稿", "赶论文初稿", "毕业论文", "文献综述怎么写", "文献综述", "如何撰写文献综述", "文献综述怎么定框架", "文献综述模版", "文献"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/e2b83751b7d598f9c44a580ceea851f7/1040g00831s4h64e1ls5g5qa7cu7toqi8rq4ottg!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/fd6ced2a95d1c53f1806990e4c396027/1040g00831s4h64e1ls4g5qa7cu7toqi8v8tpgfo!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/6761d3eda75fa0c00dbc1611917fa6b6/1040g00831s4hleqv5mdg5qa7cu7toqi8ar6aoog!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/9343a175a73ae0e3cdb500a53f575b66/1040g00831s4hleqv5mk05qa7cu7toqi874dr07o!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 4, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/6ce89c4971501401db800a34ffc63b82/1040g00831s4hleqv5mkg5qa7cu7toqi89dunfk0!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 5, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/5f2168894e470c2c521b6364b865f40e/1040g00831s4h64e1ls0g5qa7cu7toqi8rngumbo!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 6, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/475832c73ac1f8640dc51b30139e5e64/1040g00831s4h64e1ls1g5qa7cu7toqi8nbb20p8!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440} ": 0, "sub_comment_count": 0, "publish_time_ms": 1770121255000, "ip_location": "广东", "pictures": []}, {"comment_id": "69e05a26000000000202b660", "parent_id": null, "user_id": "69df77cd000000003401bddf", "nickname": "不谏", "content": "1", "like_count": 0, "sub_comment_count": 1, "publish_time_ms": 1776310823000, "ip_location": "四川", "pictures": []}, {"comment_id": "69e05a550000000035008d04", "parent_id": "69e05a26000000000202b660", "user_id": "6947678f0000000037006a48", "nickname": "欣雨小橘子", "content": "dd[派对R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776310869000, "ip_location": "广东", "pictures": []}]}, {"note_id": "69c65dca000000001f0036c6", "xsec_token": "ABsMApFo0UBdg9sXUvAx5r0n3fDGw8T21V5vneE5U5dIY=", "url": "https://www.xiaohongshu.com/explore/69c65dca000000001f0036c6?xsec_token=ABsMApFo0UBdg9sXUvAx5r0n3fDGw8T21V5vneE5U5dIY=&xsec_source=pc_search", "type": "normal", "title": "用Claude写综述，别一上来就让它写", "body": "用Claude写文献综述，我之前也是直接让它写，出来一看——\"近年来\"\"逐渐成为\"\"值得注意的是\"，段落结构左右对称。翻了不少审稿人的反馈，这些基本是公认的AI痕迹特征。\n\t\n后来换了个思路，分三步走，出来的东西像人写的了。拿两篇最近比较火的自动科研系统论文试了一下，同一个主题对比过。\n\t\n❌ 错误示范：直接让Claude写，出来就是标准AI八股\n\t\n✅ 第一步：只让Claude提信息，不让它写文章\n\t\n把论文喂给它，让它列表格——每篇论文的核心观点、方法、局限性，不要组织成文章。这一步是让Claude当研究助理，省得你自己一篇篇翻着整理。\n\t\n✅ 第二步：你自己定逻辑主线\n\t\n这步最关键，也是AI替代不了的。看完Claude整理的信息，你自己想清楚这几篇论文之间的关系是什么、你的观点是什么。哪怕只写两三句话就行。我当时写的是\"这两类系统的本质区别不在功能多少，而在于人在系统里的位置不同\"，就这一句话，后面整段的逻辑都从这里长出来。\n\t\n✅ 第三步：让Claude基于你的逻辑润色，同时给它禁忌清单\n\t\n把你的观点和第一步的表格一起给Claude，让它组织成学术语言。同时明确告诉它哪些表达不要用——\"值得注意的是\"\"综上所述\"\"至关重要\"，不要每段总分总，不要对称句式。这些是我翻审稿反馈总结的高频AI特征词，不一定完整，但避开这几个差别已经比较明显了。\n\t\n🔍 效果对比：\n\t\n同一个论点，直接写出来是\"两种系统的根本差异在于对自动化边界的不同定义\"，分步走出来是\"区别不在谁的功能多，一个让人掌控判断，一个让人退到起点\"。前者是AI在替你想，后者是你在想、AI帮你说。\n\t\n我只测了两篇CS方向的论文，其他学科不确定效果完全一样，有试过的可以评论区反馈。思路应该是通的：让AI处理信息和语言，观点和判断留给自己。\n\t\n💡 最后说一句，AI辅助写综述和AI替你写综述是两回事。综述的价值在于你对文献的理解和判断，这个不管用什么工具都省不了。\n\t\n#claude[话题]# #文献综述[话题]# #论文写作[话题]# #研究生[话题]# #科研[话题]# #AI工具[话题]#", "author_id": "5d1dba2b000000001001b024", "author_nickname": "就叫老黄吧", "publish_time_ms": 177460781 vcdGoX1ri2gZ7TVm2ts9FGYCW-YtC14=", "url": "https://www.xiaohongshu.com/explore/6852d5a9000000002203d510?xsec_token=ABvIxBytsNOLc1vcdGoX1ri2gZ7TVm2ts9FGYCW-YtC14=&xsec_source=pc_search", "type": "normal", "title": "期未周课程结课论文～～～", "body": "期末周了，结课论文怎么写？\n1. 确定论文主题\n•\t结合课程内容，选择一个具体的方向或问题进行深入研究。\n•\t确保主题明确且可操作，能够在论文中充分展开讨论。\n2. 查阅资料\n•\t查找与课程相关的书籍、论文、学术期刊、网络资源等，进行充分的文献回顾。\n•\t收集足够的资料为自己的论文提供理论支持。\n3. 拟定论文提纲\n•\t提纲应该包含引言、正文和结论三大部分，每一部分下面可以细分出具体小节。\n•\t在正文中，逻辑要清晰，内容要连贯，注意层次分明。\n4. 撰写引言部分\n•\t引言中要简要介绍论文的背景、研究问题的来源、研究目的、意义和方法。\n•\t让读者对论文的研究对象和方向有一个初步了解。\n5. 撰写正文部分\n•\t**理论框架：**简要介绍相关理论或前人的研究成果，阐明你的研究基础。\n•\t**研究方法与数据分析：**描述你采用的研究方法、数据来源、分析方法等，确保论文的论证有依据。\n•\t**分析与讨论：**根据研究结果进行详细的分析，回答论文中提出的问题，讨论结果的意义。\n6. 撰写结论部分\n•\t总结研究的主要发现，回顾论文目标的实现情况。\n•\t提出研究的局限性及未来可能的研究方向。\n•\t结论部分要简洁明了，避免赘述。\n7. 引用与参考文献\n•\t在论文中引用相关文献时，按要求进行引用，遵循相应的引用格式（如APA、MLA等）。\n•\t列出所有参考过的文献，确保资料来源的规范性和权威性。\n8. 修改与完善\n•\t写完论文后，进行多次修改，检查逻辑是否清晰、语言是否简练。\n•\t注意格式的统一，确保论文排版规范。\n9. 完成封面和目录\n•\t按照学校或教师要求的格式填写论文封面，确保包含必要信息。\n•\t论文目录要清晰列出各章节及页码，方便读者查阅。\n#期末周破防 #期末课程论文 #课程论文写作 #文章写作#论文 #结课论文#水课论文害人不浅", "author_id": "6736dda2000000001d02d4b9", "author_nickname": "小红薯684C9B63", "publish_time_ms": 1750259113000, "ip_location": null, "liked_count": 6, "collected_count": 3, "comment_count": 33, "share_count": 1, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778559396255, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121216/f61565e5e78e90924d03e3fc37f291ea/notes_pre_post/1040g3k031isipik61g4g5ppmrmh7dl5piparb8o!nd_dft_wlteh_webp_3", "width": 1055, "height": 1421}], "comments": [{"comment_id": "69f98222000000002900d290", "parent_id": null, "user_id": "64e4cc840000000001013e03", "nickname": "爱偷吃的灌汤包", "content": "谁接", "like_count": 2, "sub_comment_count": 0, "publish_time_ms": 1777959459000, "ip_location": "重庆", "pictures": []}, {"comment_id": "69e358bb000000001401d42c", "parent_id": null, "user_id": "63ad331d0000000027028a46", "nickname": "Hzz." const fmt = (n) => {
  if (n === null || n === undefined) return '-';
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return String(n);
};
const escapeHtml = (s) => {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
};
const tsFmt = (ms) => {
  if (!ms) return '';
  const d = new Date(ms);
  return d.toLocaleString('zh-CN', {hour12: false});
};

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const sortSel = document.getElementById('sort');
const countChip = document.getElementById('count-chip');

document.getElementById('stats').textContent =
  `共 ${DATA.stats.notes} 篇笔记 · ${DATA.stats.comments} 条评论 · ${DATA.stats.images} 张图片 · `
  + `生成于 ${new Date(DATA.generated_at).toLocaleString('zh-CN', {hour12:false})}`;

function rank(n, key) {
  if (key === 'engagement') {
    return (n.liked_count||0) + (n.collected_count||0) + (n.comment_count||0)*2 + (n.share_count||0)*3;
  }
  return n[key] || 0;
}

function matches(n, q) {
  if (!q) return true;
  q = q.toLowerCase();
  const hay = [n.title, n.body, n.author_nickname, ...(n.tags||[]),
               ...(n.comments||[]).map(c => c.content + ' ' + (c.nickname||''))]
              .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

function thumbStyle(n) {
  if (n.images && n.images.length && n.images[0].url) {
    return `background-image: url("${n.images[0].url}")`;
  }
  return '';
}

function render() {
  const q = search.value.trim();
  const sortKey = sortSel.value;
  const list = DATA.notes
    .filter(n => matches(n, q))
    .sort((a,b) => rank(b, sortKey) - rank(a, sortKey));
  countChip.textContent = `显示 ${list.length} 篇`;
  grid.innerHTML = list.map((n, i) => `
    <div class="card" data-idx="${i}" onclick="openModal('${n.note_id}')">
      <div class="thumb-wrap">
        <div class="thumb" style="${thumbStyle(n)}">
          ${(!n.images || !n.images.length || !n.images[0].url) ? '无图' : ''}
        </div>
        ${n.type === 'video' ? '<span class="video-badge">视频</span>' : ''}
      </div>
      <div class="body-wrap">
        ${n.title ? `<div class="title">${escapeHtml(n.title)}</div>` : ''}
        <div class="body">${escapeHtml(n.body || '')}</div>
        <div class="meta">
          <span class="metric">❤ <b>${fmt(n.liked_count)}</b></span>
          <span class="metric">⭐ <b>${fmt(n.collected_count)}</b></span>
          <span class="metric">💬 <b>${fmt(n.comment_count)}</b></span>
          <span class="metric">📤 <b>${fmt(n.share_count)}</b></span>
        </div>
        <div class="author-row">
          <span>@${escapeHtml(n.author_nickname || '?')}</span>
          ${n.ip_location ? `<span>📍${escapeHtml(n.ip_location)}</span>` : ''}
        </div>
        ${n.tags && n.tags.length ? `<div class="tags">${
          n.tags.slice(0,5).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
        }</div>` : ''}
      </div>
    </div>
  `).join('');
}

function openModal(noteId) {
  const n = DATA.notes.find(x => x.note_id === noteId);
  if (!n) return;
  const xhsUrl = n.url || `https://www.xiaohongshu.com/explore/${n.note_id}`;
  document.getElementById('modal-body').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${escapeHtml(n.title || '(无标题)')}</h2>
    <div class="meta-row">
      <span>@${escapeHtml(n.author_nickname || '?')}</span>
      ${n.ip_location ? `<span>📍${escapeHtml(n.ip_location)}</span>` : ''}
      ${n.publish_time_ms ? `<span>发布于 ${tsFmt(n.publish_time_ms)}</span>` : ''}
      <a class="original" href="${xhsUrl}" target="_blank">↗ 原帖</a>
    </div>
    <div class="metric-row">
      <span>❤ 点赞 <b>${fmt(n.liked_count)}</b></span>
      <span>⭐ 收藏 <b>${fmt(n.collected_count)}</b></span>
      <span>💬 评论 <b>${fmt(n.comment_count)}</b></span>
      <span>📤 分享 <b>${fmt(n.share_count)}</b></span>
    </div>
    ${n.tags && n.tags.length ? `<div class="tags">${
      n.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
    }</div>` : ''}
    <div class="full-body">${escapeHtml(n.body || '')}</div>
    ${n.images && n.images.length ? `<div class="img-grid">${
      n.images.map(img =>
        `<img src="${img.url}" loading="lazy" referrerpolicy="no-referrer" onclick="showLightbox('${img.url}')">`
      ).join('')
    }</div>` : ''}
    <div class="comments-section">
      <h3>评论 ${n.comments.length} 条（已抓取）</h3>
      ${n.comments.map(renderComment).join('') || '<div style="color:var(--muted)">无评论</div>'}
    </div>
  `;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderComment(c) {
  return `
    <div class="comment ${c.parent_id ? 'reply' : ''}">
      <div class="c-head">
        <span class="nick">@${escapeHtml(c.nickname || '?')}</span>
        ${c.ip_location ? `<span>📍${escapeHtml(c.ip_location)}</span>` : ''}
        ${c.publish_time_ms ? `<span>${tsFmt(c.publish_time_ms)}</span>` : ''}
        <span class="c-likes">❤${fmt(c.like_count)}</span>
      </div>
      <div class="c-body">${escapeHtml(c.content || '')}</div>
    </div>
  `;
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function showLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    document.getElementById('lightbox').classList.remove('open');
  }
});

search.addEventListener('input', render);
sortSel.addEventListener('change', render);
render();
</script>
