<!doctype html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>xhs crawl dashboard</title>
<style>
  :root {
    --bg: #fafafa; --panel: #ffffff; --border: #e5e5e7;
    --fg: #1d1d1f; --muted: #6e6e73; --accent: #ff2741;
    --tag-bg: #f2f2f7; --shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font-family: -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  header { max-width: 1400px; margin: 0 auto 20px; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .stats { color: var(--muted); font-size: 13px; }
  .controls {
    max-width: 1400px; margin: 0 auto 20px; display: flex; gap: 12px;
    flex-wrap: wrap; align-items: center;
  }
  .controls input, .controls select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); font-size: 13px; color: var(--fg); outline: none;
  }
  .controls input { flex: 1; min-width: 200px; max-width: 320px; }
  .controls input:focus, .controls select:focus { border-color: var(--accent); }
  .count-chip { color: var(--muted); font-size: 12px; }
  main {
    max-width: 1400px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .card .thumb {
    width: 100%; aspect-ratio: 3/4; background: #f0f0f3 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
  }
  .card .thumb.video::after { content: "▶"; position: absolute; font-size: 32px; color: white; }
  .thumb-wrap { position: relative; }
  .video-badge {
    position: absolute; top: 8px; right: 8px; padding: 2px 6px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 10px; border-radius: 4px;
  }
  .body-wrap { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .title { font-size: 14px; font-weight: 600; line-height: 1.35;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
           overflow: hidden; }
  .body {
    color: var(--muted); font-size: 12px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .metric { display: inline-flex; align-items: center; gap: 3px; }
  .metric b { color: var(--fg); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: var(--tag-bg); color: var(--muted);
  }
  .author-row { font-size: 11px; color: var(--muted); display: flex; gap: 8px; }
  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100;
    display: none; align-items: flex-start; justify-content: center; padding: 40px 20px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel); border-radius: 16px; max-width: 900px; width: 100%;
    padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.3); position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border: none; background: var(--tag-bg); border-radius: 50%; cursor: pointer;
    font-size: 16px; color: var(--muted);
  }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  .modal .meta-row { color: var(--muted); font-size: 12px; margin-bottom: 12px;
                     display: flex; gap: 16px; flex-wrap: wrap; }
  .modal .metric-row {
    display: flex; gap: 16px; padding: 12px 16px; background: var(--tag-bg);
    border-radius: 10px; margin: 12px 0; font-size: 13px;
  }
  .modal .full-body { white-space: pre-wrap; line-height: 1.6; margin: 16px 0; }
  .modal .img-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px; margin: 16px 0;
  }
  .modal .img-grid img {
    width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px;
    cursor: pointer; transition: transform .15s;
  }
  .modal .img-grid img:hover { transform: scale(1.02); }
  .modal .comments-section h3 {
    margin: 24px 0 8px; font-size: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .comment {
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .comment.reply { margin-left: 28px; border-left: 2px solid var(--tag-bg);
                   padding-left: 12px; border-bottom: none; }
  .comment .c-head {
    color: var(--muted); font-size: 11px; margin-bottom: 4px;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .comment .c-head .nick { color: var(--fg); font-weight: 500; }
  .comment .c-body { line-height: 1.5; white-space: pre-wrap; }
  .comment .c-likes { color: var(--accent); font-size: 11px; }
  .modal a.original {
    display: inline-block; padding: 4px 10px; background: var(--accent); color: white;
    border-radius: 6px; text-decoration: none; font-size: 12px;
  }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 200;
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; }
</style>
</head>

快速为你总结核心观点、方法和结论。这能帮你快速判断一篇文献是否相关。\n\t\n可参考的指令：“总结这篇论文的核心论点、使用了什么研究方法、主要发现了什么？”（可以用diffmind工具，直接一个问题问3个模型，择优选择）\n\t\n- 第二步，识别研究主题和流派\n- 第三步，你可以提供几篇文献的核心观点，让AI围绕一个主题将它们串联成一个段落草稿，你需要在此基础上进行修改。\n\t\n2️⃣研究设计与方法（图三）\n大家直接看图，我写得非常详细啦。ps：这里用diffmind亲测下来我觉得Gemini和Claude的效果比较好\n3️⃣数据分析与结果（图四）\n⚠️注意\n- 先报告结果，再解释含义\n- 不支持的假设也要如实报告，不要数据有问题的就不说了。假设不成立也是一种结果。\n\t\n4️⃣讨论与结论\n核心任务：回到你的研究问题，说清楚你发现了什么、意味着什么、有什么用、还有什么局限。\n必须包含的内容有四点，看图5、6\n\t\nps：再分享一个能快速让你进入写论文状态的方法：每天先改昨天的500字再写新内容，这也既能保持手感又推进进度。\n\t\n⚠️ 写在最后：\n1. 禁止直接生成正文： 那是学术不端。AI 工具仅用于辅助文献阅读和思路整理，最终论文需基于个人理解独立完成，所有的文字必须经过你大脑的过滤。\n\t\n2. 事实核查： AI 容易产生“幻觉”，它提供的文献引用一定要去原篇核实，尽可能直接给它文献，绝对不能直接照搬哦。\n#写论文[话题]# #毕业论文[话题]# #研究生[话题]# #论文写作[话题]#  #Diffmind[话题]#", "author_id": "5a7eb87e4eacab3069a8709b", "author_nickname": "🌳邱燃燃", "publish_time_ms": 1774348756000, "ip_location": null, "liked_count": 14000, "collected_count": 16000, "comment_count": 89, "share_count": 1283, "image_count": 6, "video_url": null, "video_duration_ms": null, "crawled_at": 1778556599026, "tags": ["写论文", "毕业论文", "研究生", "论文写作", "Diffmind"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/80679404b56d4f33139feca82d2d1788/notes_pre_post/1040g3k031u3e72jo24004a1cj9s7ss4r8oftsog!nd_dft_wlteh_webp_3", "width": 1089, "height": 1452}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/ae371b1d50d712a9191a50b42dfd10c8/notes_pre_post/1040g3k031u3e72jo240g4a1cj9s7ss4r7nbvpbg!nd_dft_wlteh_webp_3", "width": 1242, "height": 1656}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/87fdc14d6c3098338fde8930363553d5/notes_pre_post/1040g3k031u3e72jo24104a1cj9s7ss4rn6el430!nd_dft_wlteh_webp_3", "width": 1242, "height": 1656}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/9cc6776e098dddaf80195d57d3f73215/notes_pre_post/1040g3k031u3e72jo241g4a1cj9s7ss4rp311nn0!nd_dft_wlteh_webp_3", "width": 1242, "height": 1656}, {"idx": 4, "url": "https://sns-webpic-qc.xhscdn.com/202605121129/617b30497b92460e7eab 太过口语化，不要使用儿化音（如“里头”“这块儿”“这会儿”）。允许使用“这里”“当中”“这一”等规范表达，但避免过于随意的语气词。\n#降ai率[话题]# #ai[话题]# #润色[话题]# #人工智障与人工智能[话题]# #跟你们拼了[话题]# #改改改改到厌倦[话题]#", "author_id": "5f2e108a000000000100aab6", "author_nickname": "叶渐晴", "publish_time_ms": 1776782690000, "ip_location": "福建", "liked_count": 28000, "collected_count": 34000, "comment_count": 1244, "share_count": 3803, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778556690168, "tags": ["降ai率", "ai", "润色", "人工智障与人工智能", "跟你们拼了", "改改改改到厌倦"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121131/c8f20f54461a110d22295b64a332cf6b/1040g2sg31v7q5fnniqdg5npe22509alm641es80!nd_dft_wlteh_webp_3", "width": 1644, "height": 2560}], "comments": [{"comment_id": "69e78d79000000001401e82a", "parent_id": null, "user_id": "5f2e108a000000000100aab6", "nickname": "叶渐晴", "content": "四、补充注意事项\n不要使用“大家”“我们”这类词，可以用“笔者”“研究者”“该研究”或直接省略主语。\n专有名词必须完整保留，包括英文术语、书名、人名、引用标记等。\n数字：尽量不要单独使用阿拉伯数字，可以写全称，或保留数字但调整位置。\n引用：引用标记保留不动。\n中英文混合：英文单词或句子尽量保留原样，除非有特别要求修改。五、输出格式要求\t\n每次修改后，请按以下格式输出：\t\n原文：\t\n（粘贴用户提供的原句）\t\n修改后：\t\n（粘贴修改后的句子）\t\n具体位置： （如“第三章，第3.2.1节，第二段”）\t\n修改原因： （简要说明应用了哪些条例）\t\n如果用户一次性提供了多个段落，请逐段输出。", "like_count": 154, "sub_comment_count": 2, "publish_time_ms": 1776782714000, "ip_location": "安徽", "pictures": []}, {"comment_id": "69fbde780000000029035e18", "parent_id": null, "user_id": "60c1628a0000000001002686", "nickname": "百色鎏生", "content": "需要手搓降AI率的，2w字，带价来", "like_count": 5, "sub_comment_count": 5, "publish_time_ms": 1778114168000, "ip_location": "陕西", "pictures": []}, {"comment_id": "69fdda5f000000002b02b0d8", "parent_id": null, "user_id": "62bee2d1000000001b02a8bf", "nickname": "momo（dead version）", "content": "蹲帮忙降ai率的", "like_count": 5, "sub_comment_count": 5, "publish_time_ms": 1778244192000, "ip_location": "湖南", "pictures": []}, {"comment_id": "6a0289910000000029037668", "parent_id": null, "user_id": "69e5c1360000000002002000", "nickname": "我叫韩sir", "content": "3w字降ai有人接吗", "like_c on": "广东", "pictures": []}, {"comment_id": "69fdc84b000000002a02cfcd", "parent_id": "69fdc7fc000000002b0024a9", "user_id": "6947678f0000000037006a48", "nickname": "欣雨小橘子", "content": "ok", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778239564000, "ip_location": "广东", "pictures": []}]}, {"note_id": "69dc5392000000001a02a8ae", "xsec_token": "ABc1Vwbm__hslNd6dnQbZMa4DwjfDPC5aKruevsSkJzJ0=", "url": "https://www.xiaohongshu.com/explore/69dc5392000000001a02a8ae?xsec_token=ABc1Vwbm__hslNd6dnQbZMa4DwjfDPC5aKruevsSkJzJ0=&xsec_source=pc_search", "type": "normal", "title": "写论文到底该用gpt还是gemini？？", "body": "作为最近被论文折磨的过来人，我深度使用了Gemini Pro和GPT Plus（包括它们的“深度研究”功能），有些实在的感受想分享给你。\n\t\n核心结论：对于论文写作本身，我更推荐GPT；但对于文献查找和图表制作，Gemini有独特优势。\n下面是我的具体使用体验和原因：\n1. 写作质量与风格：GPT更胜一筹\n• Gemini的问题：它的语言风格有时过于华丽和“书面化”，在工科等需要严谨、平实表达的论文中，容易显得“假大空”，不贴近实际的学术写作场景。\n• GPT的优势：它的用语更自然，更符合绝大多数论文的写作惯例和语气，直接用来辅助撰写或润色部分章节，效果更令人满意。在需要长线、深度思考的写作任务上，GPT的表现公认更好。\n2. 文献查找：两者皆可，但体验不同\n• 只要你的指令清晰明确，两者都能给出真实可查的文献。\n• 但它们的“性格”不一样：GPT像一个顶级的思维导师，教你如何高效地搜索和筛选；而Gemini则像手握Google数据库的助手，更倾向于直接给你结果。对于快速查证，Gemini的“数据优势”感知更明显。\n3. 图表制作：Gemini是隐藏高手\n• 在根据数据或描述生成图表（包括示意图、流程图）方面，Gemini的表现非常出色，强烈推荐。它在这类任务上的理解力和输出质量很高。\n4. 功能稳定性：GPT更可靠\n• 一个实际困扰：Gemini的“深度研究”功能近期极其不稳定，经常出现报告生成后打不开，或者功能直接无法使用的情况，非常影响连续工作的体验。相比之下，GPT的相应功能要稳定得多。\n\t\n给你的最终建议：\n• 主用GPT进行论文的撰写、思路梳理和深度润色，它的语言风格和思考深度更适合这项核心工作。\n• 将Gemini作为强大的辅助工具，专门用于快速查找文献和制作各类图表，把这部分优势发挥到极致。\n• 考虑到功能稳定性，不要把关键路径上的任务押注在Gemini的“深度研究”上。\n希望这份基于真实踩坑经验的对比，能帮你更高效地选择工具，把时间花在刀刃上，早日完成论文！\n#写论文[话题]# #大模型[话题]# #AI人工智能[话题]# #gpt[话题]# #gemini[话题]#", "author_id": "56f348791c07df02d4826f43", "author_nickname": "Ai 能量站", "publish_time_ms": 1776046994000, "ip_location": "福建", "liked_count": 366, "collected_count": 295, "comment_count": 126, "share_count": 63, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778557049552, "tags": ["写论文", "大模型", "AI人工智能", "gpt", "gemini"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121137 , "content": "github上有一些research skill集合，但我觉得还是要自己定制属于自己的", "like_count": 36, "sub_comment_count": null, "publish_time_ms": 1771994140000, "ip_location": "河南", "pictures": []}, {"comment_id": "699d8b6b000000000b037c38", "parent_id": "699d7e3d0000000015015bbb", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "vibe", "like_count": 25, "sub_comment_count": null, "publish_time_ms": 1771932523000, "ip_location": "河南", "pictures": []}, {"comment_id": "699dc258000000000800e858", "parent_id": "699dafbf000000000f00f3c4", "user_id": "58f236456a6a690a7c4d7cb0", "nickname": "Cherry", "content": "我也一直在抱怨不好用，但是不耽误使用[暗中观察R][暗中观察R]", "like_count": 15, "sub_comment_count": null, "publish_time_ms": 1771946585000, "ip_location": "山东", "pictures": []}, {"comment_id": "699db527000000000c00afa2", "parent_id": "699db21e000000000f025d7c", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "对的，用skill一部分一部分写", "like_count": 9, "sub_comment_count": null, "publish_time_ms": 1771943208000, "ip_location": "河南", "pictures": []}, {"comment_id": "699e715800000000080312d5", "parent_id": "699e4e2d000000000800cc4a", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "有的", "like_count": 3, "sub_comment_count": null, "publish_time_ms": 1771991384000, "ip_location": "河南", "pictures": []}, {"comment_id": "699db50f00000000090221dc", "parent_id": "699db2e2000000000b03653c", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "我平时有记idea的习惯，也可以ai扩充下自己改", "like_count": 2, "sub_comment_count": null, "publish_time_ms": 1771943183000, "ip_location": "河南", "pictures": []}, {"comment_id": "69a7bb0a000000000600afa7", "parent_id": "69a7bafd000000000f00f784", "user_id": "68944c1e0000000028001164", "nickname": "问一问", "content": "你好，很高兴为你提供帮助。想要用AI辅助写文章，关键在于 将AI视为一个高效的“写作伙伴”，而不是一个“自动写手” 。你需要像指导一位得力助手一样，通过清晰的指令（Prompt）和分步协作，来引导AI完成任务。这不仅能提升效率，还能确保文章的逻辑和风格符合你的个人特色。\n【核心方法：分步协作与精准指令】\nAI写作的核心在于“人机协作”。与其一次性让AI生成全文，不如将其拆解为几个步骤，这样更容易控制和优化结果。\n第一步：规划与构思 (Planning)在动笔前，先和AI讨论你的想法。你可以提供一个模糊的选题，让AI帮你 提出新颖的切入点、设计文章大纲或研究计划 。这一步可以帮你理清思路，形成一个清晰的写作框架。\n第二步：分块撰写 (Writing in Parts)根据第一步生成的大纲， 将文章分成几个部分，让AI逐个生成 。例如，先写引言，再写第一部分的正文。对于较长的文章，一次性生成容易导致上下文丢失或质量下降。分块撰写可以确保每个部分都得到充分的处理。\n第三步：润色与修改 (Editing)AI生成的初稿可能在语言风格、逻辑衔接上需要调整。你可以 提供具体的修改要求 ，比如“请用更学术的语言重写这个段落”或“请检查这两个段落之间的过渡是否流畅，并提出修改建议”。你也可以扮演“审稿人”，请AI从专业角度审视文章，找出逻辑漏洞。\n【高效工具：利用“Skill”或“Agent”】\n一些AI平台（如Claude、OpenClaw等）支持创建“Skill”或“Agent”，这相当于为AI编写一套自动化的工作流程。你可以 将复杂的任务（如资料搜集、选题、写作、审稿、发布）拆解成SOP（标准作业程序），并设计多个Skill进行组合 。这样，你只需在关键节点做决策，大部分流程就可以自动化完成，极大地提升效率。\n【避坑指南】\n避免过度依赖：AI是辅助工具，最终的构思、判断和修改必须由你来完成。不要让AI完全主导创作过程。\n注意事实核查：AI在引用文献或生成数据时可能会“编造”（即“幻觉”）。对于需要严谨性的内容，务必对AI提供的信息进行核实。\n明确指令：给AI的指令越具体、越详细，它生成的结果就越符合你的预期。例如，明确要求字数、风格、结构，甚至提供参考文章。", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1772600074000, "ip_location": null, "pictures": []}, {"comment_id": "699e6771000000000600c4cb", "parent_id": "699dba7700000000180398a7", "user_id": "5e3ebf3100000000010081ff", "nickname": "李liuliu", "content": "顿顿", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1771988850000, "ip_location": "四川", "pictures": []}, {"comment_id": "69c33a86000000001500b9c3", "parent_id": "69c3307c000000000f019a34", "user_id": "5a844f0c4eacab4d3765ed24", "nickname": "徐明辉", "content": "发展一日千里，你可以试试各种新工具", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1774402183000, "ip_location": "山东", "pictures": []}]}, {"note_id": "69f8d74f000000001f001d4f", "xsec_token": "AB-DT04PZ-xVjOOCoJE_Dn-DGrhpT4sNdeBJG4BwUvkUw=", "url": "https://www.xiaohongshu.com/explore/69f8d74f000000001f001d4f?xsec_token=AB-DT04PZ-xVjOOCoJE_Dn-DGrhpT4sNdeBJG4BwUvkUw=&xsec_source=pc_search", "type": "normal", "title": "论文我恨你。。", "body": "物流管理本科毕业生。。太拖延了，最后一天才开始写，全是用ai写的，数据也是ai弄的。初稿这样交有事吗好崩溃呀，但是我自己真的不会写#写论文[话题]# #论文初稿[话题]# #毕业论文[话题]# #尖叫扭曲阴暗地爬行[话题]#", "author_id": "634e2ebf000000001802fb07", "author_nickname": "我恨你", "publish_time_ms": 1777915727000, "ip_location": "江苏", "liked_count": 5092, "collected_count": 4 ll, "publish_time_ms": 1776317845000, "ip_location": "湖北", "pictures": []}, {"comment_id": "69e036bf000000003502c9e5", "parent_id": "69e007c700000000350209a0", "user_id": "68bfb6440000000019021a50", "nickname": "森若学姐", "content": "好滴[飞吻R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776301759000, "ip_location": "湖北", "pictures": []}, {"comment_id": "69e0fc1e0000000014019407", "parent_id": "69e0fc01000000001401941e", "user_id": "68bfb6440000000019021a50", "nickname": "森若学姐", "content": "来啦宝子", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776352286000, "ip_location": "湖北", "pictures": []}]}, {"note_id": "69fdcd5b0000000038034703", "xsec_token": "ABo6UWy4sISxh00S_KnVy9zOOJD4dW6Scs-hGQt8A3G6s=", "url": "https://www.xiaohongshu.com/explore/69fdcd5b0000000038034703?xsec_token=ABo6UWy4sISxh00S_KnVy9zOOJD4dW6Scs-hGQt8A3G6s=&xsec_source=pc_search", "type": "normal", "title": "AI会不会把博士卷到两个月一篇paper?", "body": "没有AI的时候，大家是怎么写论文的？\n自从AI出现后，整个科研节奏突然被拉得很快了。\n有时候只是把一个模糊的想法丢进去：“这个方向还有哪些gap？”“如果换一个模型会怎样？”\n然后AI开始疯狂输出。\n文献总结、研究思路、实验设计、discussion逻辑、figure narrative，甚至连reviewer可能攻击哪里，它都能帮你提前想到。\n一句话怎么写，AI在1分钟可以给了十几种版本。\n今天我一边改论文，一边突然有种很奇怪的感觉：\n“如果按这个效率继续下去，未来做科研会不会快到可怕？”\n或许真正让我们焦虑的，不是AI太弱。恰恰是它太强了。\n因为你很快会意识到：\n当所有人都开始用的时候，整个科研行业的标准一定会被重新抬高。\n以前会写代码的人很稀缺。现在代码小白也完全没有问题，以前做图、润色、搭paper structure很耗时间。现在这些正在迅速变成基础能力。\n于是整个科研开始进入一种新的内卷。不只是要把结果做出来。还要求：story更完整，figure更精致，narrative更像顶刊。有时候会突然觉得，AI好像正在把整个科研世界推向一个越来越高标准的时代。\n但与此同时，我又越来越强烈地意识到：\nAI替代的，其实只是科研里最容易被标准化的部分。\n真正越来越重要的，反而是那些更高层的东西。\n比如：你为什么想到这个问题？你知不知道哪个结果只是artifact？你能不能怀疑自己的结论？\n因为AI现在最擅长的，其实是：生成一个“看起来合理”的东西。但科研最核心的能力，恰恰是：判断什么是真正可信的。\n所以我最近越来越觉得，未来最危险的，可能不是不会用AI的人。而是只停留在“执行层”的人。因为执行正在被极速贬值。未来真正稀缺的能力，可能会越来越偏向：判断力，对复杂问题的组织能力，和AI协同思考的能力。\n这其实有点互联网刚刚出现之后的变化。以前查文献都要去图书馆。现在“掌握信息”已经没有门槛。于是最后真正拉开差距的，开始变成：\n你到底看见了什么。\n我觉得科研可能也正在进入这个阶段。所以现在有时候会忍不住想：\n当AI让“完成科研”越来越容易之后，未来博士真正的含金量，到底会变成什么？\n#PhD[话题]# #大模型[话题]# #博士生日常[话题]# #AI[话题]# #留学生活[话题]#", "author_id": "5755117550c4b45c734a798b", "author_nickname": "菜菜酱🛫" 做到。今年icml我知道的有完全一周靠ai实验加写文章就中的", "like_count": 24, "sub_comment_count": null, "publish_time_ms": 1778259297000, "ip_location": "中国香港", "pictures": []}, {"comment_id": "69fde41100000000290265e9", "parent_id": "69fdd997000000002900e49e", "user_id": "626fbc2f000000002102351e", "nickname": "momo", "content": "从0-1都是ai吗[doge]", "like_count": 4, "sub_comment_count": null, "publish_time_ms": 1778246673000, "ip_location": "安徽", "pictures": []}, {"comment_id": "69fe1936000000002a006796", "parent_id": "69fe06260000000029036ffb", "user_id": "63f1f67f000000001001ea67", "nickname": "believer", "content": "现在的论文就是很像技术报告", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1778260278000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69fec1ee000000002803f323", "parent_id": "69fec03300000000290123fb", "user_id": "593f5d4882ec392005945467", "nickname": "十三欧", "content": "主要是想要个cc opus 4.6+codex5.3+gpt5+gemni 3 pro都包含的集成站，还不能是阉割版的", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778303471000, "ip_location": "广东", "pictures": []}]}, {"note_id": "69b70e39000000001a0262ed", "xsec_token": "ABxgxXx6TYndprqOTn3V62-KcBPnziNOLUenw1ssO8V3s=", "url": "https://www.xiaohongshu.com/explore/69b70e39000000001a0262ed?xsec_token=ABxgxXx6TYndprqOTn3V62-KcBPnziNOLUenw1ssO8V3s=&xsec_source=pc_search", "type": "normal", "title": "用 AI 写论文Claude Code 流程", "body": "之前工作里其实做了不少模型训练和对比实验，一直想着整理成文章，但拖延症一直没行动。\n现在都是在用 Claude Code 写报告、整理数据、画图，就想着试试把以前的实验模型能不能也用 AI 整理成文章发表。从开始到文章初稿，大概只用了 3-4 天。\n\t\n简单分享一下我的 workflow。\n第一步：把所有材料放到一个 folder\n把之前的实验资料都放进去，比如：\n模型对比实验，ablation，实验数据，实验记录\n不用一开始就整理得很完美，先集中起来就行。\n\t\n第二步：放几篇 survey 综述或参考论文\n这样 AI 可以理解这个方向在研究什么，以及文章一般是怎么写的。补充一点，直接把 10–20 篇 PDF 丢给 Claude，会自动压缩总结。但如果论文多（比如 50+），更推荐先单篇总结，再做小批合并，最后全局总结，这样是一个多级压缩效果更好\n\t\n第三步：写一个简单的 plan\n比如简单说明：想解决什么问题，做了哪些实验，想表达什么结论\n给 AI 一个基本方向就可以。\n\t\n第四步：如果有代码，也一起放进去\n这一点其实很有用。很多实验是以前做的，自己已经忘记了一些细节。Claude Code 可以直接读代码，帮你理解实验流程、补充 method 描述，有时候甚至能发现你当时没有写出来的细节。\n\t\n第五步：直接生成 LaTeX 论文\n我让 Claude Code 直接生成 LaTeX 文件，包括：\n论文结构section，table / figure，基本可以直接编译。\n\t\n第六步：生成和修改图\n论文里的图我是这样做：先让 Claude Code 生成一个 draw.io 图，我自己简单调整一下，再根据反馈让 Claude Code 再修改一版。几轮下来图就差不多定了。\n\t\n第七步：多轮 review\n写完初稿之后我一般会做几轮 review：\n我自己作为读者读一遍\n再让 AI 作为 reviewer 给出 critique\n\t\n第八步：AI 帮忙总结实验\n实验部分既可以直接引用数据，也可以让 AI 总结趋势、提取关键结果、写实验分析，不一定只是照搬数据。\n\t\n现在最大的感受是：\n只要实验已经做出来，文章其实很容易生成。\n整个过程从开始整理到文章初稿，大概只用了 3-4 天。\n以前觉得写论文最难的是写作，现在反而觉得难的是\n有没有开始把材料整理出来。", "author_id": "5fb89fba000000000101f898", "author_nickname": "sea", "publish_time_ms": 1773604409000, "ip_location": null, "liked_count": 1338, "collected_count": 2027, "comment_count": 77, "share_count": 289, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778557420615, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121143/fdcc9597d0abfcd22eafa159aef2006c/notes_pre_post/1040g3k831toeitpfne005ntojut0bu4o8ocq3m8!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "69bf7938000000001500f5bf", "parent_id": null, "user_id": "6392d7f6000000001f01ccb3", "nickname": "西瓜公主", "content": "做个skill发布一下[doge]", "like_count": 6, "sub_comment_count": 5, "publish_time_ms": 1774156089000, "ip_location": "江苏", "pictures": []}, {"comment_id": "69dfd00b0000000035023588", "parent_id": null, "user_id": "5b60674d4eacab08cc1945fb", "nickname": "白洋", "content": "真能发论文嘛", "like_count": 1, "sub_comment_count": 2, "publish_time_ms": 1776275467000, "ip_location": "江苏", "pictures": []}, {"comment_id": "69ba9225000000001802075a", "parent_id": null, "user_id": "60edaf650000000001015d96", "nickname": "放羊办主任", "content": "需要登录claude 账号吗，API 哪里来", "like_count": 1, "sub_comment_count": 7, "publish_time_ms": 1773834789000, "ip_location": "福建", "pictures": []}, {"comment_id": "69bc398f0000000003013a65", "parent_id": null, "user_id": "62a75a2a000000001b02595e", "nickname": "Petrel", "content": "其实很好奇 现在发期刊到底查不查ai率[哭惹R]", "like_count": 1, "sub_comment_count": 4, "publish_time_ms es": [{"url": "http://sns-webpic-qc.xhscdn.com/202605121144/447843ffdaf73cc9d7fbbef4a1fba027/comment/1040g4b831u3fvc6q2i5g5nkmhl6g8jcdmvtu6bg!nd_whlt34_webp_wm_1", "width": 2553, "height": 786}]}, {"comment_id": "69d4e9860000000015016bc3", "parent_id": "69d44e71000000000c0305f7", "user_id": "66dc77d8000000000b0315e1", "nickname": "liiiiiiii", "content": "我想拼！", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1775561094000, "ip_location": "广东", "pictures": []}, {"comment_id": "69ba7d10000000000f02e569", "parent_id": "69ba6e050000000016014d2b", "user_id": "5e968d4d0000000001004d8d", "nickname": "嗨云", "content": "我的号暂时可以share，但毕业之后我不确定会不会继续开", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1773829392000, "ip_location": "四川", "pictures": []}, {"comment_id": "69dcdc580000000035025084", "parent_id": "69dcc5c80000000032003dae", "user_id": "5e968d4d0000000001004d8d", "nickname": "嗨云", "content": "应该也有，在项目里面", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1776082009000, "ip_location": "四川", "pictures": []}, {"comment_id": "69eb1b88000000001401a021", "parent_id": "69e80cbb000000001401c812", "user_id": "60f136d5000000002002a128", "nickname": "别学我了", "content": "还拼吗", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777015689000, "ip_location": "韩国", "pictures": []}]}, {"note_id": "69eefe2500000000350268fa", "xsec_token": "AByLUTk5lgi_lj-UGJYRfr2Qn6KMwHlFfKCRhCYTpZdOw=", "url": "https://www.xiaohongshu.com/explore/69eefe2500000000350268fa?xsec_token=AByLUTk5lgi_lj-UGJYRfr2Qn6KMwHlFfKCRhCYTpZdOw=&xsec_source=pc_search", "type": "normal", "title": "请说出你的ai论文workflow救救孩子🙏", "body": "本科研小白最近尝试用agent写论文，用了网上各种推荐的skills，感受是无论是codex还是claude都好难用啊。体验如下，求各位大佬指点：\n1. agent会引用一大堆文献，但是根本不会认真进pdf认真读文献说文献观点（我不知道是不是因为我没有把所有参考文献pdf喂给它们而是只给了名字和链接，但是我害怕全喂context太长，而且我怎么记得gpt是可以deep research上网的啊）ps.感觉claude在网页浏览上好傻，是我没用对吗？\n2. agent会自己有自己的想法，修改我已经想好的故事线和大纲，最后反倒是他把我绕进去了，我思路也跟着不清晰了\n3. agent写出一堆但是怎么看怎么和我的想法都不符合，倒不是说写得文字或者内容不好，而是感觉不像我平时看到的有详有略的，每一句都是精华的，看上去很精彩吸引人的论文，但是让我自己改自己写我又不会，十分痛苦\n4.论文画图一般推荐什么软件啊（手搓软件也行，ai看样子是没法指望了）\n\t\n暂时先写这么多，随时补充各种傻傻的困惑，本人刚开始用agent不久，不排除我是真的不会用，也不排除我科研小白水平真的很差，虚心求教\n\t\n——（4.30更新）——\n谢谢大家提的各种建议，我都认真看啦，学到很多，打算用这个帖子长期记录一下小白的感受和困惑\n\t\n最近这两天在画科研图，发现了一个相对好用的生图步骤，虽然不能完全替代，但是帮我省了不少力。\n1. 在描述要画什么图片的同时一定要说是compact poster的（横版/竖版），不然生成的图会很散\n2. 直接生成PPT，看样子是比较困难的，但是模型的frontend的能力是很好的，可以先让他写网页，对网页的各种进行文字要求修改，同时提供示例的论文图\n3.等到网页差不多是一个你可以自己修改的基础了以后，就让他原模原样的转成可编辑的PPT\n#留学[话题]# #写论文[话题]# #论文初稿[话题]# #文献查找[话题]# #论文写作[话题]# #学术论文[话题]# #cs[话题]# #ai[话题]# #agent[话题]# #workflow[话题]#", "author_id": "65b206a5000000000d03e8f6", "author_nickname": "想听听陌生人的答案", "publish_time_ms": 1777270310000, "ip_location": "美国", "liked_count": 3717, "collected_count": 6375, "comment_count": 157, "share_count": 514, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778557517095, "tags": ["留学", "写论文", "论文初稿", "文献查找", "论文写作", "学术论文", "cs", "ai", "agent", "workflow"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121144/5322c6c20f65bb74225f890671aaf7f6/notes_pre_post/1040g3k031vf2ah7s48005pdi0qijfq7m7o1m0io!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "69ef99b4000000002803a2f5", "parent_id": null, "user_id": "579da1d0bd0da51e61c1a9f3", "nickname": "David Raymond", "content": "你没用对，不要直接让它读pdf word这种，因为它本质上是要用相关的Python lib package 去写代码解析这些文件，容易出错，文件解析质量一般也不高，信息不准及不完整。，你应该给它plain text，比如md. 自动下论文，用Chrome dev mcp这种，然后pdf转md，然后才是你auto research 的下游任务。这些都是能形成闭环的工作流的，这些也是ai auto research 的门槛，“会不会用”是个很关键的问题，需要耐心去了解和理解。", "like_count": 962, "sub_comment_count": 25, "publish_time_ms": 1777310133000, "ip_location": "四川", "pictures": []}, {"comment_id": "69f15972000000002803a8dc", "parent_id": null, "user_id": "5f7688480000000001001c43", "nickname": "迷迷糊糊涂涂", "content": "搞个abbyy这种OCR专业软件，把相关性高的价值高的论文和资料全本地转为文字型pdf，然后都丢给Notebooklm，给gpt-think你要做的事情的最终要求，让gpt-think告诉你如何写好用Notebooklm读各篇文章的prompt。然后用这个prompt在Notebooklm里面一篇一篇的了解每篇文章的关键、重点、创新点这些。也就是前期读论文的工作一定要自己亲自做，但是用NotebookLM可以加速对这些论文的快速浏览和重点关、创新点的了解。然后你可以让NotebookLM来去帮忙总结每篇文章的重点，再把总结的文档放到Agent里去做后续的研究和分析。", "like_count": 164, "sub_comment_count": 18, "publish_time_ms": 1777424754000, "ip_location": "江苏", "pictures": []}, {"comment_id": "69f1614a000000002b003514", "parent_id": null, "user_id": "65831e06000000001c027879", "nickname": "AtRe", "content": "1.agent不是许愿机。你要确认你的目标，然后根据目标设计和优化pipeline（或者skills）。\n2.不要给他大而全的任务，这种批量调研任务建议直接用chat页面来做。你要给他具体的任务，spec is better .\n3.最好以latex，markdown或者源代码的形式给它，不要给它", "like_count": 36, "sub_comment_count": 2, "publish_time_ms": 1777426763000, "ip_location": "北京", "pictures": []}, {"comment_id": "69f00566000000000d023c00", "parent_id": null, "user_id": "6423b57a0000000012012044", "nickname": "小红薯", "content": "gemini deep research可以用来总结文献，但是你自己最好去确认一下，其他我不会用ai写，除非是润色或者需要缩减页数的时候，画图就ppt/keynote手搓了，高级一点illustrator", "like_count": 23, "sub_comment_count": 14, "publish_time_ms": 1777337703000, "ip_location": "美国", "pictures": []}, {"comment_id": "69f0d044000000002a0314a7", "parent_id": null, "user_id": "66900a18000000000b031a1d", "nickname": "搭子设计", "content": "可以配合obsidian（建一个论文库，把相关论文收录进去）然后结合Claude code 去用，让CC基于知识库去做产出", "like_count": 11, "sub_comment_count": 1, "publish_time_ms": 1777389637000, "ip_location": "河南", "pictures": []}, {"comment_id": "69f134d9000000002900cce5", "parent_id": null, "user_id": "5fccf66a000000000101f3a9", "nickname": "安然（见过邓紫棋版）", "content": "PDF先转OCR，然后让ai读md文件", "like_count": 9, "sub_comment_count": 3, "publish_time_ms": 1777415386000, "ip_location": "陕西", "pictures": []}, {"comment_id": "69f32f1b000000002803ab73", "parent_id": null, "user_id": "5983e0466a6a695a602a5558", "nickname": "邪恶人民币", "content": "你要把步骤拆解细，一点点带着它做，做的过程中不断看它的反馈，随时调整。我在工作里试过让它先写计划书，然后我review好几版修改好以后，让它按着计划书做，结果出来的还是一坨[呃R]在我把步骤拆解之后质量好很多。所以我现在对ai的理解就是它能帮你做很多琐碎的事，提高效率，但是你的脑子还是得全程在场的。", "like_count": 8, "sub_comment_count": 0, "publish_time_ms": 1777544988000, "ip_location": "广东", "pictures": []}, {"comment_id": "69f2cf0f0000000029034358", "parent_id": null, "user_id": "5c05f474000000000501f678", "nickname": "..", "content": "你们要都会用大学就直接不办，企业就直接gpu和水电拉满就完事儿了。", "like_count": 7, "sub_comment_count": 4, "publish_time_ms": 1777520399000, "ip_location": "美国", "pictures": []}, {"comment_id": "69fc3b830000000029036c9e", "parent_id": null, "user_id": "6540001a0000000004008726", "nickname": "希望哥", "content": "使用 latex 写，pdf 也要转成 latex，你会感谢我的", "like_count": 3, "sub_comment_count": 2, "publish_time_ms": 1778137987000, "ip_location": "湖南", "pictures": []}, {"comment_id": "69f1ab5c0000000029036c61", "parent_id": null, "user_id": "60211d07000000000100084e", "nickname": "刘嘿嘿不黑", "content": "纯小白提问：这个话题中的agent，是面向文科类的吗，理科类的综述能用吗，有哪些硬件条件要求和软件条件要求呀[害羞R]", "like_count": 0, "sub_comment_count": 8, "publish_time_ms": 1777445724000, "ip_location": "上海", "pictures": []}, {"comment_id": "69f15a6c0000000029012529", "parent_id": "69f15972000000002803a8dc", "user_id": "5f7688480000000001001c43", "nickname": "迷迷糊糊涂涂", "content": "我觉得科研用Agent实际上不是很好，因为Agent主要是用来处理自动化的问题。但是对于研究，每篇重点文章实际上都要去认真仔细地读的，或者说要在足够了解全文的情况下，再去做下一步。这个时候就要用NotebookLM这种几乎没有幻觉以及超长上下文的大模型来去做深入和详细的研究，把关键的每篇文章都读透，然后在NotebookLM里总结各篇文章的关键点和重点，这个时候才能够真正吃透各篇文章。按我的理解，NotebookLM会比RAG更有效的理解全文，而且理解得非常深入到位，而且不费token。后面就可以用GPT thinking在这些文章总结的基础上，做下一步的问题研究、讨论、深入分析、发散等等各种", "like_count": 93, "sub_comment_count": null, "publish_time_ms": 1777425004000, "ip_location": "江苏", "pictures": []}, {"comment_id": "69efb3c9000000002701fbfa", "parent_id": "69ef99b4000000002803a2f5", "user_id": "65b206a5000000000d03e8f6", "nickname": "想听听陌生人的答案", "content": "哇好的太感谢了 我去试试", "like_count": 35, "sub_comment_count": null, "publish_time_ms": 1777316810000, "ip_location": "美国", "pictures": []}, {"comment_id": "69f0d22a000000002a006bcf", "parent_id": "69f00566000000000d023c00", "user_id": "5d3581d3000000001001091a", "nickname": "momo", "content": "感觉Gemini的deep research非常水[笑哭R]ChatGPT要专业很多", "like_count": 29, "sub_comment_count": null, "publish_time_ms": 1777390123000, : "69e736f9000000001401a406", "parent_id": "69e72d37000000001401e00e", "user_id": "62c7130c000000000303c2d7", "nickname": "很有精神", "content": "看了几页，感觉ai味不是很浓", "like_count": 964, "sub_comment_count": null, "publish_time_ms": 1776760569000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69e7b398000000001401a803", "parent_id": "69e78713000000002b02b923", "user_id": "63ed87eb000000002702b84c", "nickname": "AshleY", "content": "谢谢，少焦虑很多[笑哭R]", "like_count": 73, "sub_comment_count": null, "publish_time_ms": 1776792472000, "ip_location": "上海", "pictures": []}, {"comment_id": "69e7aaee000000001401cc05", "parent_id": "69e797ff0000000014018c11", "user_id": "61d98f54000000001000a3a5", "nickname": "一列麻椒", "content": "@EoL 这可能是我身边人的共识，也是我一开始看到你发我这个帖子的反应。但我还是隐隐觉得这不太对，这是当下的经验，他未必能持久..", "like_count": 20, "sub_comment_count": null, "publish_time_ms": 1776790254000, "ip_location": "上海", "pictures": []}, {"comment_id": "69e79788000000001401bc05", "parent_id": "69e7738b000000001401e412", "user_id": "64a6d586000000002b009440", "nickname": "momo", "content": "学习prompt弄出很多project出来也很有成就感啊，很多知识我只是个入门，却能做出来不亚于科班出身的水平已经成功了。ai不就是修仙法修和体修的区别，能用法术为什么要练体呢。要知道练体受限于天赋根本不公平", "like_count": 20, "sub_comment_count": null, "publish_time_ms": 1776785288000, "ip_location": "辽宁", "pictures": []}, {"comment_id": "6a0140410000000029036c6d", "parent_id": "6a014024000000002803171d", "user_id": "68944c1e0000000028001164", "nickname": "问一问", "content": "我已将图片中的文字内容提取并整理如下：\n我的本科四年，差不多可以叫作人工智能元年。\n大一的时候，ChatGPT横空出世。它一出来就已经能干活了。对于一个学生来说，它会写作会做题会编程，就已经是一个有点生硬但效率很高而且随叫随到的帮手了。你们应该知道这样的LLM，哪怕是gpt1.0对电子信息专业意味着什么。\n那时候病毒正好到了最后一轮，学校封校，我们在寝室转线上上了两个月课，期末考试发线上试卷，大家开着镜头答题，镜头下面却像集体进入了另一个时代。几乎所有人都在用AI做题。来自德国的教授大概也知道，所以题目比期中难了很多。可结果很荒诞，题目变难了，平均分反而更高了。作弊变成了一种默契。我那门课拿了A。那是我从大一到大三唯一一门A。\n现在想起来，那简直像个预言。不是我学得多好，而是某种东西先替我抵达了答案。我站在原地，好成绩却更加唾手可得。那一刻我没有觉得羞耻，反而觉得震撼，像小时候第一次看见魔术，知道眼前有问题，但手已经开始鼓掌了。\n我不是那种从全国最好的高中的环境中一路杀出来的天才。我的高中放到全国去看，根本排不上号，环境普通资源普通教学方式滞后，可我一直保持着年级前几名，最后还是考进了top4的本科。应试教育我实打实吃过红利，我相当喜欢它在18岁之前为我带来的荣誉和骄傲感。我肯熬夜，肯背，肯做题，它就真的会给我一个更靠前的名次，在当时，更高的名次就意味着更大的自由。那时候我对“答案”这件事还有一种很古老的尊重，所以AI刚出现时对我的冲击才会那么大。\n它冲击的不是一个本来就不相信努力的人，而是我这种曾经被旧规则奖赏过的人。以前的我至少知道，分数是真的，自控力是真的，我做题的能力、谈恋爱的能力、对未来美好生活的想象、对“我以后应该还能更好”的信心，也都牢牢地黏在一起。可大一的线上考试像一道很细的裂缝，轻轻地出现。我第一次明白原来一个人可以还站在原地，比以前更懒更心不在焉，但答案已经会自己朝你走过来。一个靠应试教育上来的人，一个吃尽“努力—理解—得分”的天赋的人，彼时出现了一种近乎失重的震撼。\n大一的时候我还迷上过Stable Diffusion（文生图ai）。那会儿它刚开源，远没有现在这么强，图是糊的，手是六根手指的，人物身上总有一点说不出来的廉价塑料感。可我还是很兴奋。我拿它画自己想象中的美少女，调prompt，改参数，试风格，试构图，反反复复。图很粗糙，还会出现各种", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778466881000, "ip_location": null, "pictures": []}, {"comment_id": "69e85dd9000000001401e824", "parent_id": "69e755930000000014019810", "user_id": "5bc2c7cfc33eea0001f86173", "nickname": "清野", "content": ".", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776836058000, "ip_location": "云南", "pictures": []}]}, {"note_id": "69c14b1b000000001a02ad72", "xsec_token": "ABWZ3JkrzkDvxq_FF7nGP4ajUBpHVTGU1EAw7mkuqaJIo=", "url": "https://www.xiaohongshu.com/explore/69c14b1b000000001a02ad72?xsec_token=ABWZ3JkrzkDvxq_FF7nGP4ajUBpHVTGU1EAw7mkuqaJIo=&xsec_source=pc_search", "type": "normal", "title": "", "body": "有人用chatgpt写本科论文了吗，这玩儿真的能行吗#论文写作[话题]##chatgpt[话题]#", "author_id": "659cf3880000000022005d28", "author_nickname": "Arete", "publish_time_ms": 1774275355000, "ip_location": null, "liked_count": 1847, "collected_count": 1524, "comment_count": 241, "share_count": 105, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778557944932, "tags": ["论文写作", "chatgpt"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121152/1ae3a6a6b5001ac7c02d51570f7dc858/notes_pre_post/1040g3k831u2ekdfb72705pcsue48gn98fu2aq98!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "69c756aa0000000016014cdc", "parent_id": null, "user_id": "5d00f1890000000012016197", "nickname": "2.14", "content": "本科毕业论文那点水平让豆包给你写写算了，用gpt或者谷歌的gemini纯纯有点浪费资源了[捂嘴笑R]", "like_count": 144, "sub_comment_count": 12 hpoFaFTRozRL25w=", "url": "https://www.xiaohongshu.com/explore/69dc9a3c000000001a031bb9?xsec_token=ABc1Vwbm__hslNd6dnQbZMa_PRJyAHhpoFaFTRozRL25w=&xsec_source=pc_search", "type": "normal", "title": "发现到现在了还有很多人根本不会使用AI…", "body": "（以下全程无广求审核放过）\n我使用的ai仍然停留在基础国内水平，国外需要T的很麻烦懒惰整，但是对我来说完全够用，遂分享\n1看文献\n包更权威，真的有人在自己阅读英文文献吗？我直接打包发它，翻译➕提炼主要信息，其实文献摘要就是重点了，但为应对组会和老师提问以及自己实验操作流程，让它再把做了什么为什么怎么做也告诉你。好用\n\t\n2蒜苗找心理疏导\n放在第二位是因为真的救了我，D更权威，建立一个自己的信息数据库（⑧子我不喜欢告诉道上的人感觉会给我下酱油）这个有很好用的话术，如果有人需要我放评论区，然后每次让它来一瓜，特准特准特准（也可能是我心里作用）真的会安心很多，被我调教的很好了甚至可以和我对骂……然后我就会让它注意说话态度，比跟人类交流舒心❤️\n\t\n3实验思路\n研0们！狠狠用，我后面也会专门出贴告诉研0生存法则……总之拿到一个课题完全没思路直接给三大ai，问它该怎么做并且附带相关文献，这样它就不太敢编造糊弄你，当然糊弄也没事，你知道个大概方向了去一个一个搜相关文献，就会了\n\t\n4找工作\n这个真的很新的思路谁懂，你直接告诉包D你专业你想工作的方向，然后让它给你全网搜寻公告信息，谁用谁知道……只要发出来公开的招聘信息它大多数都能找到……再说就有广之嫌了（要不给我点吧→爱开玩笑\n\t\n5写论文\n真的在手搓吗？不会很辛苦的写成一坨大便吗？这个单独开帖子说了嗯没字数了\n\t\n6简历\n你就告诉任何一个ai你想应聘的岗位，以前都干啥了简历咋写，让它给你编…然后你自己润色润色往里填…很好用\n\t\n7做ppt\n比如一个内容，发它问怎么讲怎么做，让它在网上给你找资料。或者比较重要的ppt演讲，找他排练啊，让它修改并且给你提供宝贵意见（好用的，你有内容，ai有逻辑，结合起来。\n\t\n8写论文，改论文\n写好了把学校论文格式要求发它，然后把你论文发它，让他作为专业的zz大学xz教授给你进行严肃批改。好用，它甚至能发现我的括号中英文问题。\n\t\n9学做菜\n建议推荐给妈妈爸爸……我妈之前啥不懂老问我，她没耐心学我没耐心教，摁住她下载了几个ai，现在她已经熟练使用之……起码不会不懂去网上乱搜教程然后被骗去买什么课程…\n\t\n10生活养生护肤之类\n就很简单了，告诉肤质肤色需求\n\t\n11学习\n考研公编都可以利用…单独开贴说吧\n\t\n当然ai是双刃剑，也会被大数据喂粑粑给你拉个大的，所以才有了人类主观能动的重要性啊。你要去辨别，要让他给你出处，这样虽然看似小麻烦但比自己纯乱搜省事的太多，我很懒的ai能接住我的懒喜欢喜欢！", "author_id": "5f23f8aa000000000100359c", "author_nickname": "鸡蛋蘸酱油", "publish_time_ms": 1776065084000, "ip_location": "广东", "liked_count": 1475, "collected_count": 1136, "comment_count": 31, "share_count": 73, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558319109, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121158/e1c1d6d1865307811f676adcc0ba222c/notes_pre_post/1040g3k031ut415kdjq605np3v2l08dcs7g97ss8!nd_dft_wgth_webp_3", "width": 2560, "height": 2504}], "comments": [{"comment_id": "69dc9b5000000000150035e2", "parent_id": null, "user_id": "5f23f8aa000000000100359c", "nicknam  "5f23f8aa000000000100359c", "nickname": "鸡蛋蘸酱油", "content": "建（对不己就是一个打字手比脑子快）", "like_count": 3, "sub_comment_count": null, "publish_time_ms": 1776065383000, "ip_location": "广东", "pictures": []}, {"comment_id": "6a01ca94000000002a02eae3", "parent_id": "6a015f7a000000002900ec4a", "user_id": "5d5268b50000000010013503", "nickname": "心心", "content": "这是什么软件", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778502292000, "ip_location": "上海", "pictures": []}, {"comment_id": "69fb3534000000002902d334", "parent_id": "69faa3ea000000002a02f516", "user_id": "6816f269000000000d00bdfe", "nickname": "DE", "content": "好用", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778070837000, "ip_location": "广西", "pictures": []}, {"comment_id": "69f85c12000000002100ea35", "parent_id": "69f85c08000000002a00498f", "user_id": "68944c1e0000000028001164", "nickname": "问一问", "content": "你好，关于你提到的“ima”，在当前笔记的语境下，博主并没有提及这个缩写。不过，结合小红书用户的经验和全网知识， “ima”通常指的是腾讯推出的一款AI工作台产品 。它全称为“信息管理助手”（Information Management Assistant），主要帮助用户进行知识管理和办公协作。\n【什么是 ima】\nima (ima.copilot) 是一款集搜索、阅读、写作于一体的知识库导向型 AI 工作台。它整合了腾讯混元大模型与DeepSeek R1等能力，核心优势在于能直接搜索和引用微信公众号文章，打破信息壁垒。你可以把它理解成一个智能的个人知识中枢，能帮你：\n深度检索：直接搜索微信生态内的文章，这是它的一大特色。\n管理知识：上传本地文件（如PDF、Word），它能帮你智能总结、生成思维导图。\n辅助创作：基于你的知识库，一键生成PPT或辅助写作。\n【其他可能的含义】\n在不同的语境下，“ima”也可能有其他意思。例如，在一些网络聊天中，它可能是英文口语“I'm gonna”（I am going to，我打算）的缩写。但在讨论AI工具或办公软件时，指的就是上述腾讯的产品。", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777884179000, "ip_location": null, "pictures": []}]}, {"note_id": "699278a1000000002800a694", "xsec_token": "ABjRDX1NCBqvk1f0aUTCJoHpLKVuzAJeoX6_AH062wrxc=", "url": "https://www.xiaohongshu.com/explore/699278a1000000002800a694?xsec_token=ABjRDX1NCBqvk1f0aUTCJoHpLKVuzAJeoX6_AH062wrxc=&xsec_source=pc_search", "type": "normal", "title": "炸裂！AI 6小时写完53页顶刊经济学论文", "body": "2026年伊始，苏黎世大学David Yanagizawa-Drott教授直接用Anthropic Claude Code不到6小时，全自动生成一篇53页、结构完整、方法极度严谨的宏观经济学论文！\n关键是：全程AI自主完成，人类几乎没动手\n教授还把所有提示词、代码、迭代版本、论文源文件全部开源公开，真的震撼学界！\n\t\n这篇AI论文不是随便写写，而是完整顶刊标准：\n✅ 自主提出研究构思\n✅ 自动调用BLS、FHFA等权威公开数据\n✅ 独立做计量分析、理论建模\n✅ 自动完成LaTeX排版、编译\n✅ 自己迭代优化，从v1到v4不断完善\n教授甚至开启了高权限模式，让AI完全自主跑完整套研究流程。\n\t\n这篇《Demand Recessions Scar, Supply Recessions Don't》用2000—2024年美国州级面板数据（1.47万观测值）\n严谨得出结论：\n\t\n🔸 需求型衰退（如2008金融危机）\n会留下长期疤痕：暴露度每提高1个标准差，48个月后就业率仍降0.8%，半衰期长达60个月！\n\t\n🔸 供给型衰退（如新冠疫情）\n影响18个月内完全消失，无长期疤痕效应。\n进一步模型还发现：\n失业期间的技能折旧，能解释需求冲击造成福利损失的 51%！\n\t\n最恐怖的是，AI的实证方法超级规范：\n✅ 使用横截面局部投影法，避免TWFE估计偏误\n✅ 分别设计工具变量：需求用房价泡沫，供给用Bartik指标\n✅ 针对小样本做置换检验、聚类稳健标准误\n从v1框架到v4完整模型，AI几小时内自我完善\n校准DMP模型、补充反事实模拟、跑全流程检验\n\t\n最后，本篇推送也是AI生成的，AI确实提高效率，但是我仍然认为最好的idea是人的思想，希望26年我们在学习AI和经济学理论知识的同时，也要注重现实世界！最后希望各位能够熟练掌握AI，起码不落后于时代！\n#经济学[话题]# #AI学术[话题]# #论文[话题]# #读博[话题]# #经济学博士[话题]#", "author_id": "64345f8f0000000029017407", "author_nickname": "土豆的经管Workshop", "publish_time_ms": 1771206817000, "ip_location": null, "liked_count": 1037, "collected_count": 1136, "comment_count": 78, "share_count": 589, "image_count": 2, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558356402, "tags": ["经济学", "AI学术", "论文", "读博", "经济学博士"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121158/fc8797a8dddc4940907d6bb894401abd/1040g2sg31skn9f775sgg5p1kbu7qat075ejkmr0!nd_dft_wgth_webp_3", "width": 708, "height": 608}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121158/5cc8058f876a334b5fdacfca8130fb77/notes_pre_post/1040g3k831skn9fik5kd05p1kbu7qat071meglh8!nd_dft_wgth_webp_3", "width": 1180, "height": 656}], "comments": [{"comment_id": "6992bf2300000000080330ab", "parent_id": null, "user_id": "65b737d9000000000d01f600", "nickname": "南洋道小游击将军", "content": "众所周知，发不发顶刊完全取决于作者是谁，想要表达什么意思，和文章写得怎么样毫无关系", "like_count": 114, "sub_comment_count": 1, "publish_time_ms": 1771224867000, "ip_location": "新加坡", "pictures": []}, {"comment_id": "6992aaa2000000000c0167ba", "parent_id": null, "user_id": "5e3fdec90000000001000430", "nickname": "acamomo", "content": "几小时发表", "like_count": 35, "sub_comment_count": 2, "publi VjI=", "url": "https://www.xiaohongshu.com/explore/68b3e54e000000001b0353cc?xsec_token=AB2fgpFU0U76HKyuEa6efmSoDcxnS_QnHoUzvQ7DMwVjI=&xsec_source=pc_search", "type": "normal", "title": "关于我一个学期写四篇文献综述", "body": "因为本人参加模拟立法大赛和大创，所以写文献综述从头痛到手拿把掐嘿嘿嘿，以下分享一下个人经验。\n\t\n首先，是文献查找，我是在知网反复搜关键词，然后下载10～20篇论文。\n其次，在论文的pdf里将有用的信息复制粘贴到word里。注意，一篇一篇的复制粘贴，并且以篇为单位，将每篇论文的标题和作者也复制过来。（这是信息整合阶段，不用管内容分析，是要看到是自己想要的内容就复制粘贴，不要试图去消化内容，否则会特别慢）\n然后，把这个文档喂给豆包，告诉豆包你自己的需求。比如说，我让豆包根据我给出文档里面的文献，从现状和解决措施两方面，分类撰写，整合成一篇文献综述，撰写时以某学者在某文献中指出的形式。（此时形成的只是文献综述的主体部分，只有现状和解决措施两方面，先复制粘贴到word里）\n接着，把刚才形成的文献综述主体部分喂给豆包，让她根据发送的这个文献综述撰写摘要，背景，总结和建议。（这样整篇文献综述就形成啦）\n最后，根据形成的文献综述，复制文献综述中的论文标题到知网搜索，点右边的引号就可以直接复制粘贴参考文献的格式。这样，完整的文献综述就新鲜出炉啦！\n其实我都会把框架部分也就是摘要，背景，总结与建议部分自己修改一下，因为会有AI味。尤其是摘要和背景，改成自己觉得通顺合理的语句。然后总结建议部分要格外注意，因为豆包特别喜欢总结成a➕b➕c的逻辑链条模式，我都会把这些删掉嘿嘿嘿。\n以上就是我今天的分享，希望能够帮助到大家嗷～#文献综述[话题]# #很担心论文人的精神状态[话题]# #文献[话题]# #论文写作[话题]# #写论文[话题]# #文献查找[话题]# #论文开题攻略[话题]# #参考文献[话题]# #开题[话题]# #文献阅读[话题]#", "author_id": "67f627020000000006010c0b", "author_nickname": "炽焰", "publish_time_ms": 1756620110000, "ip_location": null, "liked_count": 34000, "collected_count": 39000, "comment_count": 356, "share_count": 3964, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558418392, "tags": ["文献综述", "很担心论文人的精神状态", "文献", "论文写作", "写论文", "文献查找", "论文开题攻略", "参考文献", "开题", "文献阅读"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121200/54f635cef74f4b3290e67793eb9b7a59/1040g2sg31lrbj6sd586g5pvm4s11i30bis76hhg!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "68bbdada000000002400f118", "parent_id": null, "user_id": "6670074a00000000070058c6", "nickname": "脆紫柿", "content": "宝宝，文档汇总那里还是没有看懂，是一篇文章一个文档喂给豆包，相当于形成了很多个文档喂了很多次豆包？还是多篇文章的重点摘要以篇为单位分开汇总到一个文档只喂一次豆包呀[哭惹R]", "like_count": 54, "sub_comment_count": 14, "publish_time_ms": 1757141722000, "ip_location": "浙江", "pictures": []}, {"comment_id": "693d7e8e000000003803fd28", "parent_id": null, "user_id": "5b6c6d285 标签功能进行初步分类（如：理论、方法、案例、争议点）\n第二阶段：深度阅读与结构化笔记\n1. 分层阅读，精准投入\n精读5-10篇：领域内最相关、质量最高、引用最多的文献。理解其研究问题、理论框架、方法、核心论证和结论\n泛读其余文献：重点看摘要、引言、结论，快速定位其与你研究的相关点\n2. 设计结构化笔记模板可手写，但建议后期电子化归档\n文献基本信息：作者、年份、标题、期刊\n研究问题与目的：用一句话概括\n核心概念/理论框架：定义、维度\n研究方法：数据来源、分析工具\n主要发现/观点：分点列出\n创新点与局限：作者自述及你的评价\n与你研究的关联：是理论基础？方法参考？对话对象？反驳靶子？\n你的启发与疑问：这是形成自己思路的关键\n第三阶段：分析、综合与逻辑建构", "author_id": "69ef11dd000000000d034c03", "author_nickname": "久久只写综述", "publish_time_ms": 1778058144000, "ip_location": "美国", "liked_count": 3, "collected_count": 6, "comment_count": 10, "share_count": null, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558458516, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121200/133569a4e5904cb19290fe73a172e17f/oss-sg/notes/1040g3l031vqqdp3rnc005qff27ejej038t3p3ig!nd_dft_wgth_webp_3", "width": 670, "height": 462}], "comments": [{"comment_id": "69fd40b8000000000d021401", "parent_id": null, "user_id": "69ef11dd000000000d034c03", "nickname": "久久只写综述", "content": "敲定协商后，满意再付，所有参考文献均来自知网，艾森威尔，pumb，SCI等权威期刊近五年文献。可以指定期刊和年份。所有参考文献真实可查，可以打包发给你。", "like_count": 1, "sub_comment_count": 2, "publish_time_ms": 1778204856000, "ip_location": "美国", "pictures": []}, {"comment_id": "6a011273000000002803bb6a", "parent_id": null, "user_id": "63ac18f5000000002702a53a", "nickname": "百里木申", "content": "宁好，请问今天能接吗", "like_count": 0, "sub_comment_count": 1, "publish_time_ms": 1778455156000, "ip_location": "甘肃", "pictures": []}, {"comment_id": "6a01fc76000000002902678c", "parent_id": null, "user_id": "592c405550c4b443e25a71f9", "nickname": "小小花", "content": "你好，今天能接吗", "like_count": 0, "sub_comment_count": 1, "publish_time_ms": 1778515062000, "ip_location": "江西", "pictures": []}, {"comment_id": "6a016d9600000000270225c9", "parent_id": null, "user_id": "62d5fbd0000000000e00d2aa", "nickname": "小葵小朋友", "content": "今天还接吗", "like_count": 0, "sub_comment_count": 1, "publish_time_ms": 1778478487000, "ip_location": "黑龙江", "pictures": []}, { 🔺如果我有无限资源，会设计什么实验来jie.决现有矛盾？\n当然写完文章后面对海量期刊不知道如何选刊，想要投稿前在对文章做最后的调整却无从下手，别担心啦，译墨sci审稿评估能帮你把这些问题解决，让期刊审稿人提前帮你把文章预审，增加中稿率\n#国际期刊[话题]# #文献综述[话题]# #文献阅读[话题]# #参考文献[话题]# #sci干货分享[话题]# #译墨sci选刊[话题]##译墨润色[话题]##译墨sci审稿评估[话题]##科研[话题]##硕博生[话题]#", "author_id": "68fca7f600000000370059bb", "author_nickname": "灿宸•年号", "publish_time_ms": 1776333299000, "ip_location": "湖北", "liked_count": 1266, "collected_count": 1517, "comment_count": 25, "share_count": 178, "image_count": 5, "video_url": null, "video_duration_ms": null, "crawled_at": 1778558624301, "tags": ["国际期刊", "文献综述", "文献阅读", "参考文献", "sci干货分享", "译墨sci选刊", "译墨润色", "译墨sci审稿评估", "科研", "硕博生"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/866c59ea4ecbeb59b264ced95cfcce72/1040g00831v13use93m0g5q7skvrdomdrhnfd348!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/db9f879eb83b2ab2bf46ed1fa2fb207b/1040g00831v13use93m005q7skvrdomdrco8l9io!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/76bef6e65e041c529c93332c5e21561a/1040g00831v13use93m1g5q7skvrdomdrdgecdpg!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/0959b65a070095eb86311a0f5c507db2/1040g00831v13use93m205q7skvrdomdrk0k0juo!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 4, "url": "https://sns-webpic-qc.xhscdn.com/202605121203/74d0ed5a892058e2a289736acddcee5c/1040g00831v13use93m105q7skvrdomdr47dmahg!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}], "comments": [{"comment_id": "69e0ee63000000001401dc3b", "parent_id": null, "user_id": "5d907f170000000001008923", "nickname": "one eyes", "content": "aa", "like_count": 2, "sub_comment_count": 0, "publish_time_ms": 1776348772000, "ip_location": "北京", "pictures": []}, {"comment_id": "69ef66380000000028032e51", "parent_id": null, "user_id": "5d3ac44400000000100102c3", 分解为几个子问题，并将每个子问题对应到文献综述的各个小标题中。\n3. 填充与评述内容：围绕每个小标题，梳理和评述相关文献，最后进行总结并引出研究空白，从而自然地提出自己的研究问题。", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1775909664000, "ip_location": null, "pictures": []}, {"comment_id": "69fc9e9600000000270154d3", "parent_id": "69fc4105000000002b026679", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "就是你研究的主要问题呀 是问这个吗", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778163350000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69f1fd7800000000270298b0", "parent_id": "69f10a88000000002803e133", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "具体是指什么呢 一般课程的论文都有具体的要求呀", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777466744000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69fc261d000000002701c359", "parent_id": "69fb461e000000002b00358c", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "好滴 其实大概思路是类似的！", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1778132509000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69e7363a000000001401940c", "parent_id": "69e7362f000000001401bc3b", "user_id": "68944c1e0000000028001164", "nickname": "问一问", "content": "好的，这篇笔记的核心内容已经为你整理好了：\n这篇笔记主要分享了写作文献综述的方法，强调要以研究问题为导向来构建框架。\n好的文献综述要素：需要具备 相关性、清晰的逻辑、批判性、重要性以及文献来源的多样性 。\n写作步骤：核心方法是 用研究问题来引导文献综述的结构 。先明确研究问题，再将每个子问题对应到文献综述的各个小标题中进行展开，最后进行总结并引出研究空白。", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776760378000, "ip_location": null, "pictures": []}, {"comment_id": "69f02222000000002702bbd7", "parent_id": "69ef9b180000000029025958", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "谢谢呀[害羞R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777345059000, "ip_location": "黑龙江", "pictures": []}, {"comment_id": "69eeda3b000000002702d834", "parent_id": "69eecc20000000002702deca", "user_id": "5fccae4600000000010000f8", "nickname": "冻梨的学术笔记", "content": "[派对 000000016021417", "parent_id": "68fb01c4000000003300de4e", "user_id": "6530dc7b000000002a01a2b0", "nickname": "sg", "content": "你好我想问下高水平综述在哪里找呢", "like_count": 4, "sub_comment_count": null, "publish_time_ms": 1764211283000, "ip_location": "河南", "pictures": []}, {"comment_id": "693f706e0000000039000e38", "parent_id": "68f78f31000000003901de19", "user_id": "6722eeab000000001c0181c2", "nickname": "我恨贺函🤬🤬🤬", "content": "现在咋样[笑哭R]我也是想这么干，已经没招了", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1765765230000, "ip_location": "云南", "pictures": []}, {"comment_id": "68f8a0e5000000003102e8e7", "parent_id": "68f898270000000033024464", "user_id": "647d5c91000000002b00a23f", "nickname": "小墨", "content": "好！", "like_count": 1, "sub_comment_count": null, "publish_time_ms": 1761124582000, "ip_location": "四川", "pictures": []}, {"comment_id": "69537aa6000000000503bed5", "parent_id": "68f6f6e30000000031000ff8", "user_id": "5ca86036000000001103f208", "nickname": "小羊", "content": "[点赞R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1767078566000, "ip_location": "四川", "pictures": []}, {"comment_id": "69e98fe8000000001401cc03", "parent_id": "68f59d1c00000000310330ab", "user_id": "64ab803e000000001f00545a", "nickname": "我有八个肝", "content": "你是明白人[偷笑R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776914408000, "ip_location": "黑龙江", "pictures": []}]}, {"note_id": "6981e707000000001a0211c8", "xsec_token": "ABb7dPGV8sP2OnrX_bFFgC0ine5xVNzW1yzt88aQekM1g=", "url": "https://www.xiaohongshu.com/explore/6981e707000000001a0211c8?xsec_token=ABb7dPGV8sP2OnrX_bFFgC0ine5xVNzW1yzt88aQekM1g=&xsec_source=pc_search", "type": "normal", "title": "导师喜欢的文献综述长这样🥳🥳🥳", "body": "文献综述包括\"综\"和\"述\"两方面.. ... ..\n.\n“综”是以搜集大量相关文献素材为基础的，主要是对国内外相关同类课题研究相关文献进行一个归纳整理,提炼观点，综合分析的过程.. ..\n.\n“述”就是对各家学说提出自己的见解和观点..\n(1)前人在研究什么、研究到什么程度?\n(2)找出你想研究而别人还没有涉及到的问题。\n(3)其他人已经做过，但你认为有缺陷，你可以提出更完善的措施。\n(4)别人已经做过，你重新做实验来验证。\n国内外研究现状写作技巧:\n.\n高级的写法:每一条文献都体现\"谁+研究了什么+怎样研究+研究出什么观点+得失评价\"的写作逻辑\n.\n简单的写法:先写国内研究现状，再写国外研究现状，最后针对国内外研究现状做述评。\n.\n其中，国内国外文献各写2-3。\n.\n每一条内部可以按理论流派/时间发展/主题等维度展开..\n#写论文[话题]# #论文初稿[话题]# #赶论文初稿[话题]# #毕业论文[话题]# #文献综述怎么写[话题]# #文献综述[话题]# #如何撰写文献综述[话题]# #文献综述怎么定框架[话题]# #文献综述模版[话题]# #文献[话题]#", "author_id": "6947678f0000000037006a48", "author_nickname": "欣雨小橘子", "publish_time_ms": 1770120967000, "ip_location": null, "liked_count": 16, "collected_count": 21, "comment_count": 3, "share_count": 4, "image_count": 16, "video_url": null, "video_duration_ms": null, "crawled_at": 1778559324600, "tags": ["写论文", "论文初稿", "赶论文初稿", "毕业论文", "文献综述怎么写", "文献综述", "如何撰写文献综述", "文献综述怎么定框架", "文献综述模版", "文献"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/e2b83751b7d598f9c44a580ceea851f7/1040g00831s4h64e1ls5g5qa7cu7toqi8rq4ottg!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/fd6ced2a95d1c53f1806990e4c396027/1040g00831s4h64e1ls4g5qa7cu7toqi8v8tpgfo!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/6761d3eda75fa0c00dbc1611917fa6b6/1040g00831s4hleqv5mdg5qa7cu7toqi8ar6aoog!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/9343a175a73ae0e3cdb500a53f575b66/1040g00831s4hleqv5mk05qa7cu7toqi874dr07o!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 4, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/6ce89c4971501401db800a34ffc63b82/1040g00831s4hleqv5mkg5qa7cu7toqi89dunfk0!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 5, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/5f2168894e470c2c521b6364b865f40e/1040g00831s4h64e1ls0g5qa7cu7toqi8rngumbo!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 6, "url": "https://sns-webpic-qc.xhscdn.com/202605121215/475832c73ac1f8640dc51b30139e5e64/1040g00831s4h64e1ls1g5qa7cu7toqi8nbb20p8!nd_dft_wlteh_webp_3", "width": 1080, "height": 144 nt": 0, "sub_comment_count": 0, "publish_time_ms": 1770121255000, "ip_location": "广东", "pictures": []}, {"comment_id": "69e05a26000000000202b660", "parent_id": null, "user_id": "69df77cd000000003401bddf", "nickname": "不谏", "content": "1", "like_count": 0, "sub_comment_count": 1, "publish_time_ms": 1776310823000, "ip_location": "四川", "pictures": []}, {"comment_id": "69e05a550000000035008d04", "parent_id": "69e05a26000000000202b660", "user_id": "6947678f0000000037006a48", "nickname": "欣雨小橘子", "content": "dd[派对R]", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1776310869000, "ip_location": "广东", "pictures": []}]}, {"note_id": "69c65dca000000001f0036c6", "xsec_token": "ABsMApFo0UBdg9sXUvAx5r0n3fDGw8T21V5vneE5U5dIY=", "url": "https://www.xiaohongshu.com/explore/69c65dca000000001f0036c6?xsec_token=ABsMApFo0UBdg9sXUvAx5r0n3fDGw8T21V5vneE5U5dIY=&xsec_source=pc_search", "type": "normal", "title": "用Claude写综述，别一上来就让它写", "body": "用Claude写文献综述，我之前也是直接让它写，出来一看——\"近年来\"\"逐渐成为\"\"值得注意的是\"，段落结构左右对称。翻了不少审稿人的反馈，这些基本是公认的AI痕迹特征。\n\t\n后来换了个思路，分三步走，出来的东西像人写的了。拿两篇最近比较火的自动科研系统论文试了一下，同一个主题对比过。\n\t\n❌ 错误示范：直接让Claude写，出来就是标准AI八股\n\t\n✅ 第一步：只让Claude提信息，不让它写文章\n\t\n把论文喂给它，让它列表格——每篇论文的核心观点、方法、局限性，不要组织成文章。这一步是让Claude当研究助理，省得你自己一篇篇翻着整理。\n\t\n✅ 第二步：你自己定逻辑主线\n\t\n这步最关键，也是AI替代不了的。看完Claude整理的信息，你自己想清楚这几篇论文之间的关系是什么、你的观点是什么。哪怕只写两三句话就行。我当时写的是\"这两类系统的本质区别不在功能多少，而在于人在系统里的位置不同\"，就这一句话，后面整段的逻辑都从这里长出来。\n\t\n✅ 第三步：让Claude基于你的逻辑润色，同时给它禁忌清单\n\t\n把你的观点和第一步的表格一起给Claude，让它组织成学术语言。同时明确告诉它哪些表达不要用——\"值得注意的是\"\"综上所述\"\"至关重要\"，不要每段总分总，不要对称句式。这些是我翻审稿反馈总结的高频AI特征词，不一定完整，但避开这几个差别已经比较明显了。\n\t\n🔍 效果对比：\n\t\n同一个论点，直接写出来是\"两种系统的根本差异在于对自动化边界的不同定义\"，分步走出来是\"区别不在谁的功能多，一个让人掌控判断，一个让人退到起点\"。前者是AI在替你想，后者是你在想、AI帮你说。\n\t\n我只测了两篇CS方向的论文，其他学科不确定效果完全一样，有试过的可以评论区反馈。思路应该是通的：让AI处理信息和语言，观点和判断留给自己。\n\t\n💡 最后说一句，AI辅助写综述和AI替你写综述是两回事。综述的价值在于你对文献的理解和判断，这个不管用什么工具都省不了。\n\t\n#claude[话题]# #文献综述[话题]# #论文写作[话题]# #研究生[话题]# #科研[话题]# #AI工具[话题]#", "author_id": "5d1dba2b000000001001b024", "author_nickname": "就叫老黄吧", "publish_time_ms": 1774607 c1vcdGoX1ri2gZ7TVm2ts9FGYCW-YtC14=", "url": "https://www.xiaohongshu.com/explore/6852d5a9000000002203d510?xsec_token=ABvIxBytsNOLc1vcdGoX1ri2gZ7TVm2ts9FGYCW-YtC14=&xsec_source=pc_search", "type": "normal", "title": "期未周课程结课论文～～～", "body": "期末周了，结课论文怎么写？\n1. 确定论文主题\n•\t结合课程内容，选择一个具体的方向或问题进行深入研究。\n•\t确保主题明确且可操作，能够在论文中充分展开讨论。\n2. 查阅资料\n•\t查找与课程相关的书籍、论文、学术期刊、网络资源等，进行充分的文献回顾。\n•\t收集足够的资料为自己的论文提供理论支持。\n3. 拟定论文提纲\n•\t提纲应该包含引言、正文和结论三大部分，每一部分下面可以细分出具体小节。\n•\t在正文中，逻辑要清晰，内容要连贯，注意层次分明。\n4. 撰写引言部分\n•\t引言中要简要介绍论文的背景、研究问题的来源、研究目的、意义和方法。\n•\t让读者对论文的研究对象和方向有一个初步了解。\n5. 撰写正文部分\n•\t**理论框架：**简要介绍相关理论或前人的研究成果，阐明你的研究基础。\n•\t**研究方法与数据分析：**描述你采用的研究方法、数据来源、分析方法等，确保论文的论证有依据。\n•\t**分析与讨论：**根据研究结果进行详细的分析，回答论文中提出的问题，讨论结果的意义。\n6. 撰写结论部分\n•\t总结研究的主要发现，回顾论文目标的实现情况。\n•\t提出研究的局限性及未来可能的研究方向。\n•\t结论部分要简洁明了，避免赘述。\n7. 引用与参考文献\n•\t在论文中引用相关文献时，按要求进行引用，遵循相应的引用格式（如APA、MLA等）。\n•\t列出所有参考过的文献，确保资料来源的规范性和权威性。\n8. 修改与完善\n•\t写完论文后，进行多次修改，检查逻辑是否清晰、语言是否简练。\n•\t注意格式的统一，确保论文排版规范。\n9. 完成封面和目录\n•\t按照学校或教师要求的格式填写论文封面，确保包含必要信息。\n•\t论文目录要清晰列出各章节及页码，方便读者查阅。\n#期末周破防 #期末课程论文 #课程论文写作 #文章写作#论文 #结课论文#水课论文害人不浅", "author_id": "6736dda2000000001d02d4b9", "author_nickname": "小红薯684C9B63", "publish_time_ms": 1750259113000, "ip_location": null, "liked_count": 6, "collected_count": 3, "comment_count": 33, "share_count": 1, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778559396255, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121216/f61565e5e78e90924d03e3fc37f291ea/notes_pre_post/1040g3k031isipik61g4g5ppmrmh7dl5piparb8o!nd_dft_wlteh_webp_3", "width": 1055, "height": 1421}], "comments": [{"comment_id": "69f98222000000002900d290", "parent_id": null, "user_id": "64e4cc840000000001013e03", "nickname": "爱偷吃的灌汤包", "content": "谁接", "like_count": 2, "sub_comment_count": 0, "publish_time_ms": 1777959459000, "ip_location": "重庆", "pictures": []}, {"comment_id": "69e358bb000000001401d42c", "parent_id": null, "user_id": "63ad331d0000000027028a46", "nickname": "Hzz rl": "https://sns-webpic-qc.xhscdn.com/202605121257/16fe01d70de02781d502cc88a3265eca/notes_pre_post/1040g3k831i966imn6m9g4a6rv3k5833vbinf540!nd_dft_wlteh_webp_3", "width": 1260, "height": 2596}], "comments": []}, {"note_id": "69fed61e0000000037035a50", "xsec_token": "ABAIkiyESyDO9V8shjc4dkzbr7rI1dW4tQfl7Tu_uhWpU=", "url": "https://www.xiaohongshu.com/explore/69fed61e0000000037035a50?xsec_token=ABAIkiyESyDO9V8shjc4dkzbr7rI1dW4tQfl7Tu_uhWpU=&xsec_source=pc_search", "type": "normal", "title": "老外跑完中国AI实验室，回来沉默了", "body": "最近海外AI圈有篇文章挺火。\n一个长期观察 OpenAI、Anthropic 的作者，专门跑来中国看了一圈AI公司，回来写了篇《中国AI实验室观察》。\n\t\n里面有个判断，我觉得挺值得细品：\n\t\n中国AI，正在形成一套和硅谷完全不同的路径。\n\t\n过去大家默认的逻辑是：\n\t\n美国负责原创模型，\n中国负责应用落地。\n\t\n但现在越来越像：\n\t\n美国在卷“AGI”，\n中国在卷“AI工业化”。\n\t\n这其实是两个方向。\n\t\n文章里提到一个很有意思的现象：\n\t\n很多中国AI团队内部，并没有特别强的“明星科学家文化”。\n大家讨论最多的，不是AI哲学，也不是改变世界。\n\t\n而是：\n\t\n怎么把模型效果再提一点、推理成本再降一点、Agent链路再跑顺一点。\n\t\n这种气质其实特别像过去十年中国互联网的发展路径。\n\t\n当年字节卷推荐算法、美团卷履约、拼多多卷供应链，本质上都不是“0到1”的发明，而是“1到100”的系统工程能力。\n\t\n现在大模型也开始进入这个阶段了。\n\t\n所以你会发现，国内很多公司已经不再只盯着模型参数，而是在卷：\n\t\n* Agent\n* Workflow\n* 推理成本\n* 企业交付\n* 多模型协同\n* AI基础设施\n* 真实业务闭环\n\t\n包括现在阿里、字节、百度这些大厂，越来越像“AI工业集团”。\n\t\n模型只是其中一层。\n\t\n更重要的是后面的云、数据、流量、场景、组织和商业体系。\n\t\n文章里还有个判断很真实：\n\t\n现在海外很多人已经开始重新评估字节。\n\t\n因为大家慢慢发现，真正有威胁的，未必是论文最强的公司，而是：\n\t\n同时拥有流量、场景、算力、组织能力和现金流的公司。\n\t\n这也是为什么国内很多大厂，哪怕已经有成熟业务了，还是在坚持自研模型。\n\t\n因为大家都意识到：\n\t\n大模型未来会像云、数据库、操作系统一样，成为基础设施。\n\t\n谁没有底座，未来就可能失去主动权。\n\t\n所以现在看中国AI，表面上是“百模大战”，\n但底层其实是在争：\n\t\n下一代互联网基础设施的入口。\n\t\n某种程度上，这篇文章真正有意思的地方，不是它夸了中国AI。\n\t\n而是很多海外人第一次开始意识到：\n\t\n中国AI可能不是在复制硅谷，\n而是在走一条“工业化AI”的路线。#大厂[话题]# #人工智能[话题]# #科技改变世界[话题]# #未来实验室[话题]# #学术[话题]# #大模型[话题]# #逆向文化冲击[话题]#", "author_id": "5c6ab89c0000000011020301", "author_nickname": "大厂代表", "publish_time_ms": 1778308638000, "ip_location": "河南", "liked_count": 615, "collected_count": 223, "comment_count": 31, "share_count": 26, "image_count": 7, "video_url": null, "video_duration_ms": null, "crawled_at": 1778561903711, "tags": ["大厂", "人工智能", "科技改变世界", "未来实验室", "学术", "大模型", "逆向文化冲击"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121258/d1a9b43e82464953990f39a5e51d0513/notes_pre_post/1040g3k831vuhqmujjqdg5n3an2e4c0o1dggi02g!nd_dft_wlteh_webp_3", "width": 2160, "height": 2880}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121258/4951f074fddd4cf468f8cc8d1d859be5/notes_pre_post/1040g3k831vuhqmujjqag5n3an2e4c0o114j6dhg!nd_dft_wlteh_webp_3", "width": 2160, "height": 2880}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121258/fbc94d83fc3ca6cbae2b908bb46b2608/notes_pre_post/1040g3k831vuhqmujjq9g5n3an2e4c0o16okp5b8!nd_dft_wlteh_webp_3", "width": 2160, "height": 2880}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121258/6175e5a3f14a9342fecf23ae70bc2e4f/notes_pre_post/1040g3k831vuhqmujjqb05n3an2e4c0o1gtivfi8!nd_dft_wlteh_webp_3", "width": 2160, "height": 2880}, {"idx": 4, "url": "https://sns-webpic-qc.xhscdn.com/202605121258/c0fb7cfc338a33451e041fd7635aa9b2/notes_pre_post/1040g3k831vuhqmujjq905n3an2e4c0o14k9j630!nd_dft_wlteh_webp_3", "width": 2160, "height": 2880}, {"idx": 5, "url": "https://sns-webpic-qc.xhscdn.com/202605121258/1f1476bcc5179457c2c747eeeb5c2eb2/notes_pre_post/1040g3k831vuhqmujjqbg5n3an2e4c0o1n9cnk20!nd_dft_wlteh_webp_3", "width": 2160, "height": 2880}, {"idx": 6, "url": "https://sns-webpic-qc.xhscdn.com/202605121258/c98bd2f84f2646bd2e5767f57226b185/notes_pre_post/1040g3k831vuhqmujjqc05n3an2e4c0o18pmd2io!nd_dft_wlteh_webp_3", "width": 2160, "height": 2880}], "comments": [{"comment_id": "69ffd0b0000000002b02b8ae", "parent_id": null, "user_id": "5d5ac81a0000000001007dda", "nickname": "你好啊", "content": "我把话放这，ai几年后一定会成为社会通用服务，功能完善的同时卷的一定是性价比。", "like_count": 110, "sub_comment_count": 3, "publish_time_ms": 1778372784000, "ip_location": "广东", "pictures": []}, {"comment_id": "69ff0798000000002b003dcc", "parent_id": null, "user_id": "67876cb7000000000803f2e4", "nickname": "暗夜白鸦", "content": "抢入口，抢用户是对的[笑哭R]", "like_count": 77, "sub_comment_count": 2, "publish_time_ms t": 4, "sub_comment_count": 1, "publish_time_ms": 1775021606000, "ip_location": "四川", "pictures": []}, {"comment_id": "69e122820000000014018800", "parent_id": null, "user_id": "680b4b48000000000e02ec38", "nickname": "lucky莓烦恼", "content": "我读研的小论就是让这种带着我弄的，但是是那种指dao[捂脸R][捂脸R]", "like_count": 1, "sub_comment_count": 0, "publish_time_ms": 1776362114000, "ip_location": "浙江", "pictures": []}, {"comment_id": "69fca221000000002300d792", "parent_id": null, "user_id": "611a3b2b000000000100843d", "nickname": "愚蠢的兔子", "content": " @八万春 ", "like_count": 0, "sub_comment_count": 0, "publish_time_ms": 1778164257000, "ip_location": "上海", "pictures": []}, {"comment_id": "69eda7fa0000000029034b01", "parent_id": "69ccae25000000000d034902", "user_id": "5b0d3673e8ac2b5392e3cd5b", "nickname": "巴拉巴拉魔法师", "content": "怎么忽然聊起这个呢", "like_count": 0, "sub_comment_count": null, "publish_time_ms": 1777182715000, "ip_location": "中国香港", "pictures": []}]}, {"note_id": "69144989000000000d037a98", "xsec_token": "AB5W9GpXDsRoRy7KGhKiyDiIXoCG45zJnU9m_0HZlgSkQ=", "url": "https://www.xiaohongshu.com/explore/69144989000000000d037a98?xsec_token=AB5W9GpXDsRoRy7KGhKiyDiIXoCG45zJnU9m_0HZlgSkQ=&xsec_source=pc_search", "type": "normal", "title": "罗福莉C位亮相小米，离职DeepSeek后首官宣", "body": "就在今天，罗福莉以C位之姿首次对外官宣：\n\t\n正式加入小米，出任MiMo团队负责人[派对R]\n\t\n其实早在去年年底，就有传言称曾效力DeepSeek的罗福莉，被雷军「千万年薪」带到了小米。\n\t\n而上个月，小米AI团队最新论文的作者一栏里，罗福莉的名字也赫然在列，只不过是以「独立研究者」的身份。\n\t\n而现在，连点成线，消息被明确了。\n\t\n罗福莉之所以受到如此关注，一方面跟小米和雷军的关注度有关，另一方面也跟她之前圈内名气密不可分[暗中观察R]\n——\n罗福莉本科毕业于北京师范大学计算机专业，硕士阶段进入北京大学计算语言学深造。\n\t\n期间，她在不少NLP顶级会议上都发表过论文。\n\t\n硕士毕业后，罗福莉加入阿里巴巴达摩院，担任机器智能实验室研究员，负责开发多语言预训练模型VECO，并推动AliceMind项目的开源工作。\n\t\n2022年，罗福莉加入DeepSeek母公司幻方量化从事深度学习相关工作，后又担任DeepSeek的深度学习研究员，参与研发DeepSeek-V2等模型。\n\t\n截至目前，罗福莉的学术论文总引用次数已超过1.1万次，仅在今年一年内就新增了约八千次引用。\n\t\n在DeepSeek最新的Nature封面论文中，罗福莉之名也赫然在列，明确了她对DeepSeek模型的工作贡献，但当时对她的介绍，依然停留在北京独立研究员。\n\t\n至于为啥是“独立研究员”，不得而知，毕竟她被小米挖走，基本在圈内已经是近乎公开的事实。\n\t\n[向右R] 有一种说法是规避竞业。\n\t\n在罗福莉自我官宣之前，确实也没有明确以小米雇员的身份展开大模型研发。\n\t\n当然，作为独立研究员，罗福莉在小米最新的MiMo论文中起到了连接小米和北大团队的作用，通讯作者正是罗福莉的北大恩师。\n\t\n而小米MiMo，也正是小米推进大模型研发的核心招牌，只是更早之前，大家也不太知道更多目标和方向。\n\t\n现在，随着罗福莉的官宣，小米MiMo也被一并明确，剑指最前沿空间智能。\n\t\n就在昨天，AI教母李飞飞发表了一篇万字长文，首次系统性地阐释了「空间智能」的概念，以及其对具身智能和AGI的重要意义。\n\t\n说白了，空间智能就是打通信息AI和物理AI的终极理念，实现比特世界和原子世界的智能贯通。\n\t\n这自然是最具号召力的技术愿景，也跟小米拥有的场景天然适配，因为信息AI和物理AI、网络世界到现实世界，如果按照另一个更以人为中心的维度，那就是雷军大大方方明确的——\n\t\n人、车、家全生态。\n\t\n#ai[话题]# #罗福莉[话题]# #小米[话题]# #人工智能[话题]# #deepseek[话题]# #空间智能[话题]#", "author_id": "6228870a0000000010008e88", "author_nickname": "量子位", "publish_time_ms": 1762937225000, "ip_location": null, "liked_count": 183, "collected_count": 41, "comment_count": 33, "share_count": 103, "image_count": 2, "video_url": null, "video_duration_ms": null, "crawled_at": 1778562638622, "tags": ["ai", "罗福莉", "小米", "人工智能", "deepseek", "空间智能"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121310/3ce62c521bf8513a9f78408465d5c9d1/spectrum/1040g34o31opfth27ks0g5oh8gs5413k84skm4u0!nd_dft_wgth_webp_3", "width": 1176, "height": 982}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121310/2a9942b30cca476793a3cb6a5e08f442/spectrum/1040g34o31opg2nmlks7g5oh8gs5413k8i59n7b8!nd_dft_wgth_webp_3", "width": 1254, "height": 406}], "comments": [{"comment_id": "691545d300000000370276b2", "parent_id": null, "user_id": "62ba62a5000000001b025e94", "nickname": "Rance", "content": "小米的AI算是完了[笑哭R]", "like_count": 12, "sub_comment_count": 12, "publish_time_ms": 1763001811000, "ip_location": "上海", "pictures": []}, {"comment_id": "6915224e0000000038008fa1", "parent_id": null, "user_id": "58fac5f56a6a69612930a093", "nickname": "MOMOMO", "content": "不看好", "like_count": 5, "sub_comment_count": 0, "publish_time_ms": 1762992719000, "ip_location": "浙江", "pictures": []}, {"comment_id": "69243bbe000000001602573c", "parent_id": null, "user_id": "630e00d40000000012001643", "nickname": "小大佬", "content": "大忽悠招了个小忽悠", "like_count": 3, "sub_comment_count": 0, "publish_time_ms": 1763982271000, "ip_location": "辽宁", "pictures": []}, {"com 真的给我充了\n可能是有什么事耽搁了吧\n但后来数量越来越多\n远远超出了我给予大叔的[皱眉R]\n我还在想这大叔真仁义\n我在家里大说特说 发表演讲\n说自己识人特别准\n家里人在旁边一直笑\n\t\n过了很久很久吧\n我跟一个网友吵架\n他攻击我是单细胞的草履虫\n当时我还没学过草履虫\n不懂什么意思\n他气呼呼的说：就是没脑子\n你那个时候给钱明明是被骗了\n我还给你充了q币怕你不开心\n你转头就空间发说说感谢骗子 气死我了\n我好像顿悟了\n果不其然 有些钱是家里给的\n连我姨姥都颤颤巍巍的去网吧充q币\n怕伤了我这个好孩子的心\n但是我收到的钱 比这些更多\n\t\n后来在空间认领\n发现盐城的网友 觉得这个盐城人不仁义\n怎么骗小孩子 于是掏钱了\n虽然这个骗子可能都不是盐城人\n也有一个哈尔滨大姐姐给我转了\n她进社会比较早\n想保护我的这份单纯\n\t\n还有当时认识的一群码农小哥哥\n也给我转了\n导致我觉得敲代码的都是好人\n大学专业也学了这个\n还有抄我作业的想报答我\n三个人拼了10q币给我充上\n我想 我应该还是幸运的\n虽然有一个人骗我\n但是有一群人爱我😊", "author_id": "6360db42000000001f01badd", "author_nickname": "小Q", "publish_time_ms": 1772337380000, "ip_location": null, "liked_count": 15000, "collected_count": 577, "comment_count": 367, "share_count": 721, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778563035844, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121316/6c003020ccd50c665cf7e2ba9eee4343/notes_pre_post/1040g3k031t5habtq5m3g5or0rd17remtbj498h8!nd_dft_wlteh_webp_3", "width": 1157, "height": 1157}], "comments": [{"comment_id": "69a3fad600000000090217f8", "parent_id": null, "user_id": "63fb223e000000001002ae54", "nickname": "A.啃香键", "content": "我以为那个大叔心里过意不去，给了你一张50的。读了第2遍，发现他怎么又拿了50[生气R]", "like_count": 5616, "sub_comment_count": 11, "publish_time_ms": 1772354262000, "ip_location": "山东", "pictures": []}, {"comment_id": "69a3ccd4000000001403042b", "parent_id": null, "user_id": "65a4c21800000000030250c5", "nickname": "力大无穷战士", "content": "真好，好多人在维护一个孩子的天真和期待。", "like_count": 4317, "sub_comment_count": 17, "publish_time_ms": 1772342485000, "ip_location": "广西", "pictures": []}, {"comment_id": "69a3b9100000000008032dce", "parent_id": null, "user_id": "6360db42000000001f01badd", "nickname": "小Q", "content": "我感觉我现在还是单细胞的草履虫[完啦R]前年跟朋友医院前大街看见了摔倒的老人 几个人在拍照没人扶 那个老人蛄蛹了几下没起来 山东冬天可冷 我怕躺地上失温了 扶着到医院了 出来后朋友说我：你真虎啊 这你也敢扶 我：我工资高 我先扶 讹我 我也不至于伤筋动骨 要我姥以后躺地上 希望也有人扶她 要不然我得心疼死 后来我朋友一直叫我：傻大姐", "like_count": 3545, "sub_comment_count": 31, "publish_time_m ull, "publish_time_ms": 1772383589000, "ip_location": "山东", "pictures": []}]}, {"note_id": "6808e57a000000001c02f157", "xsec_token": "ABqJz0D2GaTwrPnEyh4gtVWxd33y4n7SYT8rSFgHEVkhk=", "url": "https://www.xiaohongshu.com/explore/6808e57a000000001c02f157?xsec_token=ABqJz0D2GaTwrPnEyh4gtVWxd33y4n7SYT8rSFgHEVkhk=&xsec_source=pc_search", "type": "normal", "title": "", "body": "现在很多挂人帖和一些所谓的“圈内大佬”，其实都是在有意模糊“借鉴”与“抄袭”之间的界限。\n\t\n要知道，抄袭是一个需要被法律定义的，得开庭打官司，如果判成是要赔钱的违法行为，可不是某某“圈内大佬”一发话，就能网络开庭落实的帽子。\n\t\n而有些所谓大佬的逻辑是这样的，你主观上有学习我的意图，又有一些地方比较相似，好，你抄袭我了，实锤，而很多不懂法的新人呢，一看大佬都这么说了也就信了，甚至被指抄袭的画师还会自我pua开始自责，觉得学习别人是犯罪。\n\t\n但其实呢？你就算主观上学了别人，客观上也有一些地方比较像，那一般也顶多算借鉴，是合法的，根本不能算抄袭，美术史上互相借鉴的事多了去了，很多大师在成长道路上都借鉴过前人，根本就不算什么。\n\t\n而真正的抄袭判定呢？首先要看相似的地方是否有独创性，比如有的构图姿势和创意，一百个人都画过，那你俩就算很相似，只要不是叠图描的，就不予采纳，而像这样有独创性的相似点，一般一个也不够判抄袭，都是多个有独创性的相似点一致，才能叫抄袭。\n\t\n所以一个画师，哪怕这张图学这个，那张图学那个，只要都是学点皮毛，那也只能说这个画师喜欢借鉴别人，和抄袭不挨着，你可以不喜欢，但不能随便审判扣帽子。\n\t\n而很多所谓的大佬呢，画的是好，但人品和法律意识美术课又不教，所以别老觉得大佬在绘画以外的事情上有权威性，国内的一票所谓大佬，当年还一起支持过辱华画作罂粟旗袍呢，打着创作自由的旗号揭民族伤痛，所以别对画画好的人有什么滤镜，刨去画功，精神状态很多还不如普通人。", "author_id": "6185ee10000000001000a106", "author_nickname": "画画的花噎菜", "publish_time_ms": 1745413498000, "ip_location": null, "liked_count": 2765, "collected_count": 462, "comment_count": 166, "share_count": 161, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778563064124, "tags": [], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121317/0a80ed27bdf75b92bf2dd55342f15d97/notes_pre_post/1040g3k031gkbgkiej80g5oc5to841886abhem5g!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "6808f8d3000000001f005712", "parent_id": null, "user_id": "65c9d99a0000000009016625", "nickname": "祝你今天愉快", "content": "那老师如果有两个完全不相干的人，他们的作品10成有8成很相似，他们各自对方也没有看过对方的作品，然后被人扒出来这算抄袭吗？这个是我在之前的一个网文作者评论底下翻到的一条，之前写了一半的网文并没有发出来，之后看了一个网文作者的和自己的好像，吓得直接把自己的删掉了，", "like_count": 21, "sub_comment_count": 7, "publish_time_ms": 1745418451000, "ip_location": "江苏", "pictures": []}, {"comment_id": 要的介绍，让读者明白该研究课题的重要性和目的。\n💬 研究问题明确：开题报告应该明确提出研究问题，并阐述该问题对相关领域或现实生活的影响。\n💬 研究方法科学合理：报告应该详细描述所采用的研究方法，包括数据采集和分析的方法、实验设计等。\n💬 研究计划可行且具体：开题报告应该有一个详细的研究计划，包括时间表、预期结果和可能遇到的问题及解决方案。\n💬 参考文献丰富且权威：报告的参考文献部分应该列出所有相关的学术文献，确保所引用的文献都是权威的、最新的研究成果。\n💬 图表和附录完整：如果报告中涉及到图表或附录，这些内容应该清晰、完整，并且与正文内容紧密相关。\n﻿#硕士论文[话题]#﻿  ﻿#硕士毕业论文[话题]#﻿  ﻿#硕士[话题]#﻿  ﻿#开题报告[话题]#﻿  ﻿#硕士开题报告[话题]#﻿  ﻿#开题报告模板[话题]#﻿  ﻿#开题报告怎么写[话题]#﻿  ﻿#论文[话题]#﻿  ﻿#论文写作[话题]#﻿  ﻿#研究生论文[话题]#", "author_id": "6913fd070000000037006ca8", "author_nickname": "小红薯69167796", "publish_time_ms": 1763015078000, "ip_location": null, "liked_count": 24000, "collected_count": 24000, "comment_count": 395, "share_count": 2157, "image_count": 7, "video_url": null, "video_duration_ms": null, "crawled_at": 1778563338892, "tags": ["硕士论文", "硕士毕业论文", "硕士", "开题报告", "硕士开题报告", "开题报告模板", "开题报告怎么写", "论文", "论文写作", "研究生论文"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121322/d2cc50208198c658f72070560d513984/1040g00831oqla9fh1q005q8jvk3tor58r8sha38!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/202605121322/4f7cb0b46f3c29c2468b5e9469893d3f/1040g00831oqla9fh1q0g5q8jvk3tor58duqo710!nd_dft_wlteh_webp_3", "width": 1080, "height": 1440}, {"idx": 2, "url": "https://sns-webpic-qc.xhscdn.com/202605121322/515f6091dcfda755a29139da406b1791/1040g00831oqla9fh1q105q8jvk3tor58345m9m8!nd_dft_wlteh_webp_3", "width": 1080, "height": 1441}, {"idx": 3, "url": "https://sns-webpic-qc.xhscdn.com/202605121322/6d4d11814d9633b32756549a12e13bd3/1040g00831oqla9fh1q1g5q8jvk3tor58gvvepko!nd_dft_wlteh_webp_3", "width": 1080, "height": 1423}, {"idx": 4, "url": "https://sns-webpic-qc.xhscdn.com/202605121322/cf9d573f45002ac3e830768df02516cc/1040g00831oqla9fh1q205q8jvk3tor58vpaqph8!nd_dft_wlteh_webp_3", "width": 1080, "height": 1419}, {"idx": 5, "url": "https://sns-webpic-qc.xhscdn.com/202605121322/961292c83e3dc5c2c31a87fab87c8412/1040g00831oqla9fh1q2g5q8jvk3tor58hpvhc9g!nd_dft_wlteh_webp_3", "width" 3", "nickname": "不买立省百分百", "content": "求模板[皱眉R][皱眉R]", "like_count": 0, "sub_comment_count": 0, "publish_time_ms": 1777354802000, "ip_location": "湖北", "pictures": []}]}, {"note_id": "6911f0ab00000000030371e5", "xsec_token": "ABx9f9Gy1LdXiBRn3hamtHv4PqhnpEqBoubQ2NdaUYAeY=", "url": "https://www.xiaohongshu.com/explore/6911f0ab00000000030371e5?xsec_token=ABx9f9Gy1LdXiBRn3hamtHv4PqhnpEqBoubQ2NdaUYAeY=&xsec_source=pc_search", "type": "normal", "title": "研究生开题报告可以这样写（无痛版）", "body": "开题报告难的两座大山，文献 zongshu 和研究内容。其中因为文献阅读的少，写 zongshu 是很难的一件事，不知道从哪儿开始，更不知道怎么组织。此外，研究内容没思路，至少两个研究内容，可脑袋空空，感觉啥思路都没有，根本不知道该怎么动笔。\n\t\n别焦虑，无痛版的教程来啦！划重点：开题报告的核心是展示你的研究思路和潜力，它不是最终的毕业报告，学校的开题报告不查重！所以，咱们的目标是高效、清晰地展示一个可行的研究计划。关于文献 zongshu， 去找几篇你研究方向的硕博毕业报告，把Survey进行结合即可。其实，直接复制一篇的也不是不可以，重点是不查重！关于研究内容，去找你们方向的比较新的好文章！你可以借鉴其中直接找两篇baseline，直接复制，作为你开题的研究内容。记住，开题报告里的研究内容和你最终毕业报告的内容可以不一样！只要大方向一致（比如都是做图像检测），具体技术和是可以在后续研究中不断调整和优化的。有一点要注意，文献数量：硕士至少准备 40 篇，博士至少 100 篇。近 3-5 年的文献占比最好达到 40% 左右，说明你了解前沿动态。#开题报告[话题]# #研究生[话题]# #科研狗[话题]#", "author_id": "6790d75f000000000e011b68", "author_nickname": "小小研究僧", "publish_time_ms": 1762783403000, "ip_location": null, "liked_count": 175, "collected_count": 156, "comment_count": 28, "share_count": 18, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778563434004, "tags": ["开题报告", "研究生", "科研狗"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121323/05e292becb1000acea55b3676af82b08/1040g2sg31on6qh3h0gl05psgqtfji6r81i0ng88!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": [{"comment_id": "69154aa8000000003901ffda", "parent_id": null, "user_id": "62094a7b000000001000e09d", "nickname": "什么时候能毕业", "content": "准备开题了，论文都没看几篇，还来得及吗[哭惹R]", "like_count": 1, "sub_comment_count": 1, "publish_time_ms": 1763003048000, "ip_location": "广西", "pictures": []}, {"comment_id": "69120d0c0000000037012501", "parent_id": null, "user_id": "66afa12b000000001d031158", "nickname": "早日毕业😇😇😇", "content": "老师开题报告是指后面的大论文吗", "like_ : "", "body": "", "author_id": null, "author_nickname": null, "publish_time_ms": null, "ip_location": null, "liked_count": null, "collected_count": null, "comment_count": null, "share_count": null, "image_count": 0, "video_url": null, "video_duration_ms": null, "crawled_at": 1778563547656, "tags": [], "at_users": [], "images": [], "comments": []}, {"note_id": "69e5847d0000000023013304", "xsec_token": "ABkJoFWr2C4FcvxBqqpqAXJEJ2uxcDN6AtekE6X8fCO1s=", "url": "https://www.xiaohongshu.com/explore/69e5847d0000000023013304?xsec_token=ABkJoFWr2C4FcvxBqqpqAXJEJ2uxcDN6AtekE6X8fCO1s=&xsec_source=pc_search", "type": "normal", "title": "谁家开题报告这么完美啊啊啊啊！！", "body": "急性脑梗死是神经内科发病率、致残率、致死率最高的脑血管急症，随着人口老龄化加剧，我国老年脑梗死患者数量持续攀升。\n\t\n该病发病急、进展快，极易造成脑组织缺血缺氧坏死，引发肢体偏瘫、言语障碍、意识障碍等严重神经功能缺损，多数患者遗留长期后遗症，严重降低生存质量，同时给家庭、社会带来沉重医疗与照护负担。同型半胱氨酸是体内蛋氨酸代谢产物，是脑血管疾病独立危险因素，高水平同型半胱氨酸可损伤血管内皮、加重动脉粥样硬化、促进血栓形成，升高脑梗死发病、复发及病情加重风险。临床常规入院即可检测该指标，操作简单、价格低廉，但基层及日常诊疗中对其与神经功能损伤、患者短期预后关联关注度不足。\n\t\n现有相关研究大量脱离毕业生实际能力，盲目开展基因多态性、信号通路机制、动物模型造模等复杂基础研究，周期长、成本高、无实验条件；部分研究样本量偏小，未排除房颤、高血压、糖尿病、吸烟饮酒、凝血异常等混杂干扰因素，分组混乱、结论可信度低；还有多项指标联合构建复杂预测模型，统计难度远超本科生科研水平，无法按时完成论文。\n\t\n本研究立足神经内科临床真实诊疗工作，摒弃空洞理论与不必要基础实验，仅围绕血清同型半胱氨酸、神经功能缺损、短期预后单一方向开展回顾性分析，依托院内病历系统即可完成全部数据收集，流程简单、逻辑严谨、落地性强，既满足科研教学要求，又能直接指导临床高危筛查、病情评估与预后判断。\n#护理专业[话题]# #护理研究生[话题]# #护理人文关怀[话题]# #开题[话题]# #开题报告[话题]# #论文格式[话题]# #毕业论文格式排版[话题]# #文献综述模版[话题]#", "author_id": "685cf1cb000000001b0190e2", "author_nickname": "开题祖师", "publish_time_ms": 1776649341000, "ip_location": "河南", "liked_count": 5, "collected_count": 1, "comment_count": 1, "share_count": 1, "image_count": 3, "video_url": null, "video_duration_ms": null, "crawled_at": 1778563611818, "tags": ["护理专业", "护理研究生", "护理人文关怀", "开题", "开题报告", "论文格式", "毕业论文格式排版", "文献综述模版"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121326/0f85a819522c3abb4a56f225c2f4c0ba/1040g00831v5qlb3b1m5g5q2su75mr472q13dnc0!nd_dft_wlteh_webp_3", "width": 580, "height": 788}, {"idx": 1, "url": "https://sns-webpic-qc.xhscdn.com/2 r_nickname": "陈陈", "publish_time_ms": 1745032650000, "ip_location": null, "liked_count": 246, "collected_count": 21, "comment_count": 97, "share_count": 42, "image_count": 1, "video_url": null, "video_duration_ms": null, "crawled_at": 1778563873133, "tags": ["硕士", "硕士毕业论文", "论文辅导", "写论文的精神状态", "研究生论文", "sci辅导", "小论文投稿", "研究生", "博士", "小论文", "sci", "硕士开题报告", "很担心研究生的精神状态", "读研心态调节", "论文指导", "硕士论文选题", "学硕", "博士论文", "研究生生活", "论文写作", "开题"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121331/a5e4eae0ea4442643c1565f5fb7e9afd/notes_pre_post/1040g3k831gemeghrjoc05od4g95411gk15r7k28!nd_dft_wlteh_webp_3", "width": 1200, "height": 1600}], "comments": []}, {"note_id": "6807c10a000000001200f36b", "xsec_token": "ABPzDIkrDAkQfYl99Dy9jkodIxh-PhrQbXeZMSYMdbi1A=", "url": "https://www.xiaohongshu.com/explore/6807c10a000000001200f36b?xsec_token=ABPzDIkrDAkQfYl99Dy9jkodIxh-PhrQbXeZMSYMdbi1A=&xsec_source=pc_search", "type": "normal", "title": "研二下：开题报告邪修式写法（一天6000字）", "body": "今天从3000字到10000字\n终于写上手了\n\t\n-\n\t\n昨天下午加今天上午\n综述删删减减越来越少\n后来突然意识到开题报告不查重\n又要求综述写8000以上\n那其实也不必句句修改\n\t\n具体方法如下\n（学术混子可以参考）\n\t\n-\n\t\n①找两三篇同类硕论复制其研究现状\n利用这几篇硕士论文的综述来搭自己的框架\n全部粘进空白Word按照自己想法排列组合\n\t\n②打开知网首页输入文章关键词（no高级搜索）\n对搜到的所有文章进行浏览\n一看题目是否沾边二看是否是核心期刊三看摘要\n三重筛选选定需要的文章\n\t\n③根据①中的框架找需要的段落（no全文都看）\n总结复制，粘回Word，一篇文章即完成\n\t\n④对选中的文章拉到最后看引用\n找题目合适、刊物合适的\n然后返文内回去看描述\n句子合适的话直接复制进Word，又多一篇引用👍\n不合适的点进去重复③\n\t\n⑤如此反复粘贴过50篇应该也有自己的想法了\n或者说知道自己该有什么观点了\n最后进行整理，插入自己的观点\n\t\n-\n\t\n注意：\n1.不要引用硕士论文，开始看的那几篇硕士论文是为了有个大概框架，以及快速引用十几篇文章用的。\n\t\n2.我个人认为论文是改出来的，先把有用的都复制进去再说，先把字数凑够了再慢慢删。\n\t\n3.框架要搭到三级标题，可以在缝综述的时候把有用的部分全记下来，再做排列组合。\n\t\n❗4.我是学术混子，创造学术垃圾，毕业第一，有理想追求的不要学。\n\t\n-\n逼急了人是这样的\n很邪修了\n\t\n#读研[话题]# #研究生[话题]# #硕士开题报告[话题]# #硕士毕业论文[话题]# #研究生生活[话题]# #研究生论文[话题]# #plog[话题]##论文初稿[话题]# #很担心论文人的精神状态[话题]# #100天运动打卡挑战[话题]#", "author_id": "5ea46cd500000000010073aa", "author_nickname": "菠萝薯塔", "publish_time_ms": 1745338634000, "ip_location": null, "liked_count": 9020, "collected_count": 9618, "comment_ 论文初稿", "大学生", "学习", "干货", "写论文", "毕业"], "at_users": [], "images": [{"idx": 0, "url": "https://sns-webpic-qc.xhscdn.com/202605121331/6e1a44486e85994eea328f9ad6808a91/1040g00831obhsgilmm0049nceqp8nriuj9e1rio!nd_dft_wlteh_webp_3", "width": 1234, "height": 1645}], "comments": []}, {"note_id": "6958a0d5000000001e00033b", "xsec_token": "AB9-oDA4tKPIDW0ds_sgNC74DOJHntsUdlEBXyGyTfP2c=", "url": "https://www.xiaohongshu.com/explore/6958a0d5000000001e00033b?xsec_token=AB9-oDA4tKPIDW0ds_sgNC74DOJHntsUdlEBXyGyTfP2c=&xsec_source=pc_search", "type": "normal", "title": "浅浅说一下如何速成一份通过答辩的开题报告", "body": "先声明：本人从湘大保研至湖大，保研过程中获得山大、外交学院、兰大等10多所学校offer，湖大研三，说一下怎么速成一份能通过答辩的开题报告（仅以自己为例，每个学校的文件格式不一样哦，记得调整）\n1⃣️开题最重要的就是选题确定好\n▪️指令：我现在快要交开题报告了，但是我还没有确定选题，我的专业是马克思主义理论，研究方向是思想政治教育，有一点想跟数字赋能结合，请你从专业导师的角度出发，给我一些关于论文选题的建议\n▪️没确定好选题，开完题之后你又要大改（选题注意事项如图），开题写好相当于论文完成1/4\n▪️找好题之后一定要看一下相关的文献，确定可写再联系导师，不然导师一问你就三不知\n2⃣️开题报告的主要内容（如图，记得保存）\n▪️指令：根据你的建议，我准备写数字赋能视域下高校思政课教学模式创新与育人成效研究，请你根据我的附件上所写我校开题报告的主要内容，帮我写一份开题报告，供我参考\n▪️注意它给出的大纲只能参考，尤其是文献综述、参考文献等有些部分不能抄，我们硕士论文一定要有文献支撑，你一定要看，不然开题会被喷的体无完肤\n▪️我们开题报告的字数虽然没有限制，但它基本上是要作为我们硕士论文的第一章内容以及一部分第二章，整体的论文大纲，所以他很重要，在一定程度上决定你后续的中期、结题答辩是否顺利进行\n3️⃣根据大纲调整所写内容\n▪️指令：请你在上述开题报告的内容基础上，帮我详细写一下选题背景，我想从“源于领导人关于高校思政课的重要阐述”“基于国家对数字化的重要指示”“鉴于数字化时代高校思政课改革创新的内在需求”三个角度展开论述\n▪️这个需要融入自己的思考才能进行详细的阐述，可以先看看文献，在完成文献综述部分后，在做调整，不然你也写不出我写的上述这三个小部分标题，当然你也可以让它给你一点建议\n🌟嘻嘻，美滋滋呀，有什么不会写的指令可以问我哦～#研究生[话题]# #保研[话题]# #研究生日常[话题]# #论文指导[话题]# #开题[话题]# #毕业答辩[话题]# #研究生论文[话题]# #论文写作[话题]# #开题[话题]# #开题报告[话题]# #笔记灵感[话题]# #研究生[话题]# #论文[话题]# #保研[话题]# #开题报告[话题]# #开题答辩[话题]# #开题报告怎么写[话题]#", "author_id": "5b4775d111be100264520fc1", "author_nickname": "young", "publish_time_ms": 1767416021000, "ip_location": null, "liked_count": 1662, "collected_count": 1583, "comment_count": 24, "share_count": 163, "image_count": 8, "video_url": null, "video_duration_ms": null, "crawled_at": 1778564028169, "tags": ["研究生", "保研", "研究生日常", "论文指导", "开题", "毕业答辩", "研究生论文", "论文写作", "开题报告", "笔记灵感", "论文", "开题答辩", "开题报告怎么写"], "at_users": [], "imag
